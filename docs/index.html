class UthSession {
  /** The stack a new player opens with, in units of the Ante. */
  static          STARTING_STACK = 200;

                   table          ;
          locale         = 'en';

  /** The stack, the bet being built and the last bet dealt, in chips (round 6b). */
          chips           = newChipBook();
  /** Chips per unit of the hand on the felt: the Ante, fixed when it is dealt. */
          handBet = 1;
          hands = 0;
          decisions = 0;
          correct = 0;
          evLost = 0;
          netUnits = 0;
          closeCalls = 0;
          closeCallsCorrect = 0;
          bySeverity = zeroSeverity();
          lifetimeDecisions = 0;
          history                  = [];

  /** The Ultimate rating (round 10): its own ladder, never Blackjack's, Basic mode only. */
          rating         = newRating('basic');
  /**
   * The rating as the hand on the felt was dealt. A save taken mid-hand keeps
   * this, as it keeps the counters without that hand's decisions.
   */
          ratingAtDeal         = newRating('basic');
  /** What the last graded decision did to it, for the card; null when it was not rated. */
          lastRatingDelta                = null;

  /*
   * Trips (round 11; spec A as approved). An optional bet on the player's own
   * seven cards, paid by paytable I, never graded: it changes no decision, so the
   * solver, the grades, the rating, the track, EV-lost and accuracy never see it.
   * Its amount is its own, anywhere inside the table limits, empty by default,
   * and it stays for the next hand like the Ante.
   */
          trips           = { stack: 0, bet: 0, lastBet: 0, placed: [] };
  /** The Trips bet on the felt for the hand being played; 0 for none. */
          handTrips = 0;
  /** The last settled hand's Trips, for its settlement line. */
          lastTrips                                           = null;
  /** For the Stats row: hands with Trips, chips put on it, and what it did net. */
          tripsHands = 0;
          tripsWagered = 0;
          tripsNet = 0;
  /** The hand whose settlement says what Trips costs: the first Trips hand of the sitting. */
          tripsNoteHand                = null;

  /** Decisions of the hand on the felt, saved when it settles. */
          pending                     = [];
          lastNet                = null;

  /** The last graded decision, kept so a language change can re-word the card. */
          last                                                                                 = null;

  constructor(seed         ) {
    this.table = new UthTable(seed === undefined ? {} : { seed });
  }

  setLocale(locale        )       {
    this.locale = locale;
  }

  /** Post Ante and Blind and deal. */
  deal()          {
    const phase = this.table.view.phase;
    if (phase !== 'idle' && phase !== 'settled') {
      throw new Error('Finish the hand before dealing another');
    }
    if (needsRebuy(this.chips)) throw new Error('The stack is below the table minimum: take the free rebuy first');
    if (!validBet(this.chips.bet)) throw new Error(`An Ante is between ${TABLE_LIMITS.min} and ${TABLE_LIMITS.max}`);
    this.table.startHand();
    // The Ante is the bet, and the Blind always equals it: both onto the felt.
    // The stack may go below zero here; the hand still plays (option B).
    this.handBet = this.chips.bet;
    this.chips = {
      ...this.chips,
      lastBet: this.chips.bet,
      stack: roundChips(this.chips.stack - 2 * this.handBet),
    };
    this.lastNet = null;
    this.last = null;
    this.pending = [];
    this.ratingAtDeal = { ...this.rating };
    this.lastRatingDelta = null;
    // Trips, when there is one: its own amount, off the stack with the Ante and Blind.
    this.handTrips = this.trips.bet;
    this.lastTrips = null;
    if (this.handTrips > 0) {
      this.trips = { ...this.trips, lastBet: this.trips.bet };
      this.chips = { ...this.chips, stack: roundChips(this.chips.stack - this.handTrips) };
    }
    return this.view;
  }

  /**
   * Compute the current decision point's evaluation now, so the grading click
   * that follows is instant.
   *
   * The page calls this straight after the flop is drawn. The solve runs while
   * the cards are still animating in — CSS transforms run on the compositor, so
   * the turn-over does not stall — and by the time the player can press a
   * button the answer is already cached on the table.
   */
  prepare()                                     {
    const legal = this.table.legalActions();
    if (legal.length === 0) return { solveMs: 0, phase: this.table.view.phase };
    const evaluation = this.table.evaluate();
    return { solveMs: evaluation.solveMs, phase: evaluation.phase };
  }

  act(action           )          {
    const holeClass = this.table.holeClass;
    // Read before acting: `act()` moves the phase on and clears the cache.
    const evaluation            = { ...this.table.evaluate() };
    if (evaluation.phase === 'river') {
      /*
       * The same 990 holdings the river was graded on, asked which ones beat the
       * player most narrowly. Counted again rather than read off the grade, and
       * held to the solver's counts by a test in the engine.
       */
      const view = this.table.view;
      const odds = riverOdds(view.hole, view.board, 3);
      evaluation.threats = odds.closest.map((g) => ({ category: g.category, ranks: g.ranks, count: g.count }));
      evaluation.covered = odds.closest.reduce((sum, g) => sum + g.count, 0) === odds.losses;
      evaluation.playerValue = odds.playerValue;
    }
    const record = this.table.act(action);
    this.last = { record, evaluation, holeClass };
    this.count(record, evaluation);

    const raise = { raise4x: 4, raise3x: 3, raise2x: 2, raise1x: 1 }[action          ];
    // A raise is the rule's multiple of the Ante: 4× on an Ante of 5 is 20.
    if (raise !== undefined) {
      this.chips = { ...this.chips, stack: roundChips(this.chips.stack - raise * this.handBet) };
    }

    const view = this.table.view;
    if (view.phase === 'settled' && view.settlement) {
      const settlement = view.settlement;
      // Everything staked comes back, plus or minus what it won — in chips, at the bet.
      this.chips = {
        ...this.chips,
        stack: roundChips(this.chips.stack + (2 + settlement.playBet + settlement.net) * this.handBet),
      };
      this.lastNet = roundChips(settlement.net * this.handBet);
      this.netUnits += settlement.net;
      this.hands++;
      const hand = this.table.handRecord;
      /*
       * Trips settles on the player's own seven cards, whatever the dealer holds
       * and even after a fold: "If the player has a three of a kind or better,
       * the Trips wager always wins - even if the player folds" (California
       * Bureau of Gambling Control, Standard Game: Ultimate Texas Hold'em, rev.
       * March 2015). A fold happens only on the river, so all seven are face up.
       *
       * It is kept out of the hand's own figure: the grade, the track, the strip
       * and the stack's swing measure the play, and Trips is a cost stated on its
       * own line. Its chips never move across the felt, win or lose.
       */
      let trips                                               ;
      if (this.handTrips > 0) {
        const multiple = tripsResult(bestFive([...hand.hole, ...hand.board]).value, UTH_TRIPS_PAYTABLE);
        trips = { bet: this.handTrips, multiple };
        this.chips = { ...this.chips, stack: roundChips(this.chips.stack + this.handTrips * (1 + multiple)) };
        this.tripsHands++;
        this.tripsWagered += this.handTrips;
        this.tripsNet = roundChips(this.tripsNet + this.handTrips * multiple);
        if (this.tripsNoteHand === null) this.tripsNoteHand = hand.id;
      }
      this.lastTrips = trips ?? null;
      this.history.unshift({
        id: hand.id,
        hole: [...hand.hole],
        dealerHole: [...hand.dealerHole],
        board: [...hand.board],
        holeClass: hand.holeClass,
        settlement: { ...settlement },
        decisions: this.pending,
        bet: this.handBet,
        ...(trips ? { trips } : {}),
      });
      this.history.length = Math.min(this.history.length, UTH_HISTORY_KEPT);
      this.pending = [];
    }
    return this.view;
  }

  /** The same counters, and the same close-call rule, as Blackjack's `absorb`. */
          count(record                   , evaluation           )       {
    const evs = record.legalActions
      .map((a) => record.evByAction[a] ?? 0)
      .sort((a, b) => b - a);
    const closeCall = evs.length > 1 && evs[0]  - evs[1]  < UTH_CLOSE_CALL;
    const correct = record.evCost === 0;

    this.decisions++;
    this.lifetimeDecisions++;
    if (correct) this.correct++;
    this.evLost += record.evCost;
    this.bySeverity[record.severityTier]++;
    if (closeCall) {
      this.closeCalls++;
      if (correct) this.closeCallsCorrect++;
    }

    // Rated from the EVs the grade already holds: nothing is solved to rate it,
    // and the grade itself is untouched. Too obvious to rate means not rated.
    const legalEvs = Object.fromEntries(record.legalActions.map((a) => [a, record.evByAction[a] ?? 0]));
    const difficulty = uthDifficulty(legalEvs);
    this.lastRatingDelta = difficulty === null ? null : updateUthRating(this.rating, difficulty, record.severityTier);

    this.pending.push({
      phase: evaluation.phase,
      legalActions: [...record.legalActions],
      evByAction: { ...record.evByAction },
      optimalAction: record.optimalAction,
      chosenAction: record.chosenAction,
      evCost: record.evCost,
      severityTier: record.severityTier,
      facts: {
        flopRaiseFrequency: evaluation.flopRaiseFrequency,
        riverFoldFrequency: evaluation.riverFoldFrequency,
        wins: evaluation.wins,
        ties: evaluation.ties,
        losses: evaluation.losses,
        threats: evaluation.threats,
        covered: evaluation.covered,
        playerValue: evaluation.playerValue,
      },
    });
  }

  // --- The bet -------------------------------------------------------------

  /**
   * Build the Ante between hands: add a chip, take the last one back, clear it,
   * repeat the last Ante or double it. The table limits are enforced here.
   */
  placeBet(op       , chip         , spot                   = 'ante')       {
    const phase = this.table.view.phase;
    if (phase !== 'idle' && phase !== 'settled') throw new Error('The Ante stays until the hand is over');
    // Trips is its own circle: the same chips, the same limits, its own amount (round 11).
    if (spot === 'trips') this.trips = applyBet(this.trips, op, chip);
    else this.chips = applyBet(this.chips, op, chip);
  }

  /** The free rebuy: only below the table minimum, always back to the starting stack. */
  rebuy()       {
    const phase = this.table.view.phase;
    if (phase !== 'idle' && phase !== 'settled') throw new Error('Finish the hand first');
    this.chips = rebuyBook(this.chips);
  }

  // --- Saving and restoring ------------------------------------------------

  get stats()           {
    // Close calls leave the denominator with their outcomes, as in Blackjack.
    const graded = this.decisions - this.closeCalls;
    const gradedCorrect = this.correct - this.closeCallsCorrect;
    const evLostPer100 = this.hands === 0 ? 0 : (this.evLost / this.hands) * 100;
    return {
      hands: this.hands,
      decisions: this.decisions,
      correct: this.correct,
      accuracy: graded === 0 ? 1 : gradedCorrect / graded,
      closeCallsExcluded: this.closeCalls,
      accuracyIncludingCloseCalls: this.decisions === 0 ? 1 : this.correct / this.decisions,
      evLost: this.evLost,
      evLostPer100,
      bySeverity: { ...this.bySeverity },
      effectiveHouseEdgePercent: uthPerfectPlayEdgePercent() + evLostPer100,
      netUnits: this.netUnits,
    };
  }

  /**
   * The `uth` part of the saved record.
   *
   * Always between hands. A hand still on the felt has not happened yet as far
   * as the record is concerned — its Ante, Blind and any Play bet go back on the
   * balance, and its decisions are not counted — which is how Blackjack treats a
   * hand in progress too. Closing the tab mid-hand therefore costs nothing.
   */
  get progress()                {
    const view = this.table.view;
    const inHand = view.phase !== 'idle' && view.phase !== 'settled';
    const pendingCost = this.pending.reduce((sum, d) => sum + d.evCost, 0);
    const pendingCorrect = this.pending.filter((d) => d.evCost === 0).length;
    const pendingBy = zeroSeverity();
    for (const d of this.pending) pendingBy[d.severityTier]++;

    const unwound = (value        , pending        ) => (inHand ? value - pending : value);
    const bySeverity = zeroSeverity();
    for (const tier of TIERS) bySeverity[tier] = unwound(this.bySeverity[tier], pendingBy[tier]);

    // Close calls inside the unfinished hand come off as well.
    let pendingClose = 0;
    let pendingCloseCorrect = 0;
    if (inHand) {
      for (const d of this.pending) {
        const evs = d.legalActions.map((a) => d.evByAction[a] ?? 0).sort((a, b) => b - a);
        if (evs.length > 1 && evs[0]  - evs[1]  < UTH_CLOSE_CALL) {
          pendingClose++;
          if (d.evCost === 0) pendingCloseCorrect++;
        }
      }
    }

    return {
      version: 2,
      balance: inHand
        ? roundChips(this.chips.stack + (view.ante + view.blind + view.playBet) * this.handBet + this.handTrips)
        : this.chips.stack,
      bet: this.chips.bet,
      lastBet: this.chips.lastBet,
      limits: { ...TABLE_LIMITS },
      hands: this.hands,
      decisions: unwound(this.decisions, this.pending.length),
      correct: unwound(this.correct, pendingCorrect),
      evLost: unwound(this.evLost, pendingCost),
      netUnits: this.netUnits,
      closeCalls: this.closeCalls - pendingClose,
      closeCallsCorrect: this.closeCallsCorrect - pendingCloseCorrect,
      bySeverity,
      lifetimeDecisions: unwound(this.lifetimeDecisions, this.pending.length),
      rating: inHand ? { ...this.ratingAtDeal } : { ...this.rating },
      trips: {
        bet: this.trips.bet,
        lastBet: this.trips.lastBet,
        hands: this.tripsHands,
        wagered: this.tripsWagered,
        net: this.tripsNet,
      },
      history: this.history.map((hand) => ({
        ...hand,
        hole: [...hand.hole],
        dealerHole: [...hand.dealerHole],
        board: [...hand.board],
        settlement: { ...hand.settlement },
        decisions: hand.decisions.map((d) => ({ ...d, legalActions: [...d.legalActions] })),
      })),
    };
  }

  /**
   * Take a saved `uth` part back.
   *
   * Anything that is not a version 1 object — including the nothing a version 1
   * or 2 blob holds, from before Ultimate was saved — leaves the session at zero
   * with a full stack, which is where those players genuinely are. Every number
   * is checked on the way in: a record passed around a family can be half-written.
   */
  restore(saved         )       {
    const phase = this.table.view.phase;
    if (phase !== 'idle' && phase !== 'settled') {
      throw new Error('Restore between hands, not during one');
    }
    this.reset();
    const s = saved                                                                                        ;
    if (!s || typeof s !== 'object' || (s.version !== 1 && s.version !== 2)) return;

    const n = (value         , fallback = 0)         =>
      typeof value === 'number' && Number.isFinite(value) ? value : fallback;

    // A version 1 part has no bet: it opens at 1, the bet all of its hands were played at.
    this.chips = readChipBook(s.version === 2 ? s : undefined, n(s.balance, UthSession.STARTING_STACK));
    this.handBet = 1;
    this.hands = n(s.hands);
    this.decisions = n(s.decisions);
    this.correct = n(s.correct);
    this.evLost = n(s.evLost);
    this.netUnits = n(s.netUnits);
    this.closeCalls = n(s.closeCalls);
    this.closeCallsCorrect = n(s.closeCallsCorrect);
    for (const tier of TIERS) this.bySeverity[tier] = n(s.bySeverity?.[tier]);
    this.lifetimeDecisions = n(s.lifetimeDecisions, this.decisions);
    const rating = s.rating                               ;
    if (rating && typeof rating === 'object' && Number.isFinite(rating.rating)) {
      const rated = Math.max(0, Math.floor(n(rating.ratedDecisions)));
      this.rating = {
        mode: 'basic',
        rating: Math.max(800, Math.min(2200, rating.rating )),
        peak: Math.max(800, Math.min(2200, n(rating.peak, rating.rating ))),
        ratedDecisions: rated,
        provisional: rated < 30,
        // A restored session is a new sitting: nothing has moved in it yet.
        sessionDelta: 0,
      };
    }
    this.ratingAtDeal = { ...this.rating };
    const trips = s.trips                                                            ;
    if (trips && typeof trips === 'object') {
      const bet = typeof trips.bet === 'number' && (trips.bet === 0 || validBet(trips.bet)) ? trips.bet : 0;
      const lastBet = typeof trips.lastBet === 'number' && validBet(trips.lastBet) ? trips.lastBet : 0;
      this.trips = { stack: 0, bet, lastBet, placed: chipsFor(bet) };
      this.tripsHands = Math.max(0, Math.floor(n(trips.hands)));
      this.tripsWagered = Math.max(0, n(trips.wagered));
      this.tripsNet = n(trips.net);
    }
    this.history = (Array.isArray(s.history) ? s.history : [])
      .filter(
        (hand)                        =>
          !!hand &&
          Array.isArray(hand.hole) &&
          Array.isArray(hand.board) &&
          Array.isArray(hand.decisions) &&
          hand.decisions.every((d) => UTH_ACTIONS.includes(d.chosenAction) && TIERS.includes(d.severityTier)) &&
          !!hand.settlement,
      )
      .slice(0, UTH_HISTORY_KEPT);
  }

          reset()       {
    this.chips = newChipBook();
    this.handBet = 1;
    this.hands = 0;
    this.decisions = 0;
    this.correct = 0;
    this.evLost = 0;
    this.netUnits = 0;
    this.closeCalls = 0;
    this.closeCallsCorrect = 0;
    this.bySeverity = zeroSeverity();
    this.lifetimeDecisions = 0;
    this.history = [];
    this.pending = [];
    this.last = null;
    this.lastNet = null;
    this.rating = newRating('basic');
    this.ratingAtDeal = newRating('basic');
    this.lastRatingDelta = null;
    this.trips = { stack: 0, bet: 0, lastBet: 0, placed: [] };
    this.handTrips = 0;
    this.lastTrips = null;
    this.tripsHands = 0;
    this.tripsWagered = 0;
    this.tripsNet = 0;
    this.tripsNoteHand = null;
  }

  // --- What the page draws -------------------------------------------------

  get view()          {
    const table = this.table.view;
    const settled = table.phase === 'settled';
    const inHand = table.phase !== 'idle';
    const iso = isolateFor(this.locale);
    return {
      game: 'uth',
      phase: table.phase,
      hole: table.hole.map(pokerCardView),
      dealerHole: table.dealerHole.map(pokerCardView),
      dealerRevealed: table.dealerRevealed,
      board: table.board.map(pokerCardView),
      boardHidden: inHand ? 5 - table.board.length : 0,
      // Notation for the tooltip; words for the player.
      holeClass: inHand ? this.table.holeClass : null,
      holeWords: inHand ? this.classWords(this.table.holeClass) : null,
      // In chips at the bet: an Ante of 5 posts a Blind of 5, and 4× is 20.
      stake: {
        ante: roundChips(table.ante * this.handBet),
        blind: roundChips(table.blind * this.handBet),
        play: roundChips(table.playBet * this.handBet),
        total: roundChips((table.ante + table.blind + table.playBet) * this.handBet),
      },
      stack: {
        start: UthSession.STARTING_STACK,
        balance: this.chips.stack,
        lastNet: this.lastNet,
      },
      // The rail between hands: the Ante being built, the limits, what may change.
      chips: chipsView(this.chips, !inHand || settled),
      hands: this.hands,
      stats: this.stats,
      // The floor under the effective edge, as the tooltip quotes it.
      rulesEdge: iso(`${uthPerfectPlayEdgePercent().toFixed(2)}%`),
      legalActions: table.legalActions.map((action) => ({
        action,
        label: t(this.locale, ACTIONS[action].label),
        key: ACTIONS[action].key,
        code: ACTIONS[action].code,
      })),
      // The flop is the one decision point that costs a solve. The page asks for
      // it to be done early; this tells the page whether it still needs asking.
      needsPrepare: table.phase === 'flop' || table.phase === 'river',
      feedback: this.last ? this.compose(this.last) : null,
      // The Ultimate rating, for the card and home — never the strip (round 10).
      rating: { ...this.rating, lastDelta: this.lastRatingDelta },
      // Trips (round 11): its circle between hands and on the felt, and its Stats row.
      trips: {
        ...chipsView({ ...this.trips, stack: this.chips.stack }, !inHand || settled),
        onFelt: inHand ? this.handTrips : 0,
      },
      tripsStats: {
        hands: this.tripsHands,
        wagered: this.tripsWagered,
        expectedCost: roundChips((this.tripsWagered * analyseTrips(UTH_TRIPS_PAYTABLE).houseEdgePercent) / 100),
        net: this.tripsNet,
        edge: iso(`${analyseTrips(UTH_TRIPS_PAYTABLE).houseEdgePercent.toFixed(2)}%`),
      },
      settlement:
        settled && table.settlement
          ? this.lines(
              table.settlement,
              this.handBet,
              this.lastTrips && { ...this.lastTrips, cards: [...table.hole, ...table.board] },
              Boolean(this.lastTrips) && this.tripsNoteHand === this.table.handRecord.id,
            )
          : null,
      showdown:
        settled && table.settlement && !table.settlement.folded
          ? this.showdown(table.hole, table.dealerHole, table.board)
          : null,
      history: this.history.map((hand) => this.logEntry(hand)),
      // The decision track, built the way Blackjack's is.
      track: this.history.slice(0, TRACK_HANDS).map(
        (hand, index)           => ({
          index,
          id: hand.id,
          dots: hand.decisions.map((d) => trackDot(d.severityTier, uthCloseCall(d))),
          // In chips at the Ante the hand was dealt at.
          net: roundChips(hand.settlement.net * (hand.bet ?? 1)),
        }),
      ),
      howTo: this.howTo(),
    };
  }

  /**
   * "How to play", including the one line about Trips.
   *
   * Trips is not offered as a bet. What it would cost is not left as a claim:
   * `analyseTrips` works it out exactly under the default paytable, 3.50%.
   */
          howTo()           {
    const trips = analyseTrips(TRIPS_PAYTABLES[0] );
    return [
      t(this.locale, 'uth.howto.1'),
      t(this.locale, 'uth.howto.2'),
      t(this.locale, 'uth.keys'),
      t(this.locale, 'uth.howto.trips', {
        edge: isolateFor(this.locale)(`${trips.houseEdgePercent.toFixed(2)}%`),
      }),
    ];
  }

  // --- Plain words ---------------------------------------------------------

  /**
   * A starting hand in words: "A-K, different suits", "a pair of sevens".
   *
   * "62s" is poker notation, and most of the family does not read it. The
   * notation is kept in the view for a tooltip; everything a player reads first
   * uses this.
   */
          classWords(label        )         {
    const L = this.locale;
    const hi = POKER_RANKS.indexOf(label[0] );
    const lo = POKER_RANKS.indexOf(label[1] );
    if (hi === lo) return t(L, 'uth.class.pair', { p: t(L, `rankPlural.${hi}`) });
    const hilo = isolateFor(L)(`${rankSymbol(hi)}-${rankSymbol(lo)}`);
    return t(L, label.endsWith('s') ? 'uth.class.suited' : 'uth.class.offsuit', { hilo });
  }

  /** A hand described from its category and the ranks that decide it. */
          handPhrase(category              , ranks                   )         {
    const L = this.locale;
    if (category === 8 && ranks[0] === 12) return t(L, 'uthHand.royal');
    return t(L, `uthHand.${category}`, {
      r1: t(L, `rankName.${ranks[0] ?? 0}`),
      p1: t(L, `rankPlural.${ranks[0] ?? 0}`),
      p2: t(L, `rankPlural.${ranks[1] ?? 0}`),
    });
  }

  /**
   * Both final hands, named, with the five cards that make each.
   *
   * `bestFive` asks the same evaluator which five of the seven scored the hand,
   * so the cards ringed on the felt and the ranks in brackets can never disagree
   * with the hand the settlement was paid on.
   */
          showdown(hole        , dealerHole        , board        ) {
    const L = this.locale;
    const iso = isolateFor(L);
    const describe = (cards        , key        ) => {
      const best = bestFive(cards);
      const category = categoryOf(best.value);
      const counts = new Map                ();
      for (const card of best.cards) counts.set(rankOf(card), (counts.get(rankOf(card)) ?? 0) + 1);
      const ordered = [...best.cards].sort((a, b) => {
        const byCount = counts.get(rankOf(b))  - counts.get(rankOf(a)) ;
        return byCount !== 0 ? byCount : rankOf(b) - rankOf(a);
      });
      // A wheel reads 5-4-3-2-A, the way it is played.
      const ranks = ordered.map((card) => rankOf(card));
      const wheel = (category === 4 || category === 8) && ranks[0] === 12 && ranks[1] === 3;
      const shown = wheel ? [...ranks.slice(1), 12] : ranks;
      const phrase = this.handPhrase(category, significantRanks(best.value));
      return {
        words: t(L, key, { hand: phrase, five: iso(shown.map(rankSymbol).join('-')) }),
        cards: best.cards,
        value: best.value,
        phrase,
      };
    };
    const player = describe([...hole, ...board], 'uth.show.you');
    const dealer = describe([...dealerHole, ...board], 'uth.show.dealer');
    return {
      player,
      dealer,
      winner: this.winnerLine(player, dealer),
      legend: t(L, 'uth.show.legend'),
    };
  }

  /**
   * Who won, by the cards, in one plain line (round 7).
   *
   * Only the cards decide it here. Whether the dealer qualified moves the Ante,
   * which the settlement lines already say; it does not make either hand
   * better. The evaluator's values compare directly, so the line can never name
   * a winner the settlement did not pay. When both hands read the same in words,
   * the kicker decided it — or nothing did, and it is a tie.
   */
          winnerLine(player                                   , dealer                                   )         {
    const L = this.locale;
    if (player.value === dealer.value) return t(L, 'uth.show.tie', { hand: player.phrase });
    const youWin = player.value > dealer.value;
    if (player.phrase === dealer.phrase) {
      return t(L, youWin ? 'uth.show.youWinKicker' : 'uth.show.dealerWinsKicker', { hand: player.phrase });
    }
    return t(L, youWin ? 'uth.show.youWin' : 'uth.show.dealerWins', { you: player.phrase, dealer: dealer.phrase });
  }

  // --- The hand log ----------------------------------------------------------

  /**
   * One finished hand, worded now in the current language.
   *
   * The Blackjack log's structure from round 3: a summary that describes the
   * hand rather than one decision in it, then one block per decision under its
   * own header, then the result, quieter than any of it.
   */
          logEntry(hand               )          {
    const L = this.locale;
    // A run of cards is left-to-right notation; inside Hebrew text "7♠ 2♦"
    // otherwise draws as "♠7 ♦2", the suit being a neutral character.
    const cards = (list        ) =>
      isolateFor(L)(
        list
          .map((card) => {
            const v = pokerCardView(card);
            return `${v.rank}${v.suit}`;
          })
          .join(' '),
      );

    const decisions = hand.decisions.map((d, index) => {
      const record                    = {
        sequenceIndex: index,
        handIndex: 0,
        scenarioKey: `uth:${d.phase}`,
        legalActions: d.legalActions,
        evByAction: d.evByAction,
        optimalAction: d.optimalAction,
        chosenAction: d.chosenAction,
        evCost: d.evCost,
        severityTier: d.severityTier,
        timeToDecideMs: null,
      };
      const evaluation            = {
        phase: d.phase,
        evByAction: d.evByAction,
        optimalAction: d.optimalAction,
        ...d.facts,
        solveMs: 0,
      };
      const card = this.compose({ record, evaluation, holeClass: hand.holeClass });
      return {
        header: t(L, card.correct ? 'log.right' : 'log.played', {
          headline: `${card.headline} → ${this.label(d.optimalAction)}`,
          chosen: this.label(d.chosenAction).toLowerCase(),
        }),
        severity: d.severityTier,
        correct: card.correct,
        sentence: card.sentence,
        notes: card.notes,
      };
    });

    const off = decisions.filter((d) => !d.correct).length;
    const summary =
      decisions.length === 1
        ? decisions[0] .header
        : off === 0
          ? t(L, 'log.allRight', { n: decisions.length })
          : t(L, 'log.someOff', { n: decisions.length, bad: off });
    const worst = hand.decisions.reduce              (
      (acc, d) => (TIERS.indexOf(d.severityTier) > TIERS.indexOf(acc) ? d.severityTier : acc),
      'optimal',
    );
    const result = this.lines(hand.settlement, hand.bet ?? 1, hand.trips && { ...hand.trips, cards: [...hand.hole, ...hand.board] });
    const shown = hand.settlement.folded ? null : this.showdown(hand.hole, hand.dealerHole, hand.board);

    return {
      id: hand.id,
      cards: {
        hole: cards(hand.hole),
        dealer: hand.settlement.folded ? null : cards(hand.dealerHole),
        board: cards(hand.board),
      },
      summary,
      severity: worst,
      net: roundChips(hand.settlement.net * (hand.bet ?? 1)),
      decisions,
      showdown: shown ? [shown.player.words, shown.dealer.words, shown.winner] : [],
      lines: result.lines,
      netLine: result.net,
    };
  }

  // --- The card ------------------------------------------------------------

          label(action           )         {
    return t(this.locale, ACTIONS[action].label);
  }

          compose(last   
                              
                          
                      
   )              {
    const { record, evaluation, holeClass } = last;
    const phase = evaluation.phase;
    const correct = record.evCost === 0;
    /*
     * The Ante and the Blind are already on the table at every decision, so
     * they are what "per unit staked" means here — and folding, which forfeits
     * both, reads 0.000: nothing comes back. Break-even is 1.000, as it is in
     * Blackjack. `ev` stays the stored figure, net, in units of the ante.
     */
    const ranked = record.legalActions
      .map((action) => ({
        action,
        label: this.label(action),
        ev: record.evByAction[action] ?? 0,
        value: returned(record.evByAction[action] ?? 0, UTH_STAKE),
      }))
      .sort((a, b) => b.ev - a.ev);

    return {
      phase,
      headline: t(this.locale, `uth.h.${phase}`, { class: this.classWords(holeClass) }),
      correct,
      severity: record.severityTier,
      verdict: correct
        ? t(this.locale, 'fb.correct', { action: this.label(record.optimalAction) })
        : t(this.locale, 'fb.wrong', {
            severity: t(this.locale, `fb.${record.severityTier}`),
            // Round 14, Idan's call: what the mistake cost, on the same scale
            // as the bars an inch below it. `evCost` itself is untouched — the
            // record, the rating, the leaderboard and EV-lost all keep the
            // figure in units of the Ante. Only this line is converted, and
            // only because a player can find the contradiction by subtracting
            // two bars in front of him.
            cost: isolateFor(this.locale)(uthBackGap(record.evCost).replace('+', '')),
          }),
      youChose: correct
        ? null
        : t(this.locale, 'fb.youChose', {
            chosen: this.label(record.chosenAction).toLowerCase(),
            best: this.label(record.optimalAction).toLowerCase(),
          }),
      chosen: record.chosenAction,
      optimal: record.optimalAction,
      evCost: record.evCost,
      ranked,
      returns: {
        stake: UTH_STAKE,
        scaleMax: RETURN_SCALE_MAX,
        best: ranked[0]?.value ?? 0,
        equivalent: equivalentGroups(ranked),
        // The river is the one decision whose odds are exact and countable, so
        // it is the one that can show the player what is behind the figure.
        example:
          phase === 'river' && evaluation.wins !== undefined
            ? {
                kind: 'river',
                win: (evaluation.wins ?? 0) / UTH_DEALER_HANDS,
                tie: (evaluation.ties ?? 0) / UTH_DEALER_HANDS,
                value: ranked.find((row) => row.action === 'raise1x')?.value ?? ranked[0] .value,
              }
            : null,
      },
      sentence: this.sentence(record, evaluation),
      notes: phase === 'preflop' ? this.preflopNotes(holeClass) : phase === 'river' ? this.riverNotes(evaluation) : [],
      solveMs: evaluation.solveMs,
    };
  }

  /**
   * The one sentence, and only facts the solve itself produced.
   *
   * Each describes the spot rather than the choice, so it reads true whether
   * the player got it right or not — with one exception. A 3× raise gets its
   * own sentence, because §5.2.3 is the lesson the button exists to teach and it
   * is a claim about the choice, not the spot: 3× is the best play on none of
   * the 169 starting hands.
   */
          sentence(record                   , evaluation           )         {
    const ev = record.evByAction;
    const L = this.locale;
    const iso = isolateFor(L);

    if (evaluation.phase === 'preflop') {
      if (record.chosenAction === 'raise3x') {
        return t(L, 'uth.s.threeX', {
          cost: iso(uthBackGap(record.evCost).replace('+', '')),
          best: this.label(record.optimalAction).toLowerCase(),
        });
      }
      if (record.optimalAction === 'raise4x') {
        return t(L, 'uth.s.preRaise', {
          gap: iso(uthBackGap((ev.raise4x ?? 0) - (ev.check ?? 0)).replace('+', '')),
        });
      }
      return t(L, 'uth.s.preCheck', {
        flopRaise: uthPercent(evaluation.flopRaiseFrequency ?? 0),
        riverFold: uthPercent(evaluation.riverFoldFrequency ?? 0),
      });
    }

    if (evaluation.phase === 'flop') {
      // On the card's scale, like every other gap quoted beside these figures.
      const gap = Math.abs((ev.raise2x ?? 0) - (ev.check ?? 0));
      return t(L, record.optimalAction === 'raise2x' ? 'uth.s.flopRaise' : 'uth.s.flopCheck', {
        gap: iso(uthBackGap(gap).replace('+', '')),
        riverFold: uthPercent(evaluation.riverFoldFrequency ?? 0),
      });
    }

    /*
     * The river, in percentages a player reads at a glance. The counts are the
     * solver's; the rounding keeps the three shares adding to exactly 100.
     */
    const [win, tie, lose] = wholePercents([evaluation.wins ?? 0, evaluation.ties ?? 0, evaluation.losses ?? 0]);
    return t(L, record.optimalAction === 'raise1x' ? 'uth.s.riverRaise' : 'uth.s.riverFold', {
      win: `${win}%`,
      tie: `${tie}%`,
      lose: `${lose}%`,
      fold: iso('−2'),
    });
  }

  /**
   * On the river: the dealer holdings that beat the player most narrowly.
   *
   * "Only with" is said only when those groups are every holding that beats the
   * player; otherwise the line says they are the closest, which is what they are.
   */
          riverNotes(evaluation           )           {
    const L = this.locale;
    const threats = evaluation.threats;
    if (!threats) return [];
    if (threats.length === 0) return [t(L, 'uth.note.nothingBeats')];
    const player = evaluation.playerValue ?? -1;
    const playerCategory = player >= 0 ? categoryOf(player) : -1;
    const playerNamed = player >= 0 ? significantRanks(player).slice(0, NAMED_RANKS[categoryOf(player)]) : [];
    const phrases = threats.map((threat) => {
      const phrase = this.handPhrase(threat.category, threat.ranks);
      const sameHand =
        threat.category === playerCategory &&
        threat.ranks.length === playerNamed.length &&
        threat.ranks.every((rank, i) => rank === playerNamed[i]);
      return sameHand ? t(L, 'uthHand.kicker', { hand: phrase }) : phrase;
    });
    // "a full house, three jacks and two fours" has a comma of its own, so a
    // list of such hands is separated with semicolons or it cannot be read.
    const sep = phrases.some((phrase) => phrase.includes(',')) ? ';' : ',';
    const list =
      phrases.length === 1
        ? phrases[0] 
        : `${phrases.slice(0, -1).join(`${sep} `)}${sep === ';' ? ';' : ''}${t(L, 'uth.list.or')}${phrases[phrases.length - 1]}`;
    return [t(L, evaluation.covered ? 'uth.note.onlyWith' : 'uth.note.closest', { list })];
  }

  /**
   * Before the flop: what the suit is worth, and the suited-connector surprise.
   *
   * Both come from the table and appear only when true. A suited hand is set
   * beside the same ranks in different suits — the suit flips the decision in 7
   * of the 78 suited classes and only adds value in the rest — and a suited
   * connector gets Idan's line only when the table says check (T9s yes, QJs no).
   * Pairs have no suited twin, and a hand in different suits is not told what a
   * suit would have added: that is the same fact from the other side, and on a
   * hand the player cannot change it is noise.
   */
          preflopNotes(holeClass        )           {
    const L = this.locale;
    const iso = isolateFor(L);
    // A pair can never share a suit, so there is nothing about suits to say.
    if (holeClass.length === 2) return [];
    /*
     * In different suits: the same fact from the other side (round 7). The felt
     * used to say "different suits" beside You; it no longer does, so the card
     * says it here, with what the same ranks would be worth in one suit.
     */
    if (!holeClass.endsWith('s')) {
      const off = bestOf(preflopRow(holeClass));
      const same = bestOf(preflopRow(`${holeClass.slice(0, 2)}s`));
      return [
        t(L, off.action !== same.action ? 'uth.note.suitOffFlips' : 'uth.note.suitOffSame', {
          best: this.label(off.action).toLowerCase(),
          ev: iso(uthBack(off.ev)),
          suitedBest: this.label(same.action).toLowerCase(),
          suitedEv: iso(uthBack(same.ev)),
        }),
      ];
    }
    const suitedRow = preflopRow(holeClass);
    const offRow = preflopRow(`${holeClass.slice(0, 2)}o`);
    const suited = bestOf(suitedRow);
    const off = bestOf(offRow);
    const notes           = [];
    if (suited.action !== off.action) {
      notes.push(
        t(L, 'uth.note.suitFlips', {
          best: this.label(suited.action).toLowerCase(),
          ev: iso(uthBack(suited.ev)),
          offBest: this.label(off.action).toLowerCase(),
          offEv: iso(uthBack(off.ev)),
        }),
      );
    } else {
      notes.push(
        t(L, 'uth.note.suitSame', {
          best: this.label(suited.action).toLowerCase(),
          ev: iso(uthBack(suited.ev)),
          offEv: iso(uthBack(off.ev)),
          gap: iso(uthBackGap(suited.ev - off.ev)),
        }),
      );
    }
    const hi = POKER_RANKS.indexOf(holeClass[0] );
    const lo = POKER_RANKS.indexOf(holeClass[1] );
    if (hi - lo === 1 && suitedRow.optimalAction === 'check') notes.push(t(L, 'uth.note.connector'));
    return notes;
  }

  /**
   * Showdown, as three separate lines.
   *
   * The Ante, the Play and the Blind resolve by three unrelated rules, and one
   * net figure explains none of them. So the dealer's line carries the Ante
   * (which is the only bet qualification touches), then the Play, then the
   * Blind — and the total comes last and quietest.
   */
  /**
   * The settlement's lines, and Trips' after them when a Trips bet was on the
   * hand (round 11): what it paid and on which hand, or that it lost; and, on
   * the first Trips hand of a sitting, the one sentence about what it costs.
   * The hand's own figure stays the play's alone.
   */
          lines(
    s               ,
    perUnit        ,
    trips                                                          ,
    costNote = false,
  )                                                    {
    const out = this.gameLines(s, perUnit);
    if (!trips || trips.bet <= 0) return out;
    const L = this.locale;
    const iso = isolateFor(L);
    const cash = (value        ) => iso(money(roundChips(value)));
    if (trips.multiple > 0) {
      const value = bestFive(trips.cards).value;
      out.lines.push(
        t(L, 'uth.line.tripsPaid', {
          multiple: iso(String(trips.multiple)),
          hand: this.handPhrase(categoryOf(value), significantRanks(value)),
          won: cash(trips.bet * trips.multiple),
        }),
      );
    } else {
      out.lines.push(t(L, 'uth.line.tripsLose', { lost: cash(-trips.bet) }));
    }
    if (costNote) {
      out.lines.push(
        t(L, 'uth.line.tripsCost', { edge: iso(`${analyseTrips(UTH_TRIPS_PAYTABLE).houseEdgePercent.toFixed(2)}%`) }),
      );
    }
    return out;
  }

          gameLines(s               , perUnit        )                                                    {
    const L = this.locale;
    const iso = isolateFor(L);
    // Every figure in chips at the bet; the multiple on the Play bet stays a multiple.
    const cash = (value        ) => iso(money(roundChips(value * perUnit)));
    const bet = iso(`${s.playBet}×`);
    if (s.folded) {
      return {
        lines: [t(L, 'uth.line.folded'), t(L, 'uth.line.foldPlay'), t(L, 'uth.line.forfeit', { lost: cash(-2) })],
        net: t(L, 'uth.line.net', { net: cash(s.net) }),
        folded: true,
      };
    }
    const tie = s.ante === 0 && s.play === 0 && s.blind === 0 && s.dealerQualified;
    if (tie) {
      return {
        lines: [t(L, 'uth.line.tie'), t(L, 'uth.line.playPush', { bet }), t(L, 'uth.line.blindTie')],
        net: t(L, 'uth.line.net', { net: cash(s.net) }),
        folded: false,
      };
    }
    const dealer = s.dealerQualified
      ? t(L, 'uth.line.dealerQualified', { ante: cash(s.ante) })
      : t(L, 'uth.line.dealerNotQualified');
    const play =
      s.play > 0
        ? t(L, 'uth.line.playWin', { bet, play: cash(s.play) })
        : s.play < 0
          ? t(L, 'uth.line.playLose', { bet, play: cash(s.play) })
          : t(L, 'uth.line.playPush', { bet });
    const blind =
      s.blind > 0
        ? t(L, 'uth.line.blindPaid', { blind: cash(s.blind) })
        : s.blindPushed
          ? t(L, 'uth.line.blindPush')
          : s.blind < 0
            ? t(L, 'uth.line.blindLose', { blind: cash(s.blind) })
            : t(L, 'uth.line.blindTie');
    return {
      lines: [dealer, play, blind],
      net: t(L, 'uth.line.net', { net: cash(s.net) }),
      folded: false,
    };
  }
}

</script>

<script>
/* Screen markup, lifted from the pages the local app serves. */
const HOME_HTML = "<div class=\"shell\">\n      <!--\n        The front of the app is a greeting and two doors. Everything measured\n        lives behind a tab, because a wall of figures is not a welcome — and\n        §3.1 would rather you came here to play than to check a scoreboard.\n      -->\n      <section class=\"hero\">\n        <!-- What the app is for, at the door (round 14). The claim is factual:\n             the comparison is this player's own play against the maths, not\n             optimal play against some theoretical alternative. -->\n        <p class=\"slogan\" data-i18n=\"brand.slogan\">Simply winning more hands.</p>\n        <div class=\"hero-top\">\n          <div class=\"initial\" id=\"initial\">P</div>\n          <input class=\"who-name\" id=\"name\" value=\"Player\" data-i18n-value=\"ui.defaultName\"\n                 data-i18n-attr=\"aria-label:ui.yourName\" spellcheck=\"false\" />\n        </div>\n        <p class=\"hero-line\" id=\"greeting\" data-i18n=\"ui.greeting\">Good to see you.</p>\n      </section>\n\n      <section class=\"doors\">\n        <a class=\"door\" href=\"#table\">\n          <span class=\"door-pip\">♠</span>\n          <span class=\"door-title\" data-i18n=\"ui.blackjack\">Blackjack</span>\n          <span class=\"door-sub\" id=\"bj-sub\" data-i18n=\"ui.playAHand\">Play a hand</span>\n        </a>\n        <a class=\"door secondary\" href=\"#ultimate\">\n          <span class=\"door-pip\">♦</span>\n          <span class=\"door-title\" data-i18n=\"ui.ultimate\">Ultimate</span>\n          <span class=\"door-sub\" data-i18n=\"ui.playAHand\">Play a hand</span>\n        </a>\n      </section>\n\n      <nav class=\"tabs\" role=\"tablist\" data-i18n-attr=\"aria-label:ui.yourPlay\">\n        <button class=\"tab\" role=\"tab\" data-tab=\"standing\" aria-selected=\"true\" data-i18n=\"ui.tab.standing\">Standing</button>\n        <button class=\"tab\" role=\"tab\" data-tab=\"hands\" aria-selected=\"false\" data-i18n=\"ui.tab.hands\">Hands</button>\n        <button class=\"tab\" role=\"tab\" data-tab=\"stats\" aria-selected=\"false\" data-i18n=\"ui.tab.stats\">Stats</button>\n      </nav>\n\n      <section class=\"tab-body\" id=\"panel-standing\" role=\"tabpanel\">\n        <!-- Two ratings side by side, each named with its game, never added up (round 10). -->\n        <div class=\"standings\">\n          <div class=\"standing\">\n            <div class=\"standing-value\" id=\"rating\">—</div>\n            <div class=\"standing-label\" id=\"rating-label\" data-i18n=\"ui.rating\">Blackjack rating</div>\n            <div class=\"rating-side\" id=\"rating-swing\" hidden></div>\n            <p class=\"standing-note\" id=\"rating-note\"></p>\n          </div>\n          <div class=\"standing\">\n            <div class=\"standing-value\" id=\"uth-rating\">—</div>\n            <div class=\"standing-label\" id=\"uth-rating-label\" data-i18n=\"home.uthRating\">Ultimate rating</div>\n            <div class=\"rating-side\" id=\"uth-rating-swing\" hidden></div>\n            <p class=\"standing-note\" id=\"uth-rating-note\"></p>\n          </div>\n        </div>\n        <div class=\"modes\" role=\"group\" data-i18n-attr=\"aria-label:ui.drilledOn\">\n          <button class=\"mode\" type=\"button\" data-mode=\"basic\" aria-pressed=\"true\">\n            <span data-i18n=\"ui.mode.basic\">Basic</span><small data-i18n=\"ui.mode.basicNote\">the costly hands</small>\n          </button>\n          <button class=\"mode\" type=\"button\" data-mode=\"recall\" aria-pressed=\"false\">\n            <span data-i18n=\"ui.mode.recall\">Recall</span><small data-i18n=\"ui.mode.recallNote\">thin and rare</small>\n          </button>\n          <button class=\"mode\" type=\"button\" data-mode=\"value\" aria-pressed=\"false\">\n            <span data-i18n=\"ui.mode.value\">Value</span><small data-i18n=\"ui.mode.valueNote\">your own leaks</small>\n          </button>\n        </div>\n        <div id=\"ladder\" class=\"ladder\ /* How a figure is written on screen, for every page (round 8). */
/*
 * How a figure is written on screen (round 8).
 *
 * Results add up in binary. A 6:5 blackjack pays 1.2, and 1.2 − 1 is
 * 0.19999999999999996 to a computer; Idan's strip read +1.4000000000000004. The
 * arithmetic underneath stays exactly as it is — this is how a figure is shown,
 * nothing more — and every units or chips figure a player reads goes through
 * here, so one hand reads the same on the strip, the track and the log.
 *
 * The rule: at most two decimals, trailing zeros dropped. Every real result is a
 * whole number, a half, or a multiple of 0.1 (a 6:5 natural), and chips are
 * those times a whole bet, so two decimals never drop anything a player won:
 * +1.2 stays +1.2, −0.5 stays −0.5, and the binary remainder goes. A real minus
 * sign, a plus only where the sign is the point, and one left-to-right piece in
 * Hebrew so the sign stays beside its number.
 *
 * Lives on `window.EVFigure`. `src/figure.ts` is the same rule for the prose the
 * sessions compose, and a test holds the two to the same output.
 */
(function () {
  /** The figure a player reads, as a number: at most two decimals. */
  function round(value) {
    return Math.round(value * 100) / 100;
  }

  /** The figure as text, without an isolate: "+1.2", "−0.5", "0", "37.5". */
  function plain(value, signed) {
    const rounded = round(value);
    const sign = rounded < 0 ? '−' : signed && rounded > 0 ? '+' : '';
    return `${sign}${String(Math.abs(rounded))}`;
  }

  /** The figure as it goes on screen: kept in one piece inside right-to-left text. */
  function units(value, signed) {
    const text = plain(value, signed);
    return document.documentElement.getAttribute('dir') === 'rtl' ? `⁦${text}⁩` : text;
  }

  /**
   * A return, as round 13 writes it: three decimals, always signed, a real
   * minus sign. Not the two-decimal rule above — a return is a share of a
   * stake, not a number of chips, and the third decimal is where hitting and
   * standing part company. `src/returns.ts` carries the identical rule for the
   * prose the sessions compose, and a test holds the two to the same output.
   */
  function ret(value) {
    const text = Math.abs(value).toFixed(3);
    const figure = Number(text) === 0 ? '0.000' : `${value < 0 ? '−' : '+'}${text}`;
    return document.documentElement.getAttribute('dir') === 'rtl' ? `⁦${figure}⁩` : figure;
  }

  window.EVFigure = { round, plain, units, ret };
})();


/* The decision track, shared by both tables (round 6). */
/*
 * The decision track (round 6).
 *
 * The last twelve hands, newest first: one dot for each decision in its grade's
 * colour, a hollow dash for a hand that ended on the deal, and the hand's result
 * at the end of the row — smaller and muted, because the dots are how the hand
 * was played and the figure is only how it ended (§3.1).
 *
 * Shared by both tables. It draws what the session sends and decides nothing.
 * Every row is drawn the same way whatever came before it: nothing marks a run
 * of green, and nothing grows with one (§16).
 *
 * Everything lives on `window.EVTrack`. The pages are classic scripts sharing
 * one global scope, and each already declares its own `T` and `el`.
 */
(function () {
  const T = (key, params) => (window.EV ? window.EV.t(key, params) : key);
  const OPEN_KEY = 'ev:openHand';

  /** A result as the track prints it: +1, −2, +1.5, 0 — the one figure rule (figure.js). */
  function figure(net) {
    return window.EVFigure.units(net, true);
  }

  function label(row) {
    const net = figure(row.net);
    if (row.dots.length === 0) return T('track.rowNone', { net });
    if (row.dots.length === 1) return T('track.rowOne', { net });
    return T('track.row', { n: row.dots.length, net });
  }

  /**
   * Draw the track into `box`.
   *
   * @param rows the session's `track`, newest first
   * @param game 'bj' or 'uth', so a tap opens the right game's log
   */
  function render(box, rows, game) {
    if (!box) return;
    box.replaceChildren();
    const list = rows || [];

    const title = document.createElement('p');
    title.className = 'track-title';
    title.textContent = T('track.title');
    box.appendChild(title);

    // Kept on screen with a note before the first hand, so the felt does not
    // jump down the moment the first hand ends.
    if (list.length === 0) {
      const empty = document.createElement('p');
      empty.className = 'track-empty';
      empty.textContent = T('track.empty');
      box.appendChild(empty);
      return;
    }

    const items = document.createElement('div');
    items.className = 'track-rows';
    for (const row of list) {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'track-row';
      button.dataset.game = game;
      button.dataset.index = String(row.index);
      button.dataset.handId = String(row.id);
      button.setAttribute('aria-label', label(row));

      const dots = document.createElement('span');
      dots.className = 'track-dots';
      if (row.dots.length === 0) {
        const dash = document.createElement('span');
        dash.className = 'track-dash';
        dots.appendChild(dash);
      }
      for (const tier of row.dots) {
        const dot = document.createElement('span');
        dot.className = `track-dot ${tier}`;
        dots.appendChild(dot);
      }

      const net = document.createElement('span');
      net.className = 'track-net';
      net.textContent = figure(row.net);

      button.append(dots, net);
      button.addEventListener('click', () => open(game, row.index, row.id));
      items.appendChild(button);
    }
    box.appendChild(items);
  }

  /**
   * Open a hand in the log, which lives on the home screen.
   *
   * The request is left where home will find it — in storage, which the local
   * app needs because it is three pages, and on `window`, for a browser with
   * storage switched off. The built page is one document whose screens live in
   * the hash; the local app walks to another page.
   */
  function open(game, index, id) {
    const value = `${game}:${index}:${id}`;
    window.__evOpenHand = value;
    try {
      localStorage.setItem(OPEN_KEY, value);
    } catch {
      // Storage switched off; the value on window still carries it.
    }
    if (typeof HOME_HTML === 'string') location.hash = '#home';
    else location.href = '/home.html';
  }

  /** The hand the track asked for, once: reading it clears it. */
  function takeOpened() {
    let value = window.__evOpenHand || null;
    try {
      value = value || localStorage.getItem(OPEN_KEY);
      localStorage.removeItem(OPEN_KEY);
    } catch {
      // Storage switched off; only the value on window can have been set.
    }
    window.__evOpenHand = null;
    if (!value) return null;
    const [game, index, id] = String(value).split(':');
    if ((game !== 'bj' && game !== 'uth') || !Number.isInteger(Number(index))) return null;
    return { game, index: Number(index), id: Number(id) };
  }

  window.EVTrack = { render, open, takeOpened, figure };
})();

/*

 * one sound they make.

        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) return null;
        const ctx = new Ctx();
        const master = ctx.createGain();
        master.gain.value = 0.25;
        master.connect(ctx.destination);
        window.__evAudio = { ctx, master };
      }
      const held = window.__evAudio;
      if (held.ctx.state === 'suspended') held.ctx.resume();
      return held;
    } catch {
      return null;
    }
  }

  /**
   * One chip click. The same for placing a bet, for the dealer collecting it and
   * for the dealer paying — no parameters, so no outcome can make it louder,
   * longer or different.
   */
  function click() {
    const held = audio();
    if (!held) return;
    const { ctx, master } = held;
    const at = ctx.currentTime;
    const osc = ctx.createOscillator();
    osc.type = 'triangle';
    osc.frequency.value = 1900;
    const gain = ctx.createGain();
    gain.gain.setValueAtTime(0.0001, at);
    gain.gain.exponentialRampToValueAtTime(0.3, at + 0.002);
    gain.gain.exponentialRampToValueAtTime(0.0001, at + 0.03);
    osc.connect(gain).connect(master);
    osc.start(at);
    osc.stop(at + 0.04);
  }

  // --- Motion ----------------------------------------------------------------------

  function still() {
    return Boolean(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  }

  const centre = (rect) => ({ x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 });

  /**
   * A chip crossing the felt, from a place on screen to an element.
   *
   * Nothing is created at all when the player has asked for less motion, and the
   * animation itself lives inside the stylesheet's reduced-motion guard as well,
   * so stillness is the default twice over.
   */
  function fly(from, to, value) {
    if (still() || !from || !to || typeof to.getBoundingClientRect !== 'function') return;
    const start = centre(typeof from.getBoundingClientRect === 'function' ? from.getBoundingClientRect() : from);
    const end = centre(to.getBoundingClientRect());
    const chip = document.createElement('span');
    chip.className = `chip chip-${FACE[value] || 'white'} chip-flight`;
    chip.setAttribute('aria-hidden', 'true');
    chip.style.left = `${end.x}px`;
    chip.style.top = `${end.y}px`;
    chip.style.setProperty('--fly-x', `${start.x - end.x}px`);
    chip.style.setProperty('--fly-y', `${start.y - end.y}px`);
    document.body.appendChild(chip);
    const done = () => chip.remove();
    chip.addEventListener('animationend', done);
    setTimeout(done, 450);
  }

  /** A bet placed: one click, one chip to the spot. */
  function place(from, to, value) {
    click();
    fly(from, to, value);
  }

  /**
   * A hand's chips going where the result sends them, after the reveal.
   *
   * The click comes first and unconditionally: collecting and paying sound the
   * same. Only the direction of the chips differs, which is what a table shows.
   */
  function settle(net, spots, bank, dealer) {
    click();
    const from = spots.filter(Boolean);
    if (net > 0) {
      fly(dealer, bank, 25);
      for (const spot of from) fly(spot, bank, 5);
    } else if (net < 0) {
      for (const spot of from) fly(spot, dealer, 5);
    } else {
      for (const spot of from) fly(spot, bank, 5);
    }
  }

  // --- The rail ----------------------------------------------------------------------

  function button(label, action, disabled, handler) {
    const node = document.createElement('button');
    node.type = 'button';
    node.className = 'action bet-control';
    node.dataset.action = action;
    node.disabled = Boolean(disabled);
    if (typeof label === 'string') node.textContent = label;
    else node.append(label);
    // The dock's hold (dock.js): a tap that arrived with the last one is not a bet.
    node.addEventListener('click', (event) => {
      if (window.EVDock && !window.EVDock.ready()) return;
      handler(event);
    });
    return node;
  }

  function row(box, nodes, extra) {
    const line = document.createElement('div');
    line.className = 'action-row' + (extra ? ` ${extra}` : '');
    line.style.setProperty('--cols', String(nodes.length));
    line.append(...nodes);
    box.appendChild(line);
  }

  /**
   * The controls between hands, into the page's action bar.
   *
   * Below the table minimum it is the rebuy and nothing else: one line saying
   * what it is, and one button. Otherwise the four chips, then Clear, Repeat and
   * Double; the page adds Deal under them.
   *
   * @param bet    (op, chip) => Promise, sending one change to the session
   * @param rebuy  () => Promise
   * @param spot   () => the element a placed chip flies to
   * @param compact  true while the last hand's card is still up
   * @returns 'rebuy' when only the rebuy is shown, 'compact' when the chips wait behind `toggle`
   */
  function controls(box, chips, bet, rebuy, spot, busy, compact) {
    if (chips.needsRebuy) {
      const line = document.createElement('p');
      line.className = 'rebuy-line';
      line.textContent = T('rebuy.line', { n: figure(chips.startingChips) });
      box.appendChild(line);
      row(box, [
        button(T('rebuy.button', { n: figure(chips.startingChips) }), 'rebuy', busy, () => rebuy()),
      ]);
      return 'rebuy';
    }

    /*
     * With the last hand's card still up, the bar stays one row: Deal at the same
     * bet, and the chips one tap away. Three rows of chips under the card covered
     * the player's own cards on a phone at showdown — the five the card rings.
     */
    if (compact) return 'compact';

    row(
      box,
      chips.values.map((value, i) => {
        const face = document.createElement('span');
        face.className = `chip chip-${FACE[value] || 'white'}`;
        face.textContent = value;
        const node = button(face, `chip-${value}`, busy || !chips.canAdd[i], async () => {
          const from = node.getBoundingClientRect();
          await bet('add', value);
          place(from, spot(), value);
        });
        node.classList.add('chip-button');
        node.setAttribute('aria-label', T('bet.chip', { value }));
        return node;
      }),
      'bet-chips',
    );
    row(
      box,
      [
        button(T('bet.clear'), 'bet-clear', busy || !chips.canClear, () => bet('clear')),
        button(T('bet.repeat', { bet: figure(chips.lastBet) }), 'bet-repeat', busy || !chips.canRepeat, () => bet('repeat')),
        button(T('bet.double', { bet: figure(chips.lastBet * 2) }), 'bet-double', busy || !chips.canDouble, () => bet('double')),
      ],
      'bet-tools',
    );
    return 'chips';
  }

  /** The bet as it stands, which opens the chips when tapped. */
  function toggle(chips, open, busy) {
    return button(T('bet.change', { bet: figure(chips.bet) }), 'bet-open', busy, () => open());
  }

  /** Make a bet spot on the felt take its last chip back when tapped, between hands. */
  function spot(node, chips, bet) {
    if (!node || !chips || chips.needsRebuy) return;
    node.classList.add('bet-spot');
    node.setAttribute('role', 'button');
    node.setAttribute('tabindex', '0');
    node.setAttribute('aria-label', T('bet.spot', { bet: figure(chips.bet) }));
    if (!chips.canRemove) {
      node.setAttribute('aria-disabled', 'true');
      return;
    }
    const take = () => bet('removeLast');
    node.addEventListener('click', take);
    node.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        take();
      }
    });
  }

  /** The limits, printed on the felt as a table prints them. */
  function limits(chips) {
    const line = document.createElement('p');
    line.className = 'table-limits';
    line.textContent = T('bet.limits', { range: isolate(`${chips.limits.min}–${chips.limits.max}`) });
    return line;
  }

  window.EVChips = { controls, toggle, spot, limits, place, settle, fly, click, figure, FACE };
})();


/* The dock's settle-in hold, shared by both tables (round 7). */
/*
 * The dock's settle-in hold (round 7).
 *
 * The buttons along the bottom are replaced in place whenever what they offer
 * changes: Take and Decline become Hit and Stand, Stand becomes Deal, Check
 * before the flop becomes Check on it. A quick second tap — a double press, or
 * one tap that registers twice — then lands on the new button under the same
 * finger and plays something the player never chose. Idan hit it on the
 * insurance buttons: the second tap stood the hand, or dealt the next one.
 *
 * So for a moment after the dock starts offering something different, its
 * buttons ignore presses. Long enough to absorb a double press, which lands
 * about 150–250 ms after the first; short enough that nobody reading a new set
 * of buttons before choosing is held up by it. Presses among the same set of
 * buttons are never held, so hitting twice on purpose still hits twice.
 *
 * Shared by both tables. Lives on `window.EVDock`.
 */
(function () {
  const HOLD_MS = 450;
  let mode = null;
  let since = -Infinity;
  const wallClock = () => (typeof performance !== 'undefined' && performance.now ? performance.now() : Date.now());
  let now = wallClock;

  /** Say what the dock offers now. A change starts the hold; the same offer again does not. */
  function enter(next) {
    if (next === mode) return;
    mode = next;
    since = now();
  }

  /** Whether a press on the dock should count yet. */
  function ready() {
    return now() - since >= HOLD_MS;
  }

  /**
   * Run the hold on a clock the caller supplies, or back on the wall clock.
   *
   * The hold is a length of time, so a test that waits it out in real time is
   * really testing how busy the machine is: round 11's full run failed one of
   * these once, with a browser probe loading the machine, and passed it alone a
   * moment later. A test that hands in its own clock and moves it deliberately
   * measures the hold itself, which is the thing worth measuring.
   *
   * The page never calls this. Called with nothing, the wall clock comes back.
   */
  function useClock(fn) {
    now = typeof fn === 'function' ? fn : wallClock;
    mode = null;
    since = -Infinity;
  }

  window.EVDock = { enter, ready, useClock, HOLD_MS };
})();


/* What comes back to you: the decision block, both tables (round 13). */
/*
 * What comes back to you: the decision block (round 13).
 *
 * This replaces the four EV pills. Idan's report from play was that
 * `קלף: -0.463 · ויתור: -0.500 · עצירה: -0.540 · הכפלה: -0.933` never showed
 * which moves are close and which are miles apart, and that the negative
 * figures taught nothing. So:
 *
 *   - one row per legal action, longest bar = best move, because the display
 *     should encourage the right play rather than mark the error;
 *   - a fixed scale, 0 to 2.0, the same on every hand — never scaled to the
 *     hand, which is what lets a player see at a glance whether the hand is
 *     winnable at all;
 *   - two lines running the whole height of the block: where the best action
 *     reaches, so the small gap to each bar is what that move costs, and a
 *     dashed one at 1.0, break-even.
 *
 * No legend: the lines carry their own shape, and their exact meaning lives
 * behind the `?`. Nothing here marks an error — the grade above already said it
 * once, and saying it twice is what §3.1 exists to prevent.
 *
 * The figures themselves come from the session, which knows the stake each spot
 * puts at risk. This file draws them and works nothing out. Shared by both
 * tables; lives on `window.EVReturns`.
 */
(function () {
  const T = (key, params) => (window.EV ? window.EV.t(key, params) : key);
  /** How a return is written, from the one rule every figure goes through. */
  const figure = (value) => window.EVFigure.ret(value);

  /**
   * The help copy's own emphasis and figures, marked up the way the reveal's
   * steps are: `**` around the words that carry the point, numbers set in the
   * display face. Engine copy only — nothing a player typed reaches here — and
   * escaped first regardless.
   */
  function rich(target, text) {
    const escaped = String(text).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    target.innerHTML = escaped
      .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
      .replace(/(?<![\w>])([+−-]?\d+(?:[.,]\d+)?%?)(?![\w<])/g, '<span class="num">$1</span>');
  }

  /** Remembered across sessions: whether the explanation stands open. */
  const HELP_KEY = 'ev:returnsHelp';
  /** How many graded decisions count as "a new player's first hands". */
  const NEW_PLAYER_DECISIONS = 5;

  function readPreference() {
    try {
      return localStorage.getItem(HELP_KEY);
    } catch {
      // A browser with storage switched off still gets the explanation; it just
      // cannot be remembered, which is better than the page failing to draw.
      return null;
    }
  }

  function writePreference(value) {
    try {
      localStorage.setItem(HELP_KEY, value);
    } catch {
      /* nothing to do: the choice lasts as long as the page does */
    }
  }

  /** Open by itself for a new player's first hands; after that, as last left. */
  function helpOpen(decisions) {
    const stored = readPreference();
    if (stored === 'open') return true;
    if (stored === 'closed') return false;
    return decisions <= NEW_PLAYER_DECISIONS;
  }

  const percent = (share) => `${(share * 100).toFixed(2)}%`;

  /** A whole percentage, for the worked example the player is meant to redo. */
  const wholePercent = (value) => `${Math.round(value * 100)}%`;

  function lines(returns, rows) {
    const holder = document.createElement('div');
    holder.className = 'ret-lines';
    // Explicit rows, not `1 / -1`: with no explicit grid rows declared that
    // collapses to a single cell and the line stops being continuous.
    holder.style.gridRow = `1 / span ${rows}`;
    const best = document.createElement('i');
    best.className = 'ret-line ret-best';
    best.style.setProperty('--at', percent(share(returns.best, returns.scaleMax)));
    const even = document.createElement('i');
    even.className = 'ret-line ret-even';
    even.style.setProperty('--at', percent(share(1, returns.scaleMax)));
    holder.append(best, even);
    return holder;
  }

  function share(value, scaleMax) {
    return Math.max(0, Math.min(1, value / scaleMax));
  }

  /**
   * The sentence for actions that print the same figure.
   *
   * On 16 against a ten, hitting and standing differ in the fourth decimal.
   * Both used to be given a fourth decimal so no two chips looked equal, which
   * taught the player a difference that is not there. They are equivalent, and
   * the screen now says so.
   */
  function sameNote(groups, labelOf) {
    if (!groups || groups.length === 0) return null;
    const note = document.createElement('p');
    note.className = 'ret-same';
    note.textContent = groups
      .map((group) => {
        const labels = group.map(labelOf);
        return labels.length === 2
          ? T('ret.same2', { a: labels[0], b: labels[1] })
          : T('ret.sameMany', { list: labels.join(', ') });
      })
      .join(' ');
    return note;
  }

  /**
   * The explanation behind the `?`.
   *
   * Surrender — or folding, in Ultimate — is the anchor, because it is the one
   * figure a player can check without trusting anything: half the bet comes
   * back, always, so it is +0.500 and no arithmetic is involved. The worked
   * example uses this hand's own numbers, never a hard-coded one.
   */
  function helpPanel(feedback, opts) {
    const returns = feedback.returns;
    const box = document.createElement('section');
    box.className = 'returns-help';
    box.id = opts.helpId;

    const add = (key, values) => {
      if (!room()) return;
      written++;
      const p = document.createElement('p');
      rich(p, T(key, values));
      box.appendChild(p);
    };

    /*
     * How much of it is drawn (round 14). The paragraphs are written in one
     * order and a level reads a prefix of them: what the figure is, the anchor
     * a player can check for himself, the worked example, what hitting does,
     * what doubling does, and the two lines. A beginner is shown the first of
     * the same words an expert reads — never different ones.
     */
    const depth = window.EVLevel ? window.EVLevel.helpDepth() : 6;
    let written = 0;
    const room = () => written < depth;

    add('ret.helpWhat');
    add(opts.game === 'uth' ? 'ret.helpFold' : 'ret.helpSurrender');

    const example = returns.example;
    if (example && example.kind === 'bust') {
      add('ret.helpStandBust', { win: wholePercent(example.win), value: figure(example.value) });
    } else if (example && example.kind === 'winPush') {
      add('ret.helpStandPush', {
        win: wholePercent(example.win),
        push: wholePercent(example.push),
        value: figure(example.value),
      });
    } else if (example && example.kind === 'river') {
      add('ret.helpRiver', {
        win: wholePercent(example.win),
        tie: wholePercent(example.tie),
        value: figure(example.value),
      });
    }

    add(opts.game === 'uth' ? 'ret.helpRaise' : 'ret.helpHit');
    add(opts.game === 'uth' ? 'ret.helpUthStake' : 'ret.helpDouble');
    add('ret.helpLines');
    return box;
  }

  /**
   * The whole block, ready to append.
   *
   * @param feedback the graded decision, carrying `ranked` and `returns`
   * @param opts     `game` ('bj' or 'uth'), `decisions` (how many have been
   *                 graded in this session) and an optional `helpId`
   */
  function block(feedback, opts) {
    const returns = feedback.returns;
    const rows = feedback.ranked;
    const section = document.createElement('section');
    section.className = 'returns';
    if (!returns || !rows || rows.length === 0) return section;

    const helpId = opts.helpId || 'returns-help';
    const head = document.createElement('div');
    head.className = 'returns-head';
    const title = document.createElement('span');
    title.className = 'returns-title';
    // The one place the quantity is named, which is what keeps it apart from
    // the chips, the stack and the hand's own figure — those stay net.
    title.textContent = T('ret.title');
    const why = document.createElement('button');
    why.type = 'button';
    why.className = 'returns-why';
    why.textContent = '?';
    why.setAttribute('aria-controls', helpId);
    why.setAttribute('aria-label', T('ret.helpAria'));
    head.append(title, why);
    section.appendChild(head);

    const grid = document.createElement('div');
    grid.className = 'returns-grid';
    grid.appendChild(lines(returns, rows.length));

    rows.forEach((row, index) => {
      const name = document.createElement('span');
      name.className = 'ret-name' + (index === 0 ? ' best' : '');
      name.textContent = row.label;

      const track = document.createElement('div');
      track.className = 'ret-track';
      const bar = document.createElement('i');
      // Longest is best: the strongest colour on the best action, stepping down
      // from there. Nothing is coloured for being wrong.
      bar.className = 'ret-bar';
      bar.style.setProperty('--step', String(Math.min(index, 3)));
      bar.style.setProperty('--len', percent(share(row.value, returns.scaleMax)));
      // Doubling and splitting can lose more than the stake, so a figure can be
      // negative: the bar bottoms out and the figure carries the minus.
      if (row.value <= 0) bar.classList.add('none');
      // Ultimate's river can be worth more than the scale holds; the bar says
      // so at its end rather than the scale being redrawn for one hand.
      if (row.value > returns.scaleMax) track.classList.add('over');
      track.appendChild(bar);

      const fig = document.createElement('span');
      fig.className = 'ret-fig' + (index === 0 ? ' best' : '');
      fig.textContent = figure(row.value);

      // Every cell is placed by hand. The lines below span the whole bar column,
      // and an auto-placed grid *skips* cells something else already occupies —
      // which quietly pushed each bar into the next column along.
      [name, track, fig].forEach((node, column) => {
        if (row.action === feedback.chosen) node.classList.add('chosen');
        node.style.gridColumn = String(column + 1);
        node.style.gridRow = String(index + 1);
        grid.appendChild(node);
      });
    });
    section.appendChild(grid);

    const labelOf = (action) => {
      const found = rows.find((row) => row.action === action);
      return found ? found.label : action;
    };
    const note = sameNote(returns.equivalent, labelOf);
    if (note) section.appendChild(note);

    const help = helpPanel(feedback, { ...opts, helpId });
    let open = helpOpen(opts.decisions ?? 0);
    const apply = () => {
      help.hidden = !open;
      why.setAttribute('aria-expanded', String(open));
    };
    apply();
    why.addEventListener('click', () => {
      open = !open;
      writePreference(open ? 'open' : 'closed');
      apply();
    });
    section.appendChild(help);
    return section;
  }

  window.EVReturns = { block, rich, HELP_KEY, NEW_PLAYER_DECISIONS };
})();


/* How much the app explains, both tables (round 14). */
/*
 * How much the app explains (round 14).
 *
 * The player says, once, how much explanation he wants, and can change it
 * whenever he likes. Three levels: `new`, `intermediate`, `advanced`.
 *
 * TWO RULES HOLD THIS TOGETHER.
 *
 * 1. A LEVEL IS NOT A DIFFICULTY. The grade, the figures, what a mistake cost,
 *    accuracy, EV lost and the rating are identical at all three, and every one
 *    of them is computed and saved at all three. Nothing here reaches a session:
 *    the engines answer in full whatever the level is, and this file only says
 *    how much of that answer is drawn. A player who moves up a level in a month
 *    finds his whole history waiting, measured the same way.
 *
 * 2. ONE EXPLANATION, THREE DEPTHS. Not three texts — three texts drift apart
 *    and start contradicting each other. Every rule below is a *prefix*: a
 *    beginner is shown the first part of the same explanation an expert reads,
 *    never a different one. `test/level.test.ts` checks that literally, as a
 *    subset, so a well-meant "simpler wording for beginners" fails the build.
 *
 * The level is remembered on the device and saved with the player's record, so
 * it follows him to another phone. Lives on `window.EVLevel`.
 */
(function () {
  const KEY = 'ev:level';
  const LEVELS = ['new', 'intermediate', 'advanced'];
  /**
   * What an unanswered app does. The question is asked before the first hand,
   * so this is only reached by a player who arrived before round 14 — and the
   * middle is what he has been reading until now.
   */
  const DEFAULT = 'intermediate';

  const known = (value) => (LEVELS.indexOf(value) >= 0 ? value : null);

  /** The level as stored, or null when the player has never been asked. */
  function read() {
    try {
      return known(localStorage.getItem(KEY));
    } catch {
      return null;
    }
  }

  /** The level to draw by, answered or not. */
  const get = () => read() ?? DEFAULT;

  function set(level) {
    const value = known(level);
    if (!value) return get();
    try {
      localStorage.setItem(KEY, value);
    } catch {
      // Storage off: the choice lasts as long as the page does, which is worse
      // than remembering it and much better than refusing to take it.
    }
    // The strip, the walkthrough and the breakdown all redraw off this.
    try {
      window.dispatchEvent(new CustomEvent('ev:level', { detail: value }));
    } catch {
      /* an environment without CustomEvent still gets the stored value */
    }
    return value;
  }

  const rank = (level) => Math.max(0, LEVELS.indexOf(known(level) ?? get()));

  /**
   * How many of the walkthrough's three steps are drawn.
   *
   * The steps are written as an argument in order — the dealer's card, then the
   * hand, then the two together and what follows from them — so the last one is
   * the conclusion and stands on its own. A beginner reads the conclusion; the
   * other two levels read the argument that reaches it.
   */
  const steps = (level) => (rank(level) === 0 ? 1 : 3);

  /**
   * How many paragraphs of the returns explanation are drawn, in the order the
   * copy is written: what the figure is, the anchor a player can check, the
   * worked example, what hitting does, what doubling does, and the two lines.
   */
  const helpDepth = (level) => [2, 4, 6][rank(level)];

  /** Which cells of the stat strip are shown, in the order the strip has them. */
  const CELLS = ['accuracy', 'evLost', 'edge', 'units'];
  const cells = (level) => [['accuracy', 'units'], ['accuracy', 'evLost', 'units'], CELLS][rank(level)];

  /** The full breakdown of the spot — advanced only, and nowhere else. */
  const breakdown = (level) => rank(level) === 2;

  /** Whether the basics of the game itself are offered, and how much of them. */
  const basics = (level) => [3, 1, 0][rank(level)];

  /** The same measure, in words somebody who arrived today already owns. */
  const PLAIN = { accuracy: 'ui.plain.accuracy', evLost: 'ui.plain.evLost', units: 'ui.plain.units' };

  /** The label inside a strip cell, however the page around it is built. */
  function labelOf(node) {
