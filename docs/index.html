/*
 * Who is playing, on more than one device.
 *
 * The app used to identify a player by a random id in one browser's storage,
 * with the name only a label on it. Typing the same name on a second device
 * therefore created a second player, starting again at 1200 — which is what
 * Idan hit, and it makes the rating, the one number here that is earned slowly,
 * worthless the moment anybody opens the link on their phone.
 *
 * So a player is now a name and a four-digit code. The name is the handle; the
 * code is the proof that the person typing it is the same person as last time.
 *
 * SAY PLAINLY WHAT THIS IS NOT. It is not authentication. The shared table is
 * open by design (see docs/decisions.md), so anyone who can read it can read
 * every `pin_hash` in it, and there are only ten thousand codes to try. Nothing
 * here would stop somebody who wanted to take a name; it stops two family
 * members from colliding by accident, and stops the same person from becoming
 * three players by using three browsers. That is the whole claim, and it is the
 * trade Idan accepted.
 *
 * A forgotten code is not recoverable from inside the app. It is cleared by
 * hand in the Supabase dashboard — see the README.
 */

/**
 * The form of a name that decides whether two people are the same person.
 *
 * Case-folded and trimmed, with runs of inner whitespace collapsed, so
 * "  Idan " and "idan" are one player rather than three. Unicode-normalised
 * first, because Hebrew can be typed with combining marks that look identical
 * and compare differently.
 */
function nameKey(name) {
  return String(name ?? '')
    .normalize('NFC')
    .trim()
    .replace(/\s+/g, ' ')
    .toLocaleLowerCase();
}

/** A code is exactly four digits. Nothing else is offered and nothing else is taken. */
function isValidCode(code) {
  return /^\d{4}$/.test(String(code ?? ''));
}

/**
 * The stored proof: SHA-256 of "<id>:<code>".
 *
 * The id is in there so that the same code chosen by two people does not
 * produce the same hash, which would let one of them recognise the other's.
 * The code itself is never stored, and never leaves the device in plain form.
 */
async function pinHash(id, code) {
  const bytes = new TextEncoder().encode(`${id}:${code}`);
  const digest = await crypto.subtle.digest('SHA-256', bytes);
  return [...new Uint8Array(digest)].map((b) => b.toString(16).padStart(2, '0')).join('');
}

/**
 * What should happen when someone enters a name and a code.
 *
 * Pure: it is handed the rows that already exist under that name and returns a
 * decision, so every branch can be tested without a network or a database. The
 * caller does the writing.
 *
 * Returns one of:
 *   { action: 'create', id, pinHash }   — nobody has this name yet
 *   { action: 'claim',  id, pinHash }   — one row, no code on it yet; take it
 *   { action: 'adopt',  id, pinHash }   — the code matches; this is them
 *   { action: 'refuse', reason }        — it does not match, or the code is malformed
 */
async function decideIdentity(name, code, rows, newId) {
  if (nameKey(name).length === 0) return { action: 'refuse', reason: 'no-name' };
  if (!isValidCode(code)) return { action: 'refuse', reason: 'bad-code' };

  // A row that has been merged into another is not a candidate; the row it
  // points at is the one that answers for that name.
  const live = (rows ?? []).filter((row) => !row.mergedInto && !row.merged_into);

  if (live.length === 0) {
    const id = newId();
    return { action: 'create', id, pinHash: await pinHash(id, code) };
  }

  /*
   * More than one row for a name should be impossible once the unique index is
   * in place, but the index is added by a migration and old data predates it.
   * The row with the most decisions behind it is the one worth answering with —
   * the same rule the migration uses when it merges.
   */
  const best = [...live].sort(
    (a, b) => (b.lifetimeDecisions ?? b.decisions ?? 0) - (a.lifetimeDecisions ?? a.decisions ?? 0),
  )[0];

  const stored = best.pinHash ?? best.pin_hash ?? null;
  if (!stored) {
    // An existing player from before codes existed. The first person to type
    // the name sets its code and takes the row — which is the only thing that
    // can be done without asking someone who is not here.
    return { action: 'claim', id: best.id, pinHash: await pinHash(best.id, code) };
  }

  const offered = await pinHash(best.id, code);
  // The hash comes back with the decision (round 9). Without it a second device
  // adopted the row holding no hash of its own, and its next save wrote the row's
  // code away — after which anyone typing the name could claim it.
  if (offered === stored) return { action: 'adopt', id: best.id, pinHash: offered };

  // Never create a second player with the same name. A wrong code is a wrong
  // code, and silently making a new player is how duplicates happen.
  return { action: 'refuse', reason: 'wrong-code' };
}


/*
 * Where the shared table lives.
 *
 * The app runs in two places and they store things differently: published on
 * claude.ai it has the artifact's own document store, and served as a plain page
 * it has whatever HTTP backend it was built with. Rather than teach the app both,
 * each is wrapped to the same small interface and the app is handed whichever
 * one answers.
 *
 *   load(id)                 -> { progress, feed } or null
 *   save(id, record)         -> void
 *   watch(onRows)            -> unsubscribe
 *   findByName(nameKey)      -> rows already using that name
 *   usage()                  -> how much each live player has played (round 9)
 *   uthBoard()               -> live players ranked by their Ultimate rating (round 10)
 *
 * A record is one player: their summary for the leaderboard, their saved
 * session, and their few most recent showable hands. One logical record per
 * person, however the backend underneath chooses to keep it.
 *
 * Both are optional. When neither answers, the app plays exactly as well and
 * simply has no leaderboard — see `renderLeaderboard`.
 */

/** How often the HTTP backend re-reads the table. */
const POLL_MS = 20_000;

/**
 * The artifact's document store.
 *
 * Three documents rather than one, because the leaderboard is a live query over
 * the summaries and there is no reason to ship every player's full saved session
 * to every viewer just to draw a ranked list.
 */
function artifactBackend(db) {
  return {
    async load(id) {
      const [summary, saved, feed] = await Promise.all([
        db.doc(`players/${id}`).get(),
        db.doc(`players/${id}/history/recent`).get(),
        db.doc(`feed/${id}`).get(),
      ]);
      return {
        progress: saved.exists ? (saved.data()?.progress ?? null) : null,
        feed: feed.exists ? (feed.data()?.items ?? []) : [],
        mergedInto: summary.exists ? (summary.data()?.mergedInto ?? null) : null,
        updatedAt: summary.exists ? (summary.data()?.at ?? null) : null,
      };
    },

    /* Ranked by the Ultimate rating the summaries carry; players never rated in Ultimate are not on it. */
    async uthBoard() {
      const snap = await db.collection('players').get();
      return snap.docs
        .map((d) => ({ id: d.id, ...d.data() }))
        .filter((row) => !row.mergedInto && typeof row.uthRating === 'number')
        .sort((a, b) => b.uthRating - a.uthRating)
        .slice(0, 60)
        .map((row) => ({
          id: row.id,
          name: row.name,
          rating: row.uthRating,
          provisional: row.uthProvisional !== false,
          decisions: row.uthDecisions ?? 0,
        }));
    },

    /* The summaries carry the day count and both games' decisions, so nobody's session is read. */
    async usage() {
      const snap = await db.collection('players').get();
      return snap.docs
        .map((d) => d.data())
        .filter((row) => !row.mergedInto)
        .map((row) => ({
          name: row.name,
          blackjack: row.lifetimeDecisions ?? row.decisions ?? 0,
          ultimate: row.uthDecisions ?? 0,
          activity: row.activity ?? null,
          at: row.at ?? 0,
        }));
    },

    async save(id, record) {
      const { progress, feed, ...summary } = record;
      // nameKey and pinHash ride with the summary, so a name can be looked up
      // and a returning player recognised without reading anyone's session.
      await Promise.all([
        db.doc(`players/${id}`).set(summary),
        db.doc(`players/${id}/history/recent`).set({ at: record.at, progress }),
        db.doc(`feed/${id}`).set({ name: record.name, at: record.at, items: feed }),
      ]);
    },

    /*
     * Who already answers to this name. The document store has no index, so
     * this reads the collection — fine at the scale this runs at, where the
     * whole point is that fifteen people share a table.
     */
    async findByName(key) {
      const snap = await db.collection('players').get();
      return snap.docs
        .map((d) => ({ id: d.id, ...d.data() }))
        .filter((row) => (row.nameKey ?? '') === key);
    },

    watch(onRows) {
      let players = [];
      let feeds = [];
      const merge = () =>
        onRows(
          players.map((p) => ({
            ...p,
            feed: (feeds.find((f) => f.id === p.id)?.items ?? []),
          })),
        );

      const stopPlayers = db
        .collection('players')
        .orderBy('rating', 'desc')
        .limit(60)
        .onSnapshot((snap) => {
          players = snap.docs
            .map((d) => ({ id: d.id, ...d.data() }))
            .filter((row) => !row.mergedInto);
          merge();
        }, () => {});

      const stopFeeds = db.collection('feed').onSnapshot((snap) => {
        feeds = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
        merge();
      }, () => {});

      return () => {
        stopPlayers();
        stopFeeds();
      };
    },
  };
}

/**
 * A PostgREST table — Supabase, or anything speaking the same dialect.
 *
 * One row per player, upserted whole. The key in the page is the publishable
 * anonymous key, which is what it is meant to be: it identifies the project, not
 * a person, and the table's own policies decide what it may do. Those policies
 * allow reading and writing rows and nothing else — in particular they refuse
 * deletes, so the worst a stranger who finds the page can do is add a row or
 * overwrite one, and no history can be destroyed.
 *
 * Say plainly what this is: the shared table is open to anyone who opens the
 * page. For a family it is the right trade against making everybody sign in.
 * It is not a place for anything private, and nothing private is put in it.
 */
function httpBackend({ url, key, table = 'players' }) {
  const endpoint = `${url.replace(/\/+$/, '')}/rest/v1/${table}`;
  /*
   * Whether the table has the Ultimate rating's two columns (migration 003,
   * round 10). Assumed until the table says otherwise. Without them a save that
   * names them is refused whole, so the first refusal that names them turns
   * them off for the rest of the visit and the save goes again without them:
   * everything else is kept exactly as before the migration.
   */
  let uthColumns = true;
  const headers = {
    apikey: key,
    Authorization: `Bearer ${key}`,
    'Content-Type': 'application/json',
  };

  const rowToRecord = (row) => ({
    id: row.id,
    name: row.name,
    rating: row.rating,
    peak: row.peak,
    provisional: row.provisional,
    mode: row.mode,
    hands: row.hands,
    decisions: row.decisions,
    accuracy: row.accuracy,
    evLostPer100: row.ev_lost_per_100,
    lifetimeDecisions: row.lifetime_decisions ?? row.decisions ?? 0,
    at: Date.parse(row.updated_at) || 0,
    feed: row.feed ?? [],
  });

  // The leaderboard never needs anyone else's saved session, and it is by far
  // the largest column — so it is left out of the list query on purpose.
  const LIST =
    'id,name,rating,peak,provisional,mode,hands,decisions,lifetime_decisions,accuracy,ev_lost_per_100,feed,updated_at';

  return {
    /*
     * Rows already using this name, merged ones included so the caller can see
     * why a name is taken. `name_key` is the normalised form and carries the
     * unique index, so this is a single indexed lookup.
     */
    async findByName(key) {
      const response = await fetch(
        `${endpoint}?name_key=eq.${encodeURIComponent(key)}` +
          `&select=id,name,pin_hash,merged_into,lifetime_decisions,decisions`,
        { headers },
      );
      if (!response.ok) throw new Error(`findByName failed: ${response.status}`);
      return (await response.json()).map((row) => ({
        id: row.id,
        name: row.name,
        pinHash: row.pin_hash,
        mergedInto: row.merged_into,
        lifetimeDecisions: row.lifetime_decisions ?? row.decisions ?? 0,
      }));
    },

    async load(id) {
      const response = await fetch(
        `${endpoint}?id=eq.${encodeURIComponent(id)}&select=progress,feed,merged_into,updated_at`,
        { headers },
      );
      if (!response.ok) throw new Error(`load failed: ${response.status}`);
      const rows = await response.json();
      if (rows.length === 0) return null;
      return {
        progress: rows[0].progress ?? null,
        feed: rows[0].feed ?? [],
        // A row that points at another has been retired by a merge. The caller
        // has to know, or it will read a dormant session back and then write to
        // it — which would put an abandoned rating back on the leaderboard.
        mergedInto: rows[0].merged_into ?? null,
        // When the row was last written: the last day a player from before the
        // day count is known to have played (round 9).
        updatedAt: Date.parse(rows[0].updated_at) || null,
      };
    },

    /*
     * How much each live player has played, for the usage page (round 9).
     *
     * Only what that page counts: the name, both games' lifetime decisions and
     * the day count, which lives inside the saved record — so nothing new was
     * added to the table and no migration is needed. The two JSON paths return
     * those few fields, not the saved session around them. Merged rows are not
     * people and are left out.
     *
     * A refusal is thrown with its status, so the page can say "the table
     * refused (400)" rather than showing zero people as if that were true.
     */
    async usage() {
      const response = await fetch(
        `${endpoint}?select=name,decisions,lifetime_decisions,updated_at,` +
          'activity:progress->activity,uth_decisions:progress->uth->>lifetimeDecisions' +
          '&merged_into=is.null&order=updated_at.desc&limit=1000',
        { headers },
      );
      if (!response.ok) {
        const error = new Error(`usage failed: ${response.status}`);
        error.status = response.status;
        throw error;
      }
      const rows = await response.json();
      return (Array.isArray(rows) ? rows : []).map((row) => ({
        name: row.name,
        blackjack: row.lifetime_decisions ?? row.decisions ?? 0,
        ultimate: Number(row.uth_decisions) || 0,
        activity: row.activity && typeof row.activity === 'object' ? row.activity : null,
        at: Date.parse(row.updated_at) || 0,
      }));
    },

    async save(id, record) {
      const write = (body) =>
        fetch(endpoint, {
          method: 'POST',
          headers: { ...headers, Prefer: 'resolution=merge-duplicates,return=minimal' },
          body: JSON.stringify(body),
        });
      const body = {
          id,
          name: record.name,
          rating: record.rating,
          peak: record.peak,
          provisional: record.provisional,
          mode: record.mode,
          hands: record.hands,
          decisions: record.decisions,
          lifetime_decisions: record.lifetimeDecisions,
          name_key: record.nameKey,
          // Only when this device holds one. The upsert updates just the columns
          // it is sent, so leaving it out keeps the row's code; sending null
          // would erase it (round 9).
          ...(record.pinHash ? { pin_hash: record.pinHash } : {}),
          accuracy: record.accuracy,
          ev_lost_per_100: record.evLostPer100,
          progress: record.progress,
          feed: record.feed,
          updated_at: new Date().toISOString(),
      };
      if (uthColumns) {
        // Null until an Ultimate decision has been rated: never rated is not rated.
        body.uth_rating = record.uthRating ?? null;
        body.uth_provisional = record.uthProvisional !== false;
      }
      let response = await write(body);
      if (!response.ok && uthColumns && response.status === 400) {
        const reason = await response.text().catch(() => '');
        if (/uth_rating|uth_provisional/.test(reason)) {
          uthColumns = false;
          delete body.uth_rating;
          delete body.uth_provisional;
          response = await write(body);
        }
      }
      if (!response.ok) throw new Error(`save failed: ${response.status}`);
    },

    /*
     * The Ultimate side of the leaderboard (round 10): live players with an
     * Ultimate rating, best first. A table without the columns yet answers 400,
     * which is thrown with its status so the board can say it is waiting for the
     * table rather than showing nobody as if that were true.
     */
    async uthBoard() {
      const response = await fetch(
        `${endpoint}?select=id,name,uth_rating,uth_provisional,uth_decisions:progress->uth->>lifetimeDecisions` +
          '&merged_into=is.null&uth_rating=not.is.null&order=uth_rating.desc&limit=60',
        { headers },
      );
      if (!response.ok) {
        const error = new Error(`uthBoard failed: ${response.status}`);
        error.status = response.status;
        throw error;
      }
      const rows = await response.json();
      return (Array.isArray(rows) ? rows : []).map((row) => ({
        id: row.id,
        name: row.name,
        rating: row.uth_rating,
        provisional: row.uth_provisional !== false,
        decisions: Number(row.uth_decisions) || 0,
      }));
    },

    /**
     * @param onRows   the leaderboard rows, whenever the table answers
     * @param onStatus true when a poll reached the table, false when it did not
     *                 — so the page can say it is offline instead of showing an
     *                 empty or stale leaderboard as if it were live
     */
    watch(onRows, onStatus = () => {}) {
      // Polling rather than a socket: fifteen people watching a leaderboard do
      // not need sub-second news, and a poll has no connection to lose, no
      // reconnect to get wrong, and nothing to clean up on a backgrounded tab.
      let stopped = false;
      let timer = null;

      const tick = async () => {
        try {
          // Merged rows are excluded here, not filtered afterwards: they are
          // not people, and one person listed twice under one name is worse
          // than a short leaderboard.
          const response = await fetch(
            `${endpoint}?select=${LIST}&merged_into=is.null&order=rating.desc&limit=60`,
            { headers },
          );
          if (response.ok) {
            onRows((await response.json()).map(rowToRecord));
            onStatus(true);
          } else {
            onStatus(false);
          }
        } catch {
          // Offline, or the project is asleep. Say so, and try again next tick.
          onStatus(false);
        }
        if (!stopped) timer = setTimeout(tick, POLL_MS);
      };
      tick();

      return () => {
        stopped = true;
        if (timer) clearTimeout(timer);
      };
    },
  };
}

/**
 * Whichever backend this copy of the page can actually reach.
 *
 * The artifact store is tried first and only exists inside the claude.ai
 * viewer; the HTTP one is configured at build time and only exists when the
 * page was built with a project to talk to. Returning null is a normal outcome,
 * not an error.
 */
async function openBackend(config) {
  try {
    const db = await window.claude?.use?.('db');
    if (db) return artifactBackend(db);
  } catch {
    // Not published as an artifact, or the capability was declined.
  }
  if (config && config.url && config.key) {
    try {
      return httpBackend(config);
    } catch {
      // A malformed configuration should not stop anyone playing.
    }
  }
  return null;
}


/*
 * The shareable build.
 *
 * Same product, no server. `TrainerSession` and the whole EV engine are bundled
 * into the page above this file, so `api()` below answers the very calls the
 * Node server answers — same paths, same bodies, same shapes — and the two page
 * scripts that draw the app cannot tell the difference. That is deliberate:
 * there is one engine and one set of screens, and this file is only the thing
 * that stands where the server used to.
 *
 * What is genuinely new here is people. The local app had one player; this one
 * is meant to be passed around a family, so it keeps a profile per person, saves
 * their hands, and puts everyone on one table.
 */

/* --------------------------------------------------------------------------
 * Who is playing
 *
 * No passwords: this is a link people send to their family, and a sign-up form
 * is a reason not to bother. A player picks a name once; the id behind it is
 * random and lives in their browser. Anyone who clears their storage starts
 * fresh, which for fifteen people around a kitchen table is the right trade.
 * ----------------------------------------------------------------------- */

const store = {
  get(key, fallback = null) {
    try {
      const raw = localStorage.getItem(key);
      return raw === null ? fallback : raw;
    } catch {
      return fallback;
    }
  },
  set(key, value) {
    try {
      localStorage.setItem(key, value);
    } catch {
      // Private window, or storage switched off. The session still plays.
    }
  },
};

const newId = () => {
  const bytes = new Uint8Array(9);
  crypto.getRandomValues(bytes);
  return Array.from(bytes, (b) => b.toString(16).padStart(2, '0')).join('');
};

const me = {
  id: store.get('ev:playerId') || (() => {
    const id = newId();
    store.set('ev:playerId', id);
    return id;
  })(),
  name: store.get('ev:playerName') || '',
  /* Set when a player claims or creates a name at the door. Written with the
     record so the next device can check a code against it. Never the code. */
  pinHash: store.get('ev:pinHash') || null,
};

/* --------------------------------------------------------------------------
 * The shared table
 *
 * A backend is optional at every moment. It may be absent because the page was
 * opened from a file, because the artifact store was declined, or because the
 * network is down mid-hand. Everything below is written so that none of those
 * change the game: you still play, you still get graded, your own record is
 * still kept in the browser — you simply do not appear on the leaderboard.
 *
 * A trainer that refuses to deal because a database is unreachable would have
 * its priorities exactly backwards.
 * ----------------------------------------------------------------------- */

let backend = null;
let backendReady = false;
/*
 * Whether the shared table answered the last time it was asked. A configured
 * table is not a reachable one: on a phone with no signal the page still has a
 * backend object, and without this it showed "nobody has played yet" — false —
 * where it should have said it was offline.
 */
let backendReachable = true;
/* Held so the poll can be stopped — a browser tab never needs to, but anything
   that loads this page without being a browser tab does. */
let stopWatching = null;
let leaderboard = [];
let feed = [];

/*
 * The leaderboard's other side (round 10). One screen, a switch between the
 * games; the Ultimate side is asked for only while it is the one on screen.
 * `pending` is a table that has not had migration 003 yet.
 */
let boardGame = store.get('ev:board') === 'uth' ? 'uth' : 'bj';
let uthBoard = { state: 'idle', rows: [] };

async function loadUthBoard() {
  if (!backend || typeof backend.uthBoard !== 'function') {
    uthBoard = { state: 'none', rows: [] };
    renderSocial();
    return;
  }
  if (uthBoard.state === 'idle') {
    uthBoard = { state: 'loading', rows: [] };
    renderSocial();
  }
  try {
    uthBoard = { state: 'ready', rows: await backend.uthBoard() };
  } catch (error) {
    uthBoard = { state: error && error.status ? 'pending' : 'offline', rows: uthBoard.rows };
  }
  renderSocial();
}

/** How many of a player's showable hands ride along with their record. */
const FEED_KEPT = 5;

async function connect() {
  backend = await openBackend(typeof BACKEND_CONFIG === 'undefined' ? null : BACKEND_CONFIG);
  backendReady = true;

  if (backend) {
    await restoreMine();
    stopWatching = backend.watch(
      (rows) => {
      leaderboard = rows;
      feed = rows
        .flatMap((row) =>
          (row.feed ?? []).map((item) => ({ ...item, playerId: row.id, name: row.name })),
        )
        .sort((a, b) => b.at - a.at)
        .slice(0, 40);
      renderSocial();
      // The Ultimate side keeps pace with the same poll while it is on screen.
      if (boardGame === 'uth') void loadUthBoard();
      },
      (reachable) => {
        if (reachable === backendReachable) return;
        backendReachable = reachable;
        renderSocial();
        // Back from offline: what was played meanwhile is only in this browser.
        // Send it now, not at the next hand — the offline line promises as much.
        if (reachable) void publish();
      },
    );
    void publish();
  } else {
    // No table to join, but the local copy is still worth reading back.
    const local = readLocalProgress();
    if (local) {
      session.restore(local);
      // The UTH part too. Without it a browser with no shared table (the
      // published artifact, or a page built without one) reopened Ultimate at a
      // fresh stack every time, while Blackjack came back as it was.
      uthSession.restore(local.uth);
    }
    activity = activityOf(local);
    playedBefore = earlierDay(local?.playedBefore, null);
    myFeed = readLocalFeed();
    myHistory = session.view.history;
  }
  renderSocial();
}

/**
 * One record, written whole.
 *
 * Summary, saved session and recent hands go together because they describe one
 * moment and would be misleading apart — a leaderboard row claiming four hundred
 * hands beside a saved session holding forty is worse than either alone.
 */
let publishing = false;
let publishAgain = false;

async function publish() {
  if (!backend || !me.name) return;

  /*
   * One write at a time, and the last state always wins.
   *
   * Publishing is fire-and-forget from the caller's side, so without this two
   * writes can be in flight at once and land out of order — leaving the table
   * showing the rating from the hand before last. Writes are last-writer-wins,
   * so "out of order" means "wrong", not "briefly behind".
   *
   * A newer state arriving mid-flight does not queue a second write; it just
   * marks the current one stale, and the loop re-reads the session when the
   * first finishes. Ten hands played during one slow request still cost one
   * extra write, not ten.
   */
  if (publishing) {
    publishAgain = true;
    return;
  }
  publishing = true;
  try {
    do {
      publishAgain = false;
      await writeRecord();
    } while (publishAgain);
  } finally {
    publishing = false;
  }
}

async function writeRecord() {
  const profile = session.profile;
  const stats = session.view.stats;
  const uth = uthSession.progress;
  const uthRated = Boolean(uth.rating) && uth.rating.ratedDecisions > 0;
  try {
    await backend.save(me.id, {
      name: me.name,
      rating: profile.rating.ratedDecisions > 0 ? Math.round(profile.rating.rating) : 0,
      peak: Math.round(profile.rating.peak),
      provisional: Boolean(profile.rating.provisional),
      mode: profile.rating.mode,
      nameKey: nameKey(me.name),
      pinHash: me.pinHash,
      lifetimeDecisions: session.progress.lifetimeDecisions,
      // For the usage page. The HTTP table reads both from the saved record;
      // the artifact store keeps them on the summary, which is all it reads.
      uthDecisions: uth.lifetimeDecisions,
      // The Ultimate rating (round 10): null until an Ultimate decision is rated.
      uthRating: uthRated ? Math.round(uth.rating.rating) : null,
      uthProvisional: !uthRated || uth.rating.ratedDecisions < 30,
      activity,
      hands: stats.hands,
      decisions: stats.decisions,
      accuracy: stats.accuracy,
      evLostPer100: stats.evLostPer100,
      at: Date.now(),
      progress: fullProgress(),
      feed: myFeed,
    });
  } catch {
    // Offline, refused, or asleep. The browser copy already has everything.
  }
}

/* --------------------------------------------------------------------------
 * Keeping a player's record
 *
 * Two copies, on purpose. The browser always gets one, so the app remembers you
 * whether it was opened from a link, from a file, or on a plane. The backend
 * gets one when there is a backend, so the same person picks up on another
 * device and the shared table has something true to rank.
 *
 * The browser copy is written first and is never conditional: a rating built
 * over three hundred hands should not depend on a network.
 * ----------------------------------------------------------------------- */

const PROGRESS_KEY = 'ev:progress';
const FEED_KEY = 'ev:feed';

/* --------------------------------------------------------------------------
 * How often this player has played (round 9)
 *
 * Counted in calendar days on this device's clock, because the question it
 * answers is "did they come back on another day". Three things are kept and
 * nothing else: the first day, the last day, and how many different days have
 * a finished hand in them. No times, no list of dates, nothing about the
 * device. It rides inside the saved record, so it travels with the player to
 * another device the same way their rating does.
 * ----------------------------------------------------------------------- */

let activity = null;

/*
 * For a player from before the count: a day they are known to have played on
 * or before, kept until their first hand under the count absorbs it. It comes
 * from their row's last write as the table held it before this build first
 * wrote it — and it is saved, because this build writes the row as soon as the
 * page opens, after which that date would only say the app was opened.
 */
let playedBefore = null;

/** Today on this device, as 2026-09-14. */
function localDay(date = new Date()) {
  const pad = (n) => String(n).padStart(2, '0');
  return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`;
}

const DAY = /^\d{4}-\d{2}-\d{2}$/;

/** A saved record's day count, or null when it has none that can be read. */
function activityOf(progress) {
  const a = progress && progress.activity;
  if (!a || typeof a !== 'object' || !DAY.test(a.firstDay) || !DAY.test(a.lastDay)) return null;
  const days = Number.isInteger(a.days) && a.days > 0 ? a.days : 1;
  return { firstDay: a.firstDay, lastDay: a.lastDay, days };
}

/**
 * Two copies of the count, as one.
 *
 * The larger count wins, never the sum: two devices played on the same day
 * would otherwise count that day twice. The first and last days are the
 * earliest and latest either copy has seen, and two different days mean at
 * least two days whatever the counts say. When copies disagree this can only
 * undercount, which is the safe direction for a number a decision rests on.
 */
function mergeActivity(a, b) {
  if (!a) return b ? { ...b } : null;
  if (!b) return { ...a };
  const firstDay = a.firstDay < b.firstDay ? a.firstDay : b.firstDay;
  const lastDay = a.lastDay > b.lastDay ? a.lastDay : b.lastDay;
  const days = Math.max(a.days, b.days, firstDay === lastDay ? 1 : 2);
  return { firstDay, lastDay, days };
}

/** The earlier of two days, either of which may be missing. */
function earlierDay(a, b) {
  if (!DAY.test(a ?? '')) return DAY.test(b ?? '') ? b : null;
  if (!DAY.test(b ?? '')) return a;
  return a < b ? a : b;
}

/**
 * A day played before the count, folded into it once there is a count.
 *
 * A day before the first counted day is a different day, so it adds one. A day
 * on or after it is already inside the count, so it adds nothing — which is
 * also what makes folding the same day in twice, from two devices, harmless.
 */
function absorbPrior(counted, prior) {
  if (!counted || !DAY.test(prior ?? '') || prior >= counted.firstDay) return counted;
  return { ...counted, firstDay: prior, days: counted.days + 1 };
}

/** A finished hand on `day`. A new day adds one; another hand on the same day adds nothing. */
function markPlayed(day = localDay()) {
  if (!activity) {
    activity = { firstDay: day, lastDay: day, days: 1 };
  } else if (day > activity.lastDay) {
    activity = { ...activity, lastDay: day, days: activity.days + 1 };
  }
  activity = absorbPrior(activity, playedBefore);
  if (activity.firstDay === playedBefore) playedBefore = null;
}

/** The parts of a saved session that outlive the rules it was played under. */
function playerOnly(progress) {
  return {
    ...progress,
    hands: 0,
    decisions: 0,
    correct: 0,
    evLost: 0,
    netUnits: 0,
    closeCalls: 0,
    closeCallsCorrect: 0,
    bySeverity: { optimal: 0, negligible: 0, minor: 0, significant: 0, blunder: 0 },
    scenarioStats: [],
    history: [],
  };
}

function saveProgressLocally() {
  try {
    store.set(PROGRESS_KEY, JSON.stringify(fullProgress()));
    store.set(FEED_KEY, JSON.stringify(myFeed));
  } catch {
    // Storage full or switched off. The session in front of the player is fine.
  }
}

/**
 * The whole saved record: the Blackjack session's version 3 blob, with the UTH
 * session's part under `uth`.
 *
 * Composed here rather than inside either session, so neither class holds a
 * reference to the other — which is what keeps a UTH hand from ever being able
 * to reach the Blackjack rating.
 */
function fullProgress() {
  // `level` is how much the app explains (round 14) — a preference, not a
  // measure. It rides here so it follows the player to another device, exactly
  // as the day count does, and nothing that grades a hand ever reads it.
  const level = window.EVLevel ? window.EVLevel.read() : null;
  return { ...session.progress, uth: uthSession.progress, activity, playedBefore, ...(level ? { level } : {}) };
}

function readLocalProgress() {
  try {
    const raw = store.get(PROGRESS_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch {
    // Corrupt or half-written. Starting fresh beats refusing to open.
    return null;
  }
}

/**
 * How far a saved copy has got, for comparing two of them.
 *
 * Version 1 saves predate the lifetime counter, so their session count is the
 * best lower bound available — and a lower bound is safe here, because the only
 * question being asked is which of two copies is further along.
 */
function lifetimeOf(progress) {
  if (!progress) return -1;
  /*
   * Both games' lifetime counters, added. Each only ever rises, so the sum only
   * ever rises. Counting Blackjack alone would let an evening of UTH on one
   * device lose to an older copy on another, because its Blackjack count had not
   * moved.
   */
  const blackjack = progress.lifetimeDecisions ?? progress.decisions ?? 0;
  const uth = progress.uth && typeof progress.uth.lifetimeDecisions === 'number' ? progress.uth.lifetimeDecisions : 0;
  return blackjack + uth;
}

function readLocalFeed() {
  try {
    const raw = store.get(FEED_KEY);
    const parsed = raw ? JSON.parse(raw) : [];
    return Array.isArray(parsed) ? parsed : [];
  } catch {
    return [];
  }
}

/**
 * Pick up where this player left off.
 *
 * The browser copy is applied first so the screen is right immediately, then the
 * stored one replaces it if it is further along. "Further along" is measured in
 * decisions played, which only ever rises — comparing timestamps would let a
 * device with a wrong clock overwrite the real record.
 */
async function restoreMine() {
  const local = readLocalProgress();
  if (local) {
    session.restore(local);
    // A version 1 or 2 blob has no `uth`, and this leaves UTH at zero.
    uthSession.restore(local.uth);
  }
  activity = activityOf(local);
  playedBefore = earlierDay(local?.playedBefore, null);
  myFeed = readLocalFeed();

  if (backend && me.name) {
    try {
      let remote = await backend.load(me.id);

      /*
       * This browser may be holding an id that has since been merged into
       * another row. Follow the pointer once and adopt the survivor, before
       * anything is read back or written: reading the retired row would restore
       * a session the merge put to sleep, and the next save would resurrect it
       * on the leaderboard under a rating its owner had abandoned.
       *
       * One hop only. `merged_into` is set by the migration to a row that is
       * itself live, so a chain would mean the data is wrong, and following it
       * blindly would be a way to loop forever.
       */
      if (remote?.mergedInto) {
        me.id = remote.mergedInto;
        store.set('ev:playerId', me.id);
        remote = await backend.load(me.id);
      }

      if (remote) {
        /*
         * Which copy is further along, decided on a number that only ever
         * rises. `decisions` is zeroed by a rule change while the rating is
         * kept, so comparing on it can hand the session to a copy with more
         * hands this sitting and an older rating.
         */
        const here = lifetimeOf(local);
        const there = lifetimeOf(remote.progress);
        if (remote.progress && (!local || there > here)) {
          session.restore(remote.progress);
          uthSession.restore(remote.progress.uth);
        }
        /*
         * How much the app explains, carried across devices (round 14).
         *
         * A device that has never been asked takes the answer the player gave
         * somewhere else; a device that has been asked keeps its own, because
         * the last answer a player gave on the phone in his hand is the one he
         * meant. It changes nothing measured either way.
         */
        if (window.EVLevel && window.EVLevel.read() === null && remote.progress?.level) {
          window.EVLevel.set(remote.progress.level);
        }
        /*
         * The day count is merged whichever copy won, because each device may
         * have seen days the other has not. A row no build with the count has
         * written yet belongs to a player from before it, who played on or
         * before the day it was last written.
         */
        activity = mergeActivity(activity, activityOf(remote.progress));
        const untouched =
          remote.progress && !('activity' in remote.progress) && lifetimeOf(remote.progress) > 0 && remote.updatedAt;
        playedBefore = earlierDay(
          earlierDay(playedBefore, remote.progress?.playedBefore),
          untouched ? localDay(new Date(remote.updatedAt)) : null,
        );
        activity = absorbPrior(activity, playedBefore);
        if (activity && activity.firstDay === playedBefore) playedBefore = null;
        if (remote.feed.length > 0) myFeed = remote.feed;
        saveProgressLocally();
      }
    } catch {
      // A first-time player, or an unreachable backend. The local copy stands.
    }
  }
  myHistory = session.view.history;
}

/* --------------------------------------------------------------------------
 * What lands on the shared feed
 *
 * Not every hand — a wall of routine twenty-against-six is nobody's idea of a
 * feed. Two things are worth showing other people: an expensive mistake, and a
 * hard spot played correctly. They are the same fact from opposite sides, which
 * is what this trainer is about, so both go up and neither is dressed as the
 * other.
 * ----------------------------------------------------------------------- */

/*
 * Hard enough to be worth showing other people.
 *
 * This used to be a hand-written list of twelve scenario keys, which was a
 * guess at something the engine measures for all three hundred and eleven. It
 * now asks. Older saved hands predate the field and simply do not qualify,
 * which is why the read is guarded rather than assumed.
 */
const hardSpot = (decision) => Boolean(decision.spot && decision.spot.hard);

function showcaseOf(hand) {
  const worst = hand.decisions.reduce(
    (acc, d) => (acc === null || d.evCost > acc.evCost ? d : acc),
    null,
  );
  if (worst && (worst.severity === 'blunder' || worst.severity === 'significant')) return worst;
  return hand.decisions.find((d) => d.correct && !d.closeCall && hardSpot(d)) ?? null;
}

let myFeed = [];
let myHistory = [];

function noteForFeed(hand) {
  const showcase = showcaseOf(hand);
  if (!showcase) return;
  myFeed = [
    {
      at: Date.now(),
      headline: showcase.headline,
      scenarioKey: showcase.scenarioKey,
      chosen: showcase.chosen,
      optimal: showcase.optimal,
      correct: showcase.correct,
      severity: showcase.severity,
      evCost: showcase.evCost,
      netUnits: hand.netUnits,
    },
    ...myFeed,
  ].slice(0, FEED_KEPT);
}

/** After a hand settles: keep it, and share it if it is worth showing. */
function keep(hand) {
  markPlayed();
  noteForFeed(hand);
  myHistory = session.view.history;
  saveProgressLocally();
  void publish();
}

/* --------------------------------------------------------------------------
 * Standing where the server stood
 * ----------------------------------------------------------------------- */

let session = new TrainerSession(
  store.get('ev:preset', 'vegas-strip-6d-s17'),
  undefined,
  {
    noSurrender: store.get('ev:noSurrender') === '1',
    likeRanksOnly: store.get('ev:likeRanksOnly') === '1',
  },
);
let lastSavedHandId = -1;

/*
 * Ultimate Texas Hold'em. Its own session: saved under `uth` in the same record
 * as Blackjack since round 4b, but never read by the Blackjack session, so it
 * cannot reach the Blackjack rating, stats or history in either direction.
 */
const uthSession = new UthSession();

/**
 * The server's routes, answered in the page.
 *
 * Kept path-for-path rather than replaced with direct calls, because the two
 * screen scripts are the ones from the local app, unmodified. When a route
 * changes there it changes here, and the test that runs both against the same
 * session is what catches the day they drift.
 */
async function api(path, body) {
  const b = body ?? {};
  switch (path) {
    case '/api/state':
      return session.view;

    case '/api/presets':
      // In the language on screen, as the rules bar is (round 11).
      return RULE_PRESETS.map((p) => ({
        id: p.id,
        name: t(session.localeCode, `preset.${p.id}`),
        note: p.note ? t(session.localeCode, `preset.${p.id}.note`) : null,
      }));

    case '/api/session': {
      const presetId = typeof b.presetId === 'string' ? b.presetId : undefined;
      const locale = session.localeCode;
      store.set('ev:preset', presetId ?? 'vegas-strip-6d-s17');
      store.set('ev:noSurrender', b.noSurrender ? '1' : '0');
      store.set('ev:likeRanksOnly', b.likeRanksOnly ? '1' : '0');
      session = new TrainerSession(presetId, undefined, {
        noSurrender: Boolean(b.noSurrender),
        likeRanksOnly: Boolean(b.likeRanksOnly),
      });
      session.setLocale(locale);
      if (me.name) session.setPlayerName(me.name);
      // A rule change deals a new shoe against a new set of correct answers, so
      // this session's totals go with it. The player does not: their name and
      // their rating belong to them rather than to the rule set they were last
      // sitting at.
      const carried = readLocalProgress();
      if (carried) session.restore(playerOnly(carried));
      lastSavedHandId = -1;
      saveProgressLocally();
      return session.view;
    }

    // The chips (round 6b). A change to the bet is kept in this browser at once
    // and reaches the shared table with the next hand; a rebuy goes straight away.
    case '/api/bet':
      session.placeBet(b.op, b.chip);
      saveProgressLocally();
      return session.view;
    case '/api/rebuy':
      session.rebuy();
      saveProgressLocally();
      void publish();
      return session.view;
    case '/api/uth/bet':
      // The circle the chips go on: the Ante unless Trips is chosen (round 11).
      uthSession.placeBet(b.op, b.chip, b.spot === 'trips' ? 'trips' : 'ante');
      saveProgressLocally();
      return uthSession.view;
    case '/api/uth/rebuy':
      uthSession.rebuy();
      saveProgressLocally();
      void publish();
      return uthSession.view;

    case '/api/uth/state':
      return uthSession.view;
    case '/api/uth/deal':
      return uthSession.deal();
    case '/api/uth/act': {
      const view = uthSession.act(b.action);
      if (view.phase === 'settled') {
        markPlayed();
        saveProgressLocally();
        void publish();
      }
      return view;
    }
    case '/api/uth/prepare':
      return uthSession.prepare();

    case '/api/deal':
      session.deal();
      return afterPlay();

    case '/api/act':
      session.act(b.action);
      return afterPlay();

    case '/api/insurance':
      session.insurance(Boolean(b.take));
      return afterPlay();

    case '/api/chart':
      return session.chart;
    case '/api/weak-spots':
      return session.weakSpots;
    case '/api/profile':
      return session.profile;
    case '/api/coach':
      return session.coach;

    case '/api/player': {
      if (typeof b.name === 'string') {
        session.setPlayerName(b.name);
        me.name = b.name.trim().slice(0, 24);
        store.set('ev:playerName', me.name);
        if (me.pinHash) store.set('ev:pinHash', me.pinHash);
        saveProgressLocally();
        void publish();
      }
      if (typeof b.mode === 'string') session.setMode(b.mode);
      if (typeof b.locale === 'string') session.setLocale(b.locale);
      return session.profile;
    }

    default:
      throw new Error(`no such endpoint: ${path}`);
  }
}

/** After anything that can finish a hand: keep the record, share what is worth sharing. */
function afterPlay() {
  const view = session.view;
  const newest = view.history[0];
  if (newest && newest.id !== lastSavedHandId) {
    lastSavedHandId = newest.id;
    keep(newest);
  }
  return view;
}



/*
 * The usage page (round 9).
 *
 * Idan will buy a domain only if he first sees quality use among family and
 * friends. This is how he reads that: how many people have played, how much
 * each of them played, and — the real signal — how many came back on another
 * day. Plus one reading of "quality" on top: a regular is someone who came back
 * on several days and played a real amount in all.
 *
 * Reached at `#usage`. Nothing links to it, so a friend will not wander in. It
 * is not private, and says so on the page: the table it reads is open to anyone
 * who has the app's address, by design (see backends.js).
 *
 * It reads what the app already keeps and counts nothing new about anyone: a
 * name the player chose, both games' decisions, and three facts about days.
 */

/** A regular: this many different days, and this many graded decisions in all. */
const USAGE_REGULAR_DAYS = 3;
const USAGE_REGULAR_DECISIONS = 100;
/** "Recently" means a finished hand in this many days, today included. */
const USAGE_RECENT_DAYS = 7;
/** The day the day count began, which the page names so no one reads it as older. */
const USAGE_COUNTING_FROM = '2026-09-14';

/** Whole days from `a` to `b`, both written 2026-09-14. */
function daysBetween(a, b) {
  const [ya, ma, da] = a.split('-').map(Number);
  const [yb, mb, db] = b.split('-').map(Number);
  return Math.round((Date.UTC(yb, mb - 1, db) - Date.UTC(ya, ma - 1, da)) / 86400000);
}

/**
 * The table's rows, read as people. Pure, so every branch is tested without a
 * network.
 *
 * Someone with no graded decision in either game has not played, whatever row
 * they left behind, and is not counted. A row with no day count belongs to
 * someone who has not played since the count began: they appear with the day
 * they were last seen, count as having played, and count as neither back nor
 * recent — an undercount, which is the safe side for a gate.
 */
function summariseUsage(rows, today) {
  const people = (Array.isArray(rows) ? rows : [])
    .map((row) => {
      const blackjack = Math.max(0, Number(row.blackjack) || 0);
      const ultimate = Math.max(0, Number(row.ultimate) || 0);
      const counted = activityOf({ activity: row.activity });
      const days = counted ? counted.days : 0;
      return {
        name: String(row.name ?? ''),
        blackjack,
        ultimate,
        decisions: blackjack + ultimate,
        counted: Boolean(counted),
        days,
        lastPlayed: counted ? counted.lastDay : null,
        lastSeen: row.at ? localDay(new Date(row.at)) : null,
        cameBack: days >= 2,
        regular: days >= USAGE_REGULAR_DAYS && blackjack + ultimate >= USAGE_REGULAR_DECISIONS,
        recent: Boolean(counted) && daysBetween(counted.lastDay, today) < USAGE_RECENT_DAYS,
      };
    })
    .filter((person) => person.decisions > 0)
    .sort(
      (a, b) =>
        Number(b.regular) - Number(a.regular) ||
        b.days - a.days ||
        (b.lastPlayed ?? b.lastSeen ?? '').localeCompare(a.lastPlayed ?? a.lastSeen ?? '') ||
        b.decisions - a.decisions,
    );
  return {
    people,
    played: people.length,
    cameBack: people.filter((p) => p.cameBack).length,
    regulars: people.filter((p) => p.regular).length,
    recent: people.filter((p) => p.recent).length,
  };
}

const usageHtml = () => `
  <div class="shell usage">
    <a class="back" href="#home">${tr('usage.back')}</a>
    <h1 class="usage-title">${tr('usage.title')}</h1>
    <p class="usage-line">${tr('usage.line')}</p>
    <section class="usage-figures" id="usage-figures"></section>
    <section class="usage-people" id="usage-people"></section>
    <p class="usage-note" id="usage-counting"></p>
    <p class="usage-note usage-public" id="usage-public">${tr('usage.public')}</p>
  </div>`;

/** A count, written by the one figure rule like every other figure (round 8). */
const usageCount = (n) => window.EVFigure.units(n);

/** 2026-09-14 as the page's language writes a short date. */
function usageDate(day) {
  const [y, m, d] = day.split('-').map(Number);
  return new Intl.DateTimeFormat(locale === 'he' ? 'he-IL' : 'en-GB', { day: 'numeric', month: 'short' }).format(
    new Date(y, m - 1, d),
  );
}

async function initUsage() {
  const figures = document.getElementById('usage-figures');
  const list = document.getElementById('usage-people');
  const counting = document.getElementById('usage-counting');
  if (!figures || !list) return;
  if (counting) counting.textContent = tr('usage.counting', { day: usageDate(USAGE_COUNTING_FROM) });

  const say = (key, params) => {
    figures.replaceChildren();
    const line = document.createElement('p');
    line.className = 'empty-note';
    line.textContent = tr(key, params);
    list.replaceChildren(line);
  };

  if (!backend || typeof backend.usage !== 'function') return say('usage.noTable');
  say('usage.loading');
  let rows;
  try {
    rows = await backend.usage();
  } catch (error) {
    // A refusal says so, with its status, so a wrong query shows as an error and never as zero people.
    return error && error.status ? say('usage.refused', { status: usageCount(error.status) }) : say('usage.offline');
  }
  if (screen !== 'usage') return;

  const summary = summariseUsage(rows, localDay());
  if (summary.played === 0) return say('usage.nobody');

  const tile = (value, label, note) => {
    const div = document.createElement('div');
    div.className = 'figure';
    const v = document.createElement('div');
    v.className = 'figure-value';
    v.textContent = usageCount(value);
    const l = document.createElement('div');
    l.className = 'figure-label';
    l.textContent = label;
    const n = document.createElement('div');
    n.className = 'figure-note';
    n.textContent = note;
    div.append(v, l, n);
    return div;
  };
  figures.replaceChildren(
    tile(summary.played, tr('usage.played'), tr('usage.playedNote')),
    tile(summary.cameBack, tr('usage.cameBack'), tr('usage.cameBackNote')),
    tile(
      summary.regulars,
      tr('usage.regulars'),
      tr('usage.regularsNote', { days: usageCount(USAGE_REGULAR_DAYS), decisions: usageCount(USAGE_REGULAR_DECISIONS) }),
    ),
    tile(summary.recent, tr('usage.recent', { n: usageCount(USAGE_RECENT_DAYS) }), tr('usage.recentNote')),
  );

  list.replaceChildren(
    ...summary.people.map((person) => {
      const card = document.createElement('div');
      card.className = 'usage-person';

      const head = document.createElement('div');
      head.className = 'usage-name';
      const name = document.createElement('span');
      name.dir = 'auto';
      name.textContent = person.name;
      const tier = document.createElement('span');
      const [tierClass, tierKey] = person.regular
        ? ['regular', 'usage.tierRegular']
        : person.cameBack
          ? ['back', 'usage.tierBack']
          : ['once', 'usage.tierOnce'];
      tier.className = `usage-tier ${tierClass}`;
      tier.textContent = tr(tierKey);
      head.append(name, tier);

      const days = document.createElement('div');
      days.className = 'usage-detail';
      days.textContent = person.counted
        ? tr('usage.lastPlayed', {
            days: person.days === 1 ? tr('usage.oneDay') : tr('usage.days', { days: usageCount(person.days) }),
            last: usageDate(person.lastPlayed),
          })
        : tr('usage.notCounted', { last: person.lastSeen ? usageDate(person.lastSeen) : '—' });

      const decisions = document.createElement('div');
      decisions.className = 'usage-detail';
      decisions.textContent = tr('usage.decisions', {
        bj: usageCount(person.blackjack),
        uth: usageCount(person.ultimate),
      });

      card.append(head, days, decisions);
      return card;
    }),
  );
}


/*
 * Screens, language, and the two panels that only exist in the shared build.
 *
 * The local app is two pages and the browser navigates between them. A single
 * published page cannot do that, so screens are mounted one at a time into the
 * same container — which has the useful side effect that the two page scripts
 * keep working untouched: only one of them is ever looking at the DOM, so their
 * element ids never meet.
 */

/* --- Language ------------------------------------------------------------- */

const dir = (code) => (LOCALES.find((l) => l.code === code) ?? LOCALES[0]).dir;

let locale = (() => {
  const saved = store.get('ev:locale');
  if (saved && LOCALES.some((l) => l.code === saved)) return saved;
  for (const tag of navigator.languages ?? [navigator.language ?? 'en']) {
    if (String(tag).toLowerCase().startsWith('he')) return 'he';
  }
  return 'en';
})();

let messages = catalogue(locale);

function tr(key, params) {
  const template = messages[key];
  if (template === undefined) return key;
  if (!params) return template;
  return template.replace(/\{(\w+)\}/g, (_, name) =>
    params[name] === undefined ? `{${name}}` : String(params[name]),
  );
}

/** The contract the page scripts expect from the local app's i18n client. */
window.EV = {
  get locale() {
    return locale;
  },
  get dir() {
    return dir(locale);
  },
  t: tr,
  sweep,
  setLocale,
  ready: Promise.resolve(),
};
window.EV_LOCALES = LOCALES;

function applyLanguage() {
  const root = document.documentElement;
  root.setAttribute('lang', locale);
  root.setAttribute('dir', dir(locale));
  document.title = tr('ui.appName');
}

function setLocale(code) {
  locale = code;
  messages = catalogue(code);
  store.set('ev:locale', code);
  session.setLocale(code);
  uthSession.setLocale(code);
  applyLanguage();
  // Re-mounting redraws every generated sentence in the new language. The local
  // app reloads instead, because there the prose is composed on the server and
  // has to be fetched again; here it is composed in this scope, so there is
  // nothing to fetch and no reason to blink.
  mount(screen);
}

/** Translate whatever is currently mounted. Same markup contract as the local app. */
function sweep(scope) {
  const where = scope ?? document;
  for (const node of where.querySelectorAll('[data-i18n]')) {
    node.textContent = tr(node.dataset.i18n);
  }
  for (const node of where.querySelectorAll('[data-i18n-attr]')) {
    for (const pair of node.dataset.i18nAttr.split(',')) {
      const [attr, key] = pair.split(':');
      node.setAttribute(attr.trim(), tr(key.trim()));
    }
  }
  for (const node of where.querySelectorAll('[data-i18n-value]')) {
    if (node.value === '' || node.dataset.i18nPristine === 'true') {
      node.value = tr(node.dataset.i18nValue);
      node.dataset.i18nPristine = 'true';
    }
  }
}

/* --- Screens -------------------------------------------------------------- */

/* What is actually mounted. Starts at the door, not at the home screen. */
let screen = 'welcome';
const app = () => document.getElementById('app');

/*
 * The screen lives in the hash.
 *
 * The doors are rewritten to `#home` and `#table` at build time, for a reason
 * that is about sharing rather than routing: the built page is served from
 * `/ishalom/`, and the local app's `/table.html` left the site whenever a click
 * was not an ordinary left click. Keeping the hash in step means a copied link
 * opens the screen it was copied from, and the browser's back button walks the
 * screens instead of leaving the app.
 *
 * `#ultimate` joined them in round 4a, when the door stopped being a preview.
 */
// `#usage` (round 9) is the one screen nothing links to: see usage.js.
const SCREENS = { '#home': 'home', '#table': 'table', '#ultimate': 'ultimate', '#usage': 'usage' };
const SCREEN_HTML = {
  home: () => HOME_HTML,
  table: () => TABLE_HTML,
  ultimate: () => ULTIMATE_HTML,
  usage: () => usageHtml(),
};
const screenFromHash = () => SCREENS[location.hash] ?? null;

function mount(name) {
  screen = name;
  // Set before the markup, and only when it differs: `hashchange` fires after
  // this returns, sees the screen it names is already mounted, and does nothing.
  if (location.hash !== `#${name}`) location.hash = `#${name}`;
  app().innerHTML = SCREEN_HTML[name]();
  sweep(app());
  applyLanguage();

  if (name === 'home') {
    addSocialTabs();
    initHome();
    const saved = store.get('ev:tab');
    if (saved === 'table' || saved === 'feed') {
      app().querySelector(`.tab[data-tab="${saved}"]`)?.click();
    }
  } else if (name === 'ultimate') {
    initUltimate();
  } else if (name === 'usage') {
    void initUsage();
  } else {
    initTable();
  }

  // The doors and the back link are ordinary links in the local app. Here they
  // change screens instead of pages.
  for (const link of app().querySelectorAll('a[href]')) {
    const target = link.getAttribute('href');
    if (SCREENS[target]) {
      link.addEventListener('click', (event) => {
        event.preventDefault();
        mount(SCREENS[target]);
      });
    }
  }

  mountLanguageBar();
  if (name === 'home') mountSwitchPlayer();
}

/**
 * "Not you?" — the way off a shared computer, and the way to test the door.
 *
 * Only where there is a table to come back to: with no backend the record lives
 * in this browser alone, and forgetting it would be the one destructive button
 * in the app.
 */
function mountSwitchPlayer() {
  if (!backend) return;
  const footer = app().querySelector('.footer');
  if (!footer) return;
  // Approved round 10: the one thing a player needs when the address changes.
  const remember = document.createElement('p');
  remember.className = 'remember';
  remember.textContent = tr('home.remember');
  footer.parentElement.insertBefore(remember, footer);

  const button = document.createElement('button');
  button.className = 'link switch-player';
  button.type = 'button';
  button.textContent = tr('welcome.switch');
  button.title = tr('welcome.switchNote');
  button.addEventListener('click', switchPlayer);
  footer.parentElement.insertBefore(button, footer);
}

function mountLanguageBar() {
  const shell = app().querySelector('.shell');
  if (!shell) return;
  const bar = document.createElement('div');
  bar.className = 'fontbar';
  const label = document.createElement('span');
  label.textContent = tr('ui.language');
  bar.appendChild(label);
  for (const info of LOCALES) {
    const button = document.createElement('button');
    button.type = 'button';
    button.lang = info.code;
    button.textContent = info.name;
    button.setAttribute('aria-pressed', String(info.code === locale));
    button.addEventListener('click', () => setLocale(info.code));
    bar.appendChild(button);
  }
  shell.insertBefore(bar, shell.firstChild);
}

/* --- The two shared panels ------------------------------------------------ */

function addSocialTabs() {
  const tabs = app().querySelector('.tabs');
  const anchor = app().querySelector('#panel-stats');
  if (!tabs || !anchor) return;

  for (const [key, labelKey] of [['table', 'social.table'], ['feed', 'social.feed']]) {
    const tab = document.createElement('button');
    tab.className = 'tab';
    tab.setAttribute('role', 'tab');
    tab.dataset.tab = key;
    tab.setAttribute('aria-selected', 'false');
    tab.textContent = tr(labelKey);
    tabs.appendChild(tab);

    const panel = document.createElement('section');
    panel.className = 'tab-body';
    panel.id = `panel-${key}`;
    panel.setAttribute('role', 'tabpanel');
    panel.hidden = true;
    anchor.parentElement.insertBefore(panel, anchor.nextSibling);

    tab.addEventListener('click', () => {
      for (const other of app().querySelectorAll('.tab')) {
        other.setAttribute('aria-selected', String(other === tab));
      }
      for (const body of app().querySelectorAll('.tab-body')) {
        body.hidden = body !== panel;
      }
      store.set('ev:tab', key);
    });
  }
  renderSocial();
}

function renderSocial() {
  const table = document.getElementById('panel-table');
  const stream = document.getElementById('panel-feed');
  if (table) renderLeaderboard(table);
  if (stream) renderFeed(stream);
}

/** The same `**bold**` convention the explanation layer uses, kept consistent. */
function rich(target, text) {
  const escaped = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  target.innerHTML = escaped
    .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
    .replace(/(?<![\w>])([+−-]?\d+(?:[.,]\d+)?%?\+?)(?![\w<])/g, '<span class="num">$1</span>');
}

const emptyNote = (text) => {
  const p = document.createElement('p');
  p.className = 'empty-note';
  p.textContent = text;
  return p;
};

function renderLeaderboard(box) {
  box.replaceChildren();
  if (!backendReady) return void box.appendChild(emptyNote(tr('social.connecting')));
  if (!backend) return void box.appendChild(emptyNote(tr('social.offline')));
  if (!backendReachable) return void box.appendChild(emptyNote(tr('social.offlineNow')));

  // One board, two games (round 10): the switch, then the chosen game's ranking,
  // named — the numbers are never added together or put in one list.
  box.appendChild(boardSwitch());
  const caption = document.createElement('p');
  caption.className = 'board-caption';
  caption.textContent = tr(boardGame === 'uth' ? 'social.byUltimate' : 'social.byBlackjack');
  box.appendChild(caption);
  if (boardGame === 'uth') return void renderUthBoard(box);

  // The Blackjack side, as it was before round 10: same rows, same order.
  const rated = leaderboard.filter((p) => p.decisions > 0);
  if (rated.length === 0) return void box.appendChild(emptyNote(tr('social.noPlayers')));

  const list = document.createElement('ol');
  list.className = 'ladder board';
  rated.forEach((player, index) => {
    const row = document.createElement('li');
    row.className = 'board-row' + (player.id === me.id ? ' is-me' : '');

    const place = document.createElement('span');
    place.className = 'board-place';
    place.textContent = index + 1;

    const who = document.createElement('span');
    who.className = 'board-name';
    who.textContent = player.name;

    const score = document.createElement('span');
    score.className = 'ladder-score';
    score.textContent = player.rating > 0 ? window.EVFigure.units(player.rating) : '—';
    if (player.provisional) score.classList.add('provisional');

    const detail = document.createElement('span');
    detail.className = 'board-detail';
    detail.textContent = tr('social.playerLine', {
      accuracy: (player.accuracy * 100).toFixed(1),
      hands: player.hands,
    });

    row.append(place, who, score, detail);
    list.appendChild(row);
  });
  box.appendChild(list);
}

/** Blackjack | Ultimate. The choice is remembered on this device. */
function boardSwitch() {
  const bar = document.createElement('div');
  bar.className = 'board-games';
  bar.setAttribute('role', 'group');
  for (const [key, label] of [['bj', 'ui.blackjack'], ['uth', 'ui.ultimate']]) {
    const button = document.createElement('button');
    button.type = 'button';
    button.dataset.game = key;
    button.textContent = tr(label);
    button.setAttribute('aria-pressed', String(boardGame === key));
    button.addEventListener('click', () => {
      if (boardGame === key) return;
      boardGame = key;
      store.set('ev:board', key);
      renderSocial();
      if (key === 'uth') void loadUthBoard();
    });
    bar.appendChild(button);
  }
  return bar;
}

/** The Ultimate side: the same row as Blackjack's, ranked by the Ultimate rating. */
function renderUthBoard(box) {
  if (uthBoard.state === 'idle') void loadUthBoard();
  if (uthBoard.state === 'idle' || uthBoard.state === 'loading') {
    return void box.appendChild(emptyNote(tr('social.connecting')));
  }
  if (uthBoard.state === 'pending') return void box.appendChild(emptyNote(tr('social.uthPending')));
  if (uthBoard.state === 'offline') return void box.appendChild(emptyNote(tr('social.offlineNow')));
  if (uthBoard.state === 'none') return void box.appendChild(emptyNote(tr('social.offline')));
  if (uthBoard.rows.length === 0) return void box.appendChild(emptyNote(tr('social.noUthPlayers')));

  const list = document.createElement('ol');
  list.className = 'ladder board';
  uthBoard.rows.forEach((player, index) => {
    const row = document.createElement('li');
    row.className = 'board-row' + (player.id === me.id ? ' is-me' : '');

    const place = document.createElement('span');
    place.className = 'board-place';
    place.textContent = index + 1;

    const who = document.createElement('span');
    who.className = 'board-name';
    who.textContent = player.name;

    const score = document.createElement('span');
    score.className = 'ladder-score';
    score.textContent = window.EVFigure.units(player.rating);
    if (player.provisional) score.classList.add('provisional');

    const detail = document.createElement('span');
    detail.className = 'board-detail';
    detail.textContent = tr('social.uthPlayerLine', { decisions: window.EVFigure.units(player.decisions) });

    row.append(place, who, score, detail);
    list.appendChild(row);
  });
  box.appendChild(list);
}

function renderFeed(box) {
  box.replaceChildren();
  if (!backendReady) return void box.appendChild(emptyNote(tr('social.connecting')));
  if (!backend) return void box.appendChild(emptyNote(tr('social.offline')));
  if (!backendReachable) return void box.appendChild(emptyNote(tr('social.offlineNow')));
  if (feed.length === 0) return void box.appendChild(emptyNote(tr('social.noFeed')));

  for (const item of feed) {
    const card = document.createElement('article');
    card.className = 'feed-item ' + (item.correct ? 'good' : item.severity);

    const head = document.createElement('div');
    head.className = 'feed-head';
    const who = document.createElement('strong');
    who.textContent = item.playerId === me.id ? tr('social.you') : item.name;
    const when = document.createElement('span');
    when.className = 'feed-when';
    when.textContent = ago(item.at);
    head.append(who, when);

    const line = document.createElement('p');
    line.className = 'feed-line';
    line.textContent = item.headline;

    const verdict = document.createElement('p');
    verdict.className = 'feed-verdict';
    rich(
      verdict,
      item.correct
        ? tr('social.held', { action: item.optimal })
        : tr('social.missed', {
            chosen: item.chosen,
            optimal: item.optimal,
            cost: item.evCost.toFixed(3),
          }),
    );

    card.append(head, line, verdict);
    box.appendChild(card);
  }
}

function ago(at) {
  const seconds = Math.max(0, Math.round((Date.now() - at) / 1000));
  if (seconds < 90) return tr('social.justNow');
  const minutes = Math.round(seconds / 60);
  if (minutes < 60) return tr('social.minutes', { n: minutes });
  const hours = Math.round(minutes / 60);
  if (hours < 24) return tr('social.hours', { n: hours });
  return tr('social.days', { n: Math.round(hours / 24) });
}

/* --- First run ------------------------------------------------------------ */

/**
 * The door.
 *
 * A name and a four-digit code, so the same person is the same player on any
 * device. Without a backend there is nothing to match a code against, so the
 * field is hidden and the name alone is kept — which is exactly the old
 * behaviour, and the right one for a page opened from a file.
 */
function askName() {
  screen = 'welcome';
  const canMatch = Boolean(backend);

  const wrap = document.createElement('div');
  /*
   * Opened from a home-screen icon. On iPhone that app keeps its storage apart
   * from Safari's, so a player who has been playing in Safari arrives here as a
   * stranger — exactly the case name and code exist for. One line says so.
   */
  const installed =
    (typeof matchMedia === 'function' && matchMedia('(display-mode: standalone)').matches) ||
    navigator.standalone === true;
  wrap.className = 'shell welcome';
  wrap.innerHTML = `
    <h1 class="welcome-title">${tr('ui.appName')}</h1>
    <p class="slogan">${tr('brand.slogan')}</p>
    <p class="welcome-line">${tr('welcome.line')}</p>
    <form class="welcome-form" id="welcome-form">
      <label class="welcome-label" for="welcome-name">${tr('welcome.nameLabel')}</label>
      <input class="welcome-input" id="welcome-name" maxlength="24" autocomplete="off"
             spellcheck="false" placeholder="${tr('welcome.placeholder')}" />
      ${
        canMatch
          ? `<label class="welcome-label" for="welcome-code">${tr('welcome.codeLabel')}</label>
      <input class="welcome-input welcome-code" id="welcome-code" inputmode="numeric"
             maxlength="4" autocomplete="off" pattern="[0-9]{4}" placeholder="0000" />
      <p class="welcome-hint">${tr('welcome.codeHint')}</p>
      ${installed ? `<p class="welcome-hint welcome-installed">${tr('welcome.installed')}</p>` : ''}`
          : ''
      }
      <p class="welcome-error" id="welcome-error" hidden></p>
      <button class="action primary" type="submit">${tr('welcome.start')}</button>
    </form>
    <p class="welcome-fine">${tr(canMatch ? 'welcome.fine' : 'welcome.fineLocal')}</p>`;
  app().replaceChildren(wrap);
  applyLanguage();

  const nameField = wrap.querySelector('#welcome-name');
  const codeField = wrap.querySelector('#welcome-code');
  const error = wrap.querySelector('#welcome-error');
  const button = wrap.querySelector('button[type="submit"]');
  nameField.focus();

  const complain = (key) => {
    error.textContent = tr(key);
    error.hidden = false;
  };

  wrap.querySelector('#welcome-form').addEventListener('submit', async (event) => {
    event.preventDefault();
    error.hidden = true;

    const name = nameField.value.trim().slice(0, 24);
    if (name.length === 0) return;

    if (!canMatch) {
      // No table to check against, so there is nothing a code could prove.
      await enter(name);
      return;
    }

    const code = (codeField.value || '').trim();
    if (!/^\d{4}$/.test(code)) return void complain('welcome.badCode');

    button.disabled = true;
    try {
      const rows = await backend.findByName(nameKey(name));
      const decision = await decideIdentity(name, code, rows, newId);

      if (decision.action === 'refuse') {
        complain(decision.reason === 'wrong-code' ? 'welcome.wrongCode' : 'welcome.badCode');
        return;
      }

      /*
       * `adopt` and `claim` both mean: this browser is now that player. The id
       * is taken over so the next save writes to their row rather than making
       * another one, and their record is pulled down before anything is shown.
       */
      me.id = decision.id;
      store.set('ev:playerId', decision.id);
      if (decision.pinHash) {
        me.pinHash = decision.pinHash;
        store.set('ev:pinHash', decision.pinHash);
      }
      await enter(name, decision.action !== 'create');
    } catch {
      // The table is unreachable. Rather than trap someone at the door, let
      // them in locally; the record syncs when it comes back.
      complain('welcome.offline');
      await enter(name);
    } finally {
      button.disabled = false;
    }
  });
}

/** Take the name, pull down whatever belongs to it, and open the app. */
async function enter(name, restore = false) {
  me.name = name;
  store.set('ev:playerName', name);
  session.setPlayerName(name);
  if (restore) await restoreMine();
  saveProgressLocally();
  // Fire-and-forget: joining the table is not worth waiting at the door for,
  // and the write is retried after the first hand anyway.
  void publish();
  // A shared `#table` link opens the table once its recipient has sat down,
  // rather than dropping them on the home screen with the link spent.
  mount(screenFromHash() ?? 'home');
}

/**
 * "Not you?" — forget this browser's player and go back to the door.
 *
 * It forgets, it never deletes. The record stays in the table under its name
 * and code, and the same person can walk back in with them.
 */
function switchPlayer() {
  store.set('ev:playerId', '');
  store.set('ev:playerName', '');
  store.set('ev:pinHash', '');
  store.set(PROGRESS_KEY, '');
  store.set(FEED_KEY, '');
  location.reload();
}

/* --- Boot ----------------------------------------------------------------- */

session.setLocale(locale);
/*
 * The UTH session composes its own prose, so it has to be told the language at
 * boot as well as on a switch. Without this line a Hebrew player opened
 * Ultimate onto English buttons and an English card — found by looking at the
 * built page, not by the session tests, which set the locale themselves.
 */
uthSession.setLocale(locale);
if (me.name) session.setPlayerName(me.name);
applyLanguage();
/*
 * Connecting happens once, at boot, and the door waits for it: whether a code
 * can be checked at all depends on whether there is a table to check against,
 * and asking for one that cannot be verified would be theatre.
 *
 * Kept as a promise so anything driving this page without being a browser — a
 * test, say — can wait for it rather than calling connect again and quietly
 * opening a second subscription.
 */
window.addEventListener('hashchange', () => {
  const next = screenFromHash();
  // Only once there is a player: the door has to come first, however the page
  // was opened.
  if (next && next !== screen && me.name) mount(next);
});

const booted = connect().then(() => {
  if (me.name) mount(screenFromHash() ?? 'home');
  else askName();
});

</script>
  </body>
</html>
