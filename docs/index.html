    if (take) {
      // Half the original stake, paying 2:1, so +1 unit when the hole card is a
      // ten and -0.5 when it is not.
      const holeIsTen = bjRankOfCard(this.dealerCards[1] ) === 9;
      this.insuranceNet = holeIsTen ? this.baseBet : -0.5 * this.baseBet;
    }

    this.afterOpening();
    return record;
  }

  /** Play one action on the active hand. Spec §5.1.2 step 5. */
  act(action                 , timeToDecideMs                = null)                 {
    if (this.phase !== 'player') throw new Error(`Cannot act while ${this.phase}`);

    const handIndex = this.activeHandIndex;
    const hand = this.hands[handIndex] ;
    const legal = this.legalActions();
    if (!legal.includes(action)) {
      throw new Error(`${action} is not legal here; legal actions are ${legal.join(', ')}`);
    }

    const evaluation = this.evaluate(hand, legal);
    const grade = gradeDecision(evaluation, action);
    const record = this.pushDecision({
      handIndex,
      scenarioKey: scenarioKeyForHand(
        hand.cards.map(bjRankOfCard),
        bjRankOfCard(this.dealerCards[0] ),
        legal.includes('split'),
      ),
      legalActions: legal,
      evByAction: evaluation.evByAction,
      optimalAction: evaluation.optimalAction,
      chosenAction: action,
      evCost: grade.evCost,
      severityTier: grade.severity,
      timeToDecideMs,
    });

    this.apply(action, handIndex);
    this.advance();
    return record;
  }

  // --- Applying actions ----------------------------------------------------

          apply(action                 , handIndex        )       {
    const hand = this.hands[handIndex] ;
    switch (action) {
      case 'stand':
        hand.finished = true;
        break;

      case 'hit': {
        hand.cards.push(this.draw());
        const { total } = handValue(hand.cards.map(bjRankOfCard));
        // Twenty-one and a bust both end the hand: there is nothing left to decide.
        if (total >= 21) hand.finished = true;
        break;
      }

      case 'double':
        hand.bet *= 2;
        hand.doubled = true;
        hand.cards.push(this.draw());
        hand.finished = true;
        break;

      case 'surrender':
        hand.surrendered = true;
        hand.finished = true;
        break;

      case 'split': {
        // Spec §5.1.2 step 6: the hands are played one at a time, each generating
        // its own decisions. The new hand is inserted directly after this one so
        // that order is the order they are played.
        const moved = hand.cards.pop() ;
        hand.fromSplit = true;
        const sibling             = {
          cards: [moved],
          bet: this.baseBet,
          doubled: false,
          fromSplit: true,
          surrendered: false,
          finished: false,
          net: null,
        };
        this.hands.splice(handIndex + 1, 0, sibling);
        hand.cards.push(this.draw());
        this.settleSplitAce(hand);
        break;
      }
    }
  }

  /** A split ace takes one card and stops, unless the house allows hitting them. */
          settleSplitAce(hand            )       {
    if (!hand.fromSplit || hand.cards.length !== 2) return;
    if (bjRankOfCard(hand.cards[0] ) !== 0) return;
    if (this.rules.hitSplitAces) return;
    // Re-splitting is still allowed if the house permits it, so leave a pair of
    // aces live for the player to split again.
    if (this.rules.resplitAces && bjRankOfCard(hand.cards[1] ) === 0) {
      if (this.hands.length < this.rules.maxSplitHands) return;
    }
    hand.finished = true;
  }

  /** Move to the next unfinished hand, dealing it a card if it has only one. */
          advance()       {
    for (;;) {
      const hand = this.hands[this.activeHandIndex];
      if (hand && !hand.finished) {
        if (hand.cards.length === 1) {
          hand.cards.push(this.draw());
          this.settleSplitAce(hand);
          continue;
        }
        this.phase = 'player';
        return;
      }
      if (this.activeHandIndex >= this.hands.length - 1) break;
      this.activeHandIndex++;
    }
    this.playDealer();
    this.settle();
  }

  // --- Grading -------------------------------------------------------------

  /**
   * EV of every legal action.
   *
   * In chart mode the numbers come from the derived basic-strategy chart, which
   * is what the app is teaching, restricted to the actions actually legal here —
   * a chart cell is built from two-card hands and so carries a `double` EV that
   * a three-card hand cannot use. If the cell cannot cover the spot, the exact
   * solver answers instead rather than the grade being quietly wrong.
   */
          evaluate(hand            , legal                   )                     {
    if (this.grading === 'chart') {
      const key = scenarioKeyForHand(
        hand.cards.map(bjRankOfCard),
        bjRankOfCard(this.dealerCards[0] ),
        legal.includes('split'),
      );
      const cell = this.chart.cells.get(key);
      if (cell && legal.every((action) => cell.evByAction[action] !== undefined)) {
        const evByAction                                           = {};
        let optimalAction = legal[0] ;
        let optimalEv = -Infinity;
        for (const action of legal) {
          const ev = cell.evByAction[action] ;
          evByAction[action] = ev;
          if (ev > optimalEv) {
            optimalEv = ev;
            optimalAction = action;
          }
        }
        return { legalActions: legal, evByAction, optimalAction, optimalEv };
      }
    }

    return this.solver.evaluate(
      hand.cards.map(bjRankOfCard),
      bjRankOfCard(this.dealerCards[0] ),
      this.grading === 'chart' ? this.freshComposition() : this.unseenComposition(),
      { fromSplit: hand.fromSplit, handCount: this.hands.length },
    );
  }

  /**
   * What the player cannot see: the undealt shoe plus the dealer's hole card,
   * which is out of the shoe but face down.
   */
          unseenComposition()              {
    const hole = this.dealerRevealed ? [] : this.dealerCards.slice(1);
    return this.shoe.unseenComposition(hole);
  }

  /**
   * A fresh shoe minus only the cards this round has turned face up.
   *
   * This is the composition the chart itself is derived from, and it is what
   * chart-mode grading falls back to when a spot has no cell — a three-card
   * hand, most often. Handing the solver the *live* shoe instead made the grade
   * depend on the previous forty hands, so the same 6-4-3 against a 9 could be
   * marked differently in the first shoe than in the fifth. That difference is
   * not one basic strategy has, and not one the player can see. Card removal
   * (this round's visible cards) is part of the chart's own derivation; card
   * counting (the shoe's history) is not, and belongs to `exact-shoe`.
   */
          freshComposition()              {
    const shoe = Composition.fresh(this.rules.decks);
    for (const hand of this.hands) {
      for (const card of hand.cards) shoe.remove(bjRankOfCard(card));
    }
    const dealerVisible = this.dealerRevealed ? this.dealerCards : this.dealerCards.slice(0, 1);
    for (const card of dealerVisible) shoe.remove(bjRankOfCard(card));
    return shoe;
  }

  /**
   * The EV insurance is graded against.
   *
   * In chart mode this is the chart's own insurance cell — a fresh shoe with the
   * dealer's ace removed — for the same reason every other decision is graded
   * against a chart: the app teaches basic strategy, and basic strategy says
   * never insure. Grading against the live shoe meant that a player who
   * correctly declined was marked wrong, and docked rating, on exactly those
   * hands where the shoe happened to have run ten-rich — punished for playing
   * the strategy the app is teaching, on information the app never showed them.
   * That is the §3.1 error in its purest form.
   *
   * `grading: 'exact-shoe'` is the counting mode, and there the live shoe is the
   * whole point.
   *
   * A player natural against an ace reaches this same decision — taking
   * insurance there is what a casino calls even money — so it is graded here
   * too, by the same number. It is the same bet.
   */
          gradedInsuranceEv()         {
    if (this.grading === 'chart') {
      const cell = this.chart.cells.get(INSURANCE_SCENARIO_KEY);
      if (cell) return cell.evByAction.takeInsurance ?? 0;
    }
    return insuranceEv(this.unseenComposition());
  }

          pushDecision(input   
                      
                        
                                 
                                                      
                                
                               
                    
                                
                                   
   )                 {
    const best = input.evByAction[input.optimalAction] ?? 0;
    const chosen = input.evByAction[input.chosenAction] ?? 0;
    const raw = input.evCost ?? best - chosen;
    const evCost = raw < 1e-12 ? 0 : raw;

    const record                 = {
      sequenceIndex: this.decisions.length,
      handIndex: input.handIndex,
      scenarioKey: input.scenarioKey,
      legalActions: input.legalActions,
      evByAction: input.evByAction,
      optimalAction: input.optimalAction,
      chosenAction: input.chosenAction,
      evCost,
      severityTier: input.severityTier ?? severityForCost(evCost),
      timeToDecideMs: input.timeToDecideMs ?? null,
    };
    this.decisions.push(record);
    return record;
  }

  // --- Resolving -----------------------------------------------------------

  /** Spec §5.1.2 step 7. The dealer does not draw if no hand is still live. */
          playDealer()       {
    this.dealerRevealed = true;
    const live = this.hands.some(
      (hand) => !hand.surrendered && handValue(hand.cards.map(bjRankOfCard)).total <= 21,
    );
    if (!live) return;

    for (;;) {
      const { total, soft } = handValue(this.dealerCards.map(bjRankOfCard));
      if (total > 17) return;
      if (total === 17 && !(soft && this.rules.soft17 === 'H17')) return;
      this.dealerCards.push(this.draw());
    }
  }

  /** Spec §5.1.2 step 8. */
          settle()       {
    this.dealerRevealed = true;
    const dealerRanks = this.dealerCards.map(bjRankOfCard);
    const dealerNatural = isBlackjack(dealerRanks);
    const dealer = handValue(dealerRanks);

    let total = this.insuranceNet;
    for (const hand of this.hands) {
      hand.net = this.settleHand(hand, dealerNatural, dealer.total);
      total += hand.net;
    }
    this.settledNet = total;
    this.phase = 'settled';
  }

          settleHand(hand            , dealerNatural         , dealerTotal        )         {
    if (hand.surrendered) return -0.5 * this.baseBet;

    const ranks = hand.cards.map(bjRankOfCard);
    // A hand that came out of a split is never a natural, however it is made up.
    const playerNatural = !hand.fromSplit && isBlackjack(ranks);
    const player = handValue(ranks);

    if (dealerNatural) {
      if (playerNatural) return 0;
      // In a peek game the player never got to act, so only the original wager
      // is at stake. With no hole card the dealer's natural takes the doubled
      // and split wagers too, which is what makes the rule expensive.
      return this.rules.peek ? -this.baseBet : -hand.bet;
    }

    if (playerNatural) return blackjackPayoutMultiple(this.rules) * hand.bet;
    if (player.total > 21) return -hand.bet;
    if (dealerTotal > 21) return hand.bet;
    if (player.total > dealerTotal) return hand.bet;
    if (player.total < dealerTotal) return -hand.bet;
    return 0;
  }

  // --- Records -------------------------------------------------------------

  /** The finished hand, as the shape §11 persists. */
  get handRecord()             {
    if (this.phase !== 'settled') throw new Error('The hand is not finished');
    return {
      id: this.handId,
      rules: this.rules,
      dealtCards: [...this.dealtCards],
      playerCards: this.hands.map((hand) => [...hand.cards]),
      dealerCards: [...this.dealerCards],
      baseBet: this.baseBet,
      insuranceTaken: this.insuranceTaken,
      netUnits: this.settledNet ?? 0,
      decisions: [...this.decisions],
    };
  }
}

/* ===== packages/ev-engine/src/poker/handValue.ts ===== */
/**
 * Poker hand values as comparable integers (spec §6.4).
 *
 * A hand's strength is one non-negative integer: bigger is better, equal means a
 * tie. That is all the UTH solvers need — they compare millions of showdowns and
 * never ask *why* one hand beat another — so the representation is built for
 * comparison speed, with the human-readable decomposition available separately.
 *
 * Layout, 24 bits:
 *
 *     cccc rrrr rrrr rrrr rrrr rrrr
 *     │    │
 *     │    └── five significant ranks, four bits each, most significant first
 *     └─────── category, 0 (high card) .. 8 (straight flush)
 *
 * "Significant ranks" means whatever decides the hand within its category: the
 * pair rank then three kickers for a pair, the trips rank then the pair rank for
 * a full house, the high card for a straight. Unused slots are zero. Two hands in
 * different categories never compare on their rank slots, because the category
 * outranks every one of them.
 */

/** 0 = deuce .. 12 = ace, matching `core/cards`. */
                          

const HIGH_CARD = 0;
const PAIR = 1;
const TWO_PAIR = 2;
const THREE_OF_A_KIND = 3;
const STRAIGHT = 4;
const FLUSH = 5;
const FULL_HOUSE = 6;
const FOUR_OF_A_KIND = 7;
const STRAIGHT_FLUSH = 8;

                                                             

const CATEGORY_NAMES                    = [
  'high card',
  'pair',
  'two pair',
  'three of a kind',
  'straight',
  'flush',
  'full house',
  'four of a kind',
  'straight flush',
];

const CATEGORY_SHIFT = 20;

/** Every possible value is strictly below this. */
const MAX_HAND_VALUE = (STRAIGHT_FLUSH + 1) << CATEGORY_SHIFT;

function categoryOf(value        )               {
  return (value >>> CATEGORY_SHIFT)                ;
}

/**
 * How many rank slots each category actually uses.
 *
 * This has to be a table rather than "read until you hit a zero": rank 0 is the
 * deuce, so an unused slot and a deuce look identical. The count is fixed per
 * category — a seven-card hand with one pair always has three kickers, a flush
 * always has five ranks — which is also why comparing two values in the same
 * category is sound despite the ambiguity.
 */
const SIGNIFICANT_RANK_COUNT                    = [
  5, // high card: five ranks
  4, // pair: the pair, then three kickers
  3, // two pair: both pairs, then one kicker
  3, // trips: the trips, then two kickers
  1, // straight: the high card
  5, // flush: five ranks
  2, // full house: trips then pair
  2, // quads: the quads, then one kicker
  1, // straight flush: the high card
];

/** The ranks that decide this hand within its category, most significant first. */
function significantRanks(value        )         {
  const count = SIGNIFICANT_RANK_COUNT[categoryOf(value)] ;
  const ranks         = [];
  for (let i = 0; i < count; i++) {
    ranks.push((value >>> (16 - 4 * i)) & 0xf);
  }
  return ranks;
}

const RANK_NAMES = '23456789TJQKA';

/** Human-readable form, for feedback copy and for test failure messages. */
function describeHandValue(value        )         {
  const category = categoryOf(value);
  const ranks = significantRanks(value)
    .map((r) => RANK_NAMES[r] ?? '?')
    .join('');
  return ranks.length > 0 ? `${CATEGORY_NAMES[category]} (${ranks})` : CATEGORY_NAMES[category] ;
}

/** Assemble a value from a category and up to five significant ranks. */
function makeHandValue(category              , ...ranks        )         {
  let value = category << CATEGORY_SHIFT;
  for (let i = 0; i < ranks.length && i < 5; i++) {
    value |= ranks[i]  << (16 - 4 * i);
  }
  return value;
}

/* ===== packages/ev-engine/src/poker/evaluator.ts ===== */
/**
 * Seven-card poker hand evaluator (spec §6.4).
 *
 * Both UTH modules lean on this. The flop decision alone enumerates
 * C(45,2) × C(43,2) ≈ 894,000 outcomes, two showdowns each, inside a 200 ms
 * budget — so this runs a couple of million times per decision and its cost
 * dominates everything above it.
 *
 * Scheme
 * ------
 * The spec calls for "a standard perfect-hash or lookup-table evaluator" and
 * §6.5 budgets 10–130 MB for its tables, which §17 leaves open pending a
 * benchmark. What is implemented here needs neither: the hand is decomposed with
 * bit arithmetic over four 13-bit suit masks, and the only tables are two of 8192
 * entries each (64 KB total, computed at load in about a millisecond). No asset
 * to ship, no first-run wait, and the §13 app-size budget stays free for
 * everything else. `test/poker-evaluator.bench.ts` reports the throughput this
 * buys.
 *
 * The trick that makes it work is computing rank multiplicities without ever
 * touching a counter array: a rank appears at least twice exactly when two suit
 * masks share its bit, at least three times when three do, and so on. Six ANDs
 * and a few ORs replace a thirteen-element histogram, and the function stays
 * pure — no scratch buffer, no module state, nothing to reset between calls.
 *
 * Two facts about seven-card hands keep the branching short, and both are
 * asserted in the test suite rather than merely believed:
 *
 *   - A flush and a full house cannot coexist. A flush uses five cards of one
 *     suit with five distinct ranks; trips would need both remaining cards to
 *     match one of them, and then nothing is left to make the pair.
 *   - A flush and four of a kind cannot coexist either: quads take one card of
 *     each suit, leaving at most four cards in any single suit.
 *
 * So once a flush is found, the answer is a straight flush or that flush, and
 * the rank-based path never has to run.
 */

const MASK_COUNT = 1 << 13;

/**
 * For each 13-bit rank mask, the rank of the highest straight's top card, or -1.
 *
 * The wheel is the awkward case: A-2-3-4-5 is a straight whose top card is the
 * five, so it maps to rank 3 and sorts below every other straight, which is
 * exactly right.
 */
const straightHigh = new Int8Array(MASK_COUNT).fill(-1);

/**
 * For each 13-bit rank mask, its top five ranks packed into the significant-rank
 * slots of a hand value: `r1<<16 | r2<<12 | r3<<8 | r4<<4 | r5`. Masks with fewer
 * than five bits pack what they have and leave the rest zero.
 *
 * Packing them in place means kickers can be taken by shifting: the top three
 * ranks of a mask, positioned for a pair's kicker slots, are one shift and one
 * mask away.
 */
const topFive = new Int32Array(MASK_COUNT);

(function buildTables()       {
  const WHEEL = (1 << 12) | (1 << 3) | (1 << 2) | (1 << 1) | 1; // A,5,4,3,2

  for (let mask = 0; mask < MASK_COUNT; mask++) {
    for (let high = 12; high >= 4; high--) {
      const run = 0b11111 << (high - 4);
      if ((mask & run) === run) {
        straightHigh[mask] = high;
        break;
      }
    }
    if (straightHigh[mask] === -1 && (mask & WHEEL) === WHEEL) {
      straightHigh[mask] = 3; // five-high
    }

    let packed = 0;
    let taken = 0;
    for (let rank = 12; rank >= 0 && taken < 5; rank--) {
      if (mask & (1 << rank)) {
        packed |= rank << (16 - 4 * taken);
        taken++;
      }
    }
    topFive[mask] = packed;
  }
})();

function highestRank(mask        )         {
  return 31 - Math.clz32(mask);
}

/** Top three ranks of `mask`, positioned as a pair's three kickers. */
function threeKickers(mask        )         {
  return (topFive[mask]  >>> 4) & 0x0fff0;
}

/** Top two ranks of `mask`, positioned as a trips hand's two kickers. */
function twoKickers(mask        )         {
  return (topFive[mask]  >>> 4) & 0x0ff00;
}

/** Top rank of `mask`, positioned as a quads hand's single kicker. */
function oneKicker(mask        )         {
  return (topFive[mask]  >>> 4) & 0x0f000;
}

/** Top rank of `mask`, positioned as a two-pair hand's single kicker. */
function twoPairKicker(mask        )         {
  return (topFive[mask]  >>> 8) & 0x00f00;
}

/**
 * Evaluate seven cards into a comparable integer (see `handValue.ts`).
 *
 * `cards` must hold at least seven cards starting at `offset`. Callers in a hot
 * loop are expected to reuse one array rather than allocate per showdown; this
 * function neither reads nor writes anything outside its arguments.
 */
function evaluate7(cards                 , offset = 0)         {
  let s0 = 0;
  let s1 = 0;
  let s2 = 0;
  let s3 = 0;

  for (let i = 0; i < 7; i++) {
    const card = cards[offset + i] ;
    const bit = 1 << (card >> 2); // rankOf, inlined
    const suit = card & 3; // suitOf, inlined

    // Deal each card's bit into its suit's mask without branching.
    //
    // `(x - 1) >> 31` is −1 when x is zero and 0 otherwise — the borrow out of
    // the subtraction, smeared across all 32 bits by the arithmetic shift. Xor
    // the suit against each candidate first and the expression becomes an
    // all-ones mask exactly for the matching suit, so the bit ORs into that
    // accumulator and vanishes from the other three.
    //
    // This is three times faster than the equivalent switch, and mask building
    // is most of what this function costs — §6.4 warns that the evaluator
    // dominates runtime, and it is not wrong.
    s0 |= bit & ((suit - 1) >> 31);
    s1 |= bit & (((suit ^ 1) - 1) >> 31);
    s2 |= bit & (((suit ^ 2) - 1) >> 31);
    s3 |= bit & (((suit ^ 3) - 1) >> 31);
  }

  return evaluateSuitMasks(s0, s1, s2, s3);
}

/**
 * The evaluator proper, over four 13-bit rank masks — one per suit.
 *
 * Exposed because the UTH solvers build these masks incrementally as they walk
 * boards, which saves re-reading seven cards for every dealer holding.
 */
function evaluateSuitMasks(s0        , s1        , s2        , s3        )         {
  // --- Flush, and with it straight flush -----------------------------------
  // Only one suit can hold five of seven cards, so at most one of these fires.
  let flushMask = 0;
  if (popcount(s0) >= 5) flushMask = s0;
  else if (popcount(s1) >= 5) flushMask = s1;
  else if (popcount(s2) >= 5) flushMask = s2;
  else if (popcount(s3) >= 5) flushMask = s3;

  if (flushMask !== 0) {
    const high = straightHigh[flushMask] ;
    if (high >= 0) return (STRAIGHT_FLUSH << CATEGORY_SHIFT) | (high << 16);
    // Neither a full house nor quads can share seven cards with a flush, so this
    // flush is the whole answer.
    return (FLUSH << CATEGORY_SHIFT) | topFive[flushMask] ;
  }

  // --- Rank multiplicities, without a histogram -----------------------------
  const atLeast1 = s0 | s1 | s2 | s3;
  const atLeast2 =
    (s0 & s1) | (s0 & s2) | (s0 & s3) | (s1 & s2) | (s1 & s3) | (s2 & s3);
  const atLeast3 =
    (s0 & s1 & s2) | (s0 & s1 & s3) | (s0 & s2 & s3) | (s1 & s2 & s3);
  const quads = s0 & s1 & s2 & s3;

  if (quads !== 0) {
    const q = highestRank(quads);
    return (
      (FOUR_OF_A_KIND << CATEGORY_SHIFT) |
      (q << 16) |
      oneKicker(atLeast1 & ~(1 << q))
    );
  }

  const trips = atLeast3;
  const pairs = atLeast2 & ~atLeast3;

  if (trips !== 0) {
    const t = highestRank(trips);
    // The pair of a full house may be a second set of trips, played as a pair.
    const paired = (trips & ~(1 << t)) | pairs;
    if (paired !== 0) {
      return (FULL_HOUSE << CATEGORY_SHIFT) | (t << 16) | (highestRank(paired) << 12);
    }
  }

  const straight = straightHigh[atLeast1] ;
  if (straight >= 0) return (STRAIGHT << CATEGORY_SHIFT) | (straight << 16);

  if (trips !== 0) {
    const t = highestRank(trips);
    return (
      (THREE_OF_A_KIND << CATEGORY_SHIFT) |
      (t << 16) |
      twoKickers(atLeast1 & ~(1 << t))
    );
  }

  if (pairs !== 0) {
    const high = highestRank(pairs);
    const rest = pairs & ~(1 << high);
    if (rest !== 0) {
      const low = highestRank(rest);
      return (
        (TWO_PAIR << CATEGORY_SHIFT) |
        (high << 16) |
        (low << 12) |
        twoPairKicker(atLeast1 & ~(1 << high) & ~(1 << low))
      );
    }
    return (PAIR << CATEGORY_SHIFT) | (high << 16) | threeKickers(atLeast1 & ~(1 << high));
  }

  return (HIGH_CARD << CATEGORY_SHIFT) | topFive[atLeast1] ;
}

/** Population count for a 13-bit mask. */
function popcount(x        )         {
  let n = x - ((x >> 1) & 0x5555);
  n = (n & 0x3333) + ((n >> 2) & 0x3333);
  n = (n + (n >> 4)) & 0x0f0f;
  return (n + (n >> 8)) & 0x1f;
}

/** Exposed for the table-integrity tests; not part of the hot path. */
const internals = { straightHigh, topFive, popcount };

/* ===== packages/ev-engine/src/poker/best-five.ts ===== */
/**
 * Which five cards make a seven-card hand (spec §6.4).
 *
 * `evaluate7` answers "how strong", which is all the solvers need. A player at
 * showdown needs "which cards": the five that are highlighted on the felt and
 * named in words. This finds them by the only honest route — the same evaluator,
 * asked about each of the 21 five-card subsets, keeping one whose value equals
 * the seven-card value. Nothing about poker hand shapes is re-implemented here,
 * so the cards shown can never disagree with the hand that was scored.
 */

/** The value of any set of up to seven cards, by the same evaluator as `evaluate7`. */
function evaluateCards(cards                 )         {
  let s0 = 0;
  let s1 = 0;
  let s2 = 0;
  let s3 = 0;
  for (const card of cards) {
    const bit = 1 << (card >> 2);
    switch (card & 3) {
      case 0:
        s0 |= bit;
        break;
      case 1:
        s1 |= bit;
        break;
      case 2:
        s2 |= bit;
        break;
      default:
        s3 |= bit;
    }
  }
  return evaluateSuitMasks(s0, s1, s2, s3);
}

                           
                                                        
                
                                                               
                
 

/**
 * The five cards that make the hand.
 *
 * When more than one subset scores the same — a kicker that plays from either
 * the board or the hand — the one keeping the earlier cards is returned, so the
 * answer is deterministic. Any of them is a correct "best five".
 */
function bestFive(seven                 )           {
  if (seven.length !== 7) throw new Error(`Expected seven cards, got ${seven.length}`);
  const value = evaluate7(seven);
  // Drop two cards, latest first, so the earliest cards are kept longest.
  for (let a = 6; a >= 1; a--) {
    for (let b = a - 1; b >= 0; b--) {
      const five = seven.filter((_, index) => index !== a && index !== b);
      if (evaluateCards(five) === value) return { value, cards: five };
    }
  }
  throw new Error('No five of these seven cards make the seven-card hand');
}

/* ===== packages/ev-engine/src/uth/rules.ts ===== */
/**
 * Ultimate Texas Hold'em rules and paytables (spec §5.2).
 *
 * Three bets are always live. The Ante and Blind are equal and mandatory, and
 * the Play bet is made once, at whichever decision point the player chooses:
 * 4x the ante before the flop, 2x after the flop, 1x after the river. Checking
 * costs nothing but shrinks the raise the player will be allowed later, which is
 * the whole strategic shape of the game.
 *
 * All EVs in this module are in units of the ante, so an unraised hand still has
 * two units at risk and folding is exactly -2.
 */

/** The Play bet multiple available at each decision point. */
const PREFLOP_RAISE = 4;
const FLOP_RAISE = 2;
const RIVER_RAISE = 1;

/**
 * The 3x pre-flop raise, where a casino offers one alongside 4x.
 *
 * Spec §5.2.3: raising 3x is never correct, because any hand strong enough to
 * raise pre-flop is strong enough to raise the maximum. It is modelled so the
 * trainer can grade someone who takes it and show them what it cost, not because
 * it is ever the answer.
 */
const PREFLOP_RAISE_SMALL = 3;

/** Folding forfeits the Ante and the Blind. */
const FOLD_RESULT = -2;

/**
 * Blind paytable: what a winning hand of each strength pays, on top of the bet.
 * Anything below a straight pushes, which is a zero here rather than a loss.
 *
 * The royal flush is a straight flush to the ace; the evaluator keeps the
 * straight's high card in the score, so the two are told apart without a
 * separate category.
 */
                                
               
                     
                        
                      
                    
                
                   
 

/** The default paytable from spec §5.2.2. */
const DEFAULT_BLIND_PAYTABLE                = {
  name: 'standard',
  royalFlush: 500,
  straightFlush: 50,
  fourOfAKind: 10,
  fullHouse: 3,
  flush: 1.5,
  straight: 1,
};

const ACE_RANK = 12;

/** Blind payout multiple for a winning hand. Zero means the Blind pushes. */
function blindPayout(score        , paytable               )         {
  switch (categoryOf(score)) {
    case STRAIGHT_FLUSH: {
      const high = (score >>> 16) & 0xf;
      return high === ACE_RANK ? paytable.royalFlush : paytable.straightFlush;
    }
    case FOUR_OF_A_KIND:
      return paytable.fourOfAKind;
    case FULL_HOUSE:
      return paytable.fullHouse;
    case FLUSH:
      return paytable.flush;
    case STRAIGHT:
      return paytable.straight;
    default:
      return 0;
  }
}

/**
 * Trips paytables (spec §5.2.2). These vary by casino, and whether the bet is
 * worth making at all depends entirely on which one is in play, so several ship

/* ===== packages/ev-engine/src/uth/showdown.ts ===== */
/**
 * Settling one Ultimate Texas Hold'em hand (spec §5.2.1).
 *
 * Three bets resolve independently and by different rules, which is where the
 * game hides its complexity:
 *
 *   Ante   pushes whenever the dealer fails to qualify — on a losing hand as
 *          well as a winning one. It only wins or loses when the dealer has a
 *          pair or better.
 *   Play   ignores qualification entirely. It wins, loses or pushes purely on
 *          who has the better hand.
 *   Blind  pays a premium on a player win with a straight or better, pushes on a
 *          player win with less, and is lost outright when the player loses.
 *          Qualification never touches it.
 *
 * Getting any of those three couplings backwards produces EVs that look
 * plausible and are wrong, so `settle` is written as one small function with the
 * three rules side by side rather than spread across the solvers.
 */




/** The dealer qualifies with a pair or better, board cards included. */
function dealerQualifies(dealerScore        )          {
  return categoryOf(dealerScore) >= PAIR;
}

/**
 * Net units won or lost on the Ante, Blind and Play bets together, in units of
 * the ante. The Trips side bet is settled separately: it does not depend on the
 * dealer at all.
 *
 * @param playBet 4, 3, 2 or 1 — whichever raise the player made.
 */
function settle(
  playerScore        ,
  dealerScore        ,
  playBet        ,
  paytable               ,
)         {
  if (playerScore === dealerScore) return 0; // every bet pushes on a tie

  const qualified = dealerQualifies(dealerScore);

  if (playerScore > dealerScore) {
    const play = playBet;
    const ante = qualified ? 1 : 0;
    const blind = blindPayout(playerScore, paytable);
    return play + ante + blind;
  }

  const play = -playBet;
  const ante = qualified ? -1 : 0;
  const blind = -1;
  return play + ante + blind;
}

/** Folding forfeits the Ante and the Blind and is always exactly -2. */
const foldResult = FOLD_RESULT;

/**
 * The Trips side bet, which depends only on the player's seven cards and the
 * active paytable — the dealer is irrelevant, and so is whether the player
 * folded.
 */
function tripsResult(playerScore        , paytable               )         {
  switch (categoryOf(playerScore)) {
    case STRAIGHT_FLUSH: {
      const high = (playerScore >>> 16) & 0xf;
      return high === 12 ? paytable.royalFlush : paytable.straightFlush;
    }
    case FOUR_OF_A_KIND:
      return paytable.fourOfAKind;
    case FULL_HOUSE:
      return paytable.fullHouse;
    case FLUSH:
      return paytable.flush;
    case STRAIGHT:
      return paytable.straight;
    case THREE_OF_A_KIND:
      return paytable.threeOfAKind;
    default:
      return -1;
  }
}

/** Convenience wrapper that scores both hands from cards before settling. */
function settleHands(
  playerHole                 ,
  dealerHole                 ,
  board                 ,
  playBet        ,
  paytable               ,
)         {
  return settle(
    evaluate7([...playerHole, ...board]),
    evaluate7([...dealerHole, ...board]),
    playBet,
    paytable,
  );
}

/* ===== packages/ev-engine/src/uth/river.ts ===== */
/**
 * The river decision: bet 1x or fold (spec §6.3).
 *
 * This one is trivially exact. Seven cards are visible — the player's two and
 * the five community cards — leaving 45 unseen, so the dealer holds one of
 * C(45,2) = 990 possible two-card combinations. Enumerate all of them, settle
 * each showdown, and compare the average against the -2 that folding costs.
 *
 * Every holding is equally likely, so the EV is a plain mean. There is no
 * sampling, no approximation and no table: it is the exact answer, and it takes
 * well under a millisecond.
 */




/**
 * Solve the river decision exactly.
 *
 * @param playerHole the player's two hole cards
 * @param board      all five community cards
 */
function solveRiver(
  playerHole                 ,
  board                 ,
  paytable               ,
)                {
  if (playerHole.length !== 2) throw new Error('The player holds exactly two cards');
  if (board.length !== 5) throw new Error('The river is dealt when all five community cards are out');

  const unseen = unseenCards([...playerHole, ...board]);
  if (unseen.length !== 45) throw new Error(`Expected 45 unseen cards, found ${unseen.length}`);

  // The player's hand is fixed now, so it is scored once rather than 990 times.
  const playerScore = evaluate7([...playerHole, ...board]);

  // Reused buffer: the dealer's seven cards are the board plus two unseen cards,
  // and only the last two change.
  const dealerCards         = [
    board[0] ,
    board[1] ,
    board[2] ,
    board[3] ,
    board[4] ,
    0,
    0,
  ];

  let total = 0;
  let count = 0;
  let wins = 0;
  let ties = 0;
  let losses = 0;

  for (let i = 0; i < unseen.length; i++) {
    dealerCards[5] = unseen[i] ;
    for (let j = i + 1; j < unseen.length; j++) {
      dealerCards[6] = unseen[j] ;
      const dealerScore = evaluate7(dealerCards);
      if (playerScore > dealerScore) wins++;
      else if (playerScore === dealerScore) ties++;
      else losses++;
      total += settle(playerScore, dealerScore, RIVER_RAISE, paytable);
      count++;
    }
  }

  const evPlay = total / count;
  const optimalAction = evPlay >= FOLD_RESULT ? 'play' : 'fold';

  return {
    evPlay,
    evFold: FOLD_RESULT,
    optimalAction,
    margin: Math.abs(evPlay - FOLD_RESULT),
    wins,
    ties,
    losses,
  };
}

/* ===== packages/ev-engine/src/uth/river-odds.ts ===== */
/**
 * The river, counted the way a player can read it (spec §5.2, §6.3).
 *
 * `solveRiver` grades the decision and returns how many of the dealer's 990
 * possible holdings the player beats, ties and loses to. That is enough to
 * grade and not enough to explain: "you lose to 165 of 990" does not tell a
 * player what to be afraid of. This walks the same 990 holdings and, for the
 * ones that win, groups them by what they are — a pair of nines, two pair aces
 * and sevens, a flush to the king — so the card can name the few that beat the
 * player most narrowly.
 *
 * It does not grade anything and does not replace the solver. It is the same
 * enumeration, asked a second question, and a test holds its counts to
 * `solveRiver`'s.
 */



/** How many of a category's significant ranks a plain description names. */
const NAMED_RANKS                                         = {
  0: 1, // high card: the top card
  1: 1, // pair: the pair
  2: 2, // two pair: both pairs
  3: 1, // three of a kind
  4: 1, // straight: its high card
  5: 1, // flush: its top card
  6: 2, // full house: the three, then the two
  7: 1, // four of a kind
  8: 1, // straight flush: its high card
};

/** Dealer holdings that beat the player and share one plain description. */
                              
                         
                                                                 
                
                                                                             
                 
                                                        
                
 

                            
                      
               
               
                 
                   
                                                                                 
                         
 

function riverOdds(
  playerHole                 ,
  board                 ,
  limit = 3,
)            {
  if (playerHole.length !== 2) throw new Error('The player holds exactly two cards');
  if (board.length !== 5) throw new Error('The river is dealt when all five community cards are out');

  const unseen = unseenCards([...playerHole, ...board]);
  const playerValue = evaluate7([...playerHole, ...board]);
  const dealerCards         = [board[0] , board[1] , board[2] , board[3] , board[4] , 0, 0];

  let wins = 0;
  let ties = 0;
  let losses = 0;
  const groups = new Map                     ();

  for (let i = 0; i < unseen.length; i++) {
    dealerCards[5] = unseen[i] ;
    for (let j = i + 1; j < unseen.length; j++) {
      dealerCards[6] = unseen[j] ;
      const dealer = evaluate7(dealerCards);
      if (playerValue > dealer) {
        wins++;
      } else if (playerValue === dealer) {
        ties++;
      } else {
        losses++;
        const category = categoryOf(dealer);
        const ranks = significantRanks(dealer).slice(0, NAMED_RANKS[category]);
        const key = `${category}:${ranks.join(',')}`;
        const group = groups.get(key);
        if (group) {
          group.count++;
          if (dealer < group.lowest) group.lowest = dealer;
        } else {
          groups.set(key, { category, ranks, lowest: dealer, count: 1 });
        }
      }
    }
  }

  const closest = [...groups.values()].sort((a, b) => a.lowest - b.lowest).slice(0, limit);
  return { playerValue, wins, ties, losses, holdings: wins + ties + losses, closest };
}

/* ===== packages/ev-engine/src/uth/flop.ts ===== */
/**
 * The flop decision: bet 2x, or check and keep the river option (spec §6.3).
 *
 * Two things about this decision are worth stating before the code.
 *
 * The size of it. The spec puts the enumeration at C(45,2) x C(43,2) = 893,970,
 * but 45 and 43 are the river's numbers, where seven cards are already visible.
 * At the flop the player has seen only five — two hole cards and three community
 * cards — so 47 are unseen. The turn and river are two of those 47, and the
 * dealer holds two of the 45 that remain:
 *
 *     C(47,2) x C(45,2) = 1081 x 990 = 1,070,190
 *
 * about twenty per cent more than the spec's figure. It is still exact, still
 * enumerated in full, and still inside the 200 ms target.
 *
 * The shape of it. Checking the flop is not the end of the hand: the player
 * still gets the river decision, and will fold there if the board has gone badly
 * and bet 1x if it has not. So the value of checking is not the value of showing
 * down passively — it is the average, over every turn and river, of playing the
 * river *correctly*. Treating a check as terminal would undervalue it and push
 * the trainer toward recommending 2x too often.
 *
 * The player's hand only changes with the turn and river, so it is scored 1,081
 * times rather than 1,070,190; the dealer's is the inner loop.
 */




/**
 * Solve the flop decision exactly.
 *
 * @param playerHole the player's two hole cards
 * @param flop       the three community cards on the table
 */
function solveFlop(
  playerHole                 ,
  flop                 ,
  paytable               ,
)               {
  if (playerHole.length !== 2) throw new Error('The player holds exactly two cards');
  if (flop.length !== 3) throw new Error('The flop is three community cards');

  const unseen = unseenCards([...playerHole, ...flop]);
  if (unseen.length !== 47) throw new Error(`Expected 47 unseen cards, found ${unseen.length}`);

  // Reused buffers. The player's seven cards are hole + flop + turn + river; the
  // dealer's are flop + turn + river + two unseen.
  const playerCards         = [
    playerHole[0] , playerHole[1] , flop[0] , flop[1] , flop[2] , 0, 0,
  ];
  const dealerCards         = [flop[0] , flop[1] , flop[2] , 0, 0, 0, 0];
  const remaining         = new Array      (45);

  let playTotal = 0;
  let checkTotal = 0;
  let riverFolds = 0;
  let boards = 0;
  let outcomes = 0;

  for (let i = 0; i < unseen.length; i++) {
    const turn = unseen[i] ;
    for (let j = i + 1; j < unseen.length; j++) {
      const river = unseen[j] ;

      playerCards[5] = turn;
      playerCards[6] = river;
      const playerScore = evaluate7(playerCards);
      const blind = blindPayout(playerScore, paytable);

      dealerCards[3] = turn;
      dealerCards[4] = river;

      // The 45 cards the dealer could hold, once the turn and river are spoken for.
      let n = 0;
      for (let k = 0; k < unseen.length; k++) {
        if (k === i || k === j) continue;
        remaining[n++] = unseen[k] ;
      }

      // Settlement splits cleanly into a part that does not depend on the raise
      // size and a part that is exactly the raise: the ante and blind are the
      // same whether the player bet 1x or 2x, and the play bet is the multiple.
      // So one pass yields both, and the river's value comes free.
      let anteAndBlind = 0;
      let net = 0; // wins minus losses, i.e. the play bet per unit raised
      for (let a = 0; a < n; a++) {
        dealerCards[5] = remaining[a] ;
        for (let b = a + 1; b < n; b++) {
          dealerCards[6] = remaining[b] ;
          const dealerScore = evaluate7(dealerCards);
          if (playerScore > dealerScore) {
            anteAndBlind += (dealerQualifies(dealerScore) ? 1 : 0) + blind;
            net += 1;
          } else if (playerScore < dealerScore) {
            anteAndBlind += (dealerQualifies(dealerScore) ? -1 : 0) - 1;
            net -= 1;
          }
          outcomes++;
        }
      }

      const holdings = (n * (n - 1)) / 2;
      const evRiverPlay = (anteAndBlind + net * RIVER_RAISE) / holdings;
      const evFlopPlay = (anteAndBlind + net * FLOP_RAISE) / holdings;

      playTotal += evFlopPlay;
      // At the river the player takes the better of betting and folding.
      if (evRiverPlay >= FOLD_RESULT) {
        checkTotal += evRiverPlay;
      } else {
        checkTotal += FOLD_RESULT;
        riverFolds++;
      }
      boards++;
    }
  }

  const evPlay = playTotal / boards;
  const evCheck = checkTotal / boards;

  return {
    evPlay,
    evCheck,
    optimalAction: evPlay >= evCheck ? 'play' : 'check',
    margin: Math.abs(evPlay - evCheck),
    riverFoldFrequency: riverFolds / boards,
    boards,
    outcomes,
  };
}

/* ===== packages/ev-engine/src/uth/trips.ts ===== */
/**
 * The Trips side bet (spec §5.2.4, §6.3).
 *
 * Trips depends only on the player's own seven cards. The dealer is irrelevant,
 * the board is shared, and the bet is placed before anything is dealt — so its
 * EV is a single number per paytable, obtained by weighting each payout by how
 * often a random seven-card hand reaches it.
 *
 * That distribution is the same exhaustive C(52,7) enumeration §14.1 already
 * demands of the evaluator, so this module needs no table of its own beyond ten
 * integers. Spec §6.5 budgeted under 5 KB per paytable for precomputed Trips
 * tables; the real cost is one shared frequency vector.
 *
 * Spec §6.3 is pointed about what to do with the answer: "For most common
 * paytables this bet is negative-EV, and the app should say so rather than
 * presenting 'make the Trips bet' as a live strategic choice with a defensible
 * upside." `describeTrips` exists so the product can do exactly that.
 */

/** Every seven-card hand there is. */
const TOTAL_SEVEN_CARD_HANDS = 133_784_560;

/**
 * How many of those 133,784,560 hands land on each payable category.
 *
 * Produced by the exhaustive enumeration in `test/poker-evaluator.test.ts`,
 * which regenerates and re-checks these counts, so they cannot drift away from
 * the evaluator unnoticed. The royal flush is split out of the straight-flush
 * category because it pays differently; the two sum to the published 41,584.
 */
const SEVEN_CARD_FREQUENCIES = {
  royalFlush: 4_324,
  straightFlush: 37_260,
  fourOfAKind: 224_848,
  fullHouse: 3_473_184,
  flush: 4_047_644,
  straight: 6_180_020,
  threeOfAKind: 6_461_620,
  /** Everything below trips, which loses the bet. */
  losing: 23_294_460 + 58_627_800 + 31_433_400,
}         ;

                                
                          
                                                                          
             
                                                                            
                           
                                          
                         
 

/**
 * Exact EV of one unit on Trips. A win pays the multiple and returns the stake;
 * a loss forfeits it, which is the -1 below.
 */
function tripsEv(paytable               )         {
  const f = SEVEN_CARD_FREQUENCIES;
  const paid =
    f.royalFlush * paytable.royalFlush +
    f.straightFlush * paytable.straightFlush +
    f.fourOfAKind * paytable.fourOfAKind +
    f.fullHouse * paytable.fullHouse +
    f.flush * paytable.flush +
    f.straight * paytable.straight +
    f.threeOfAKind * paytable.threeOfAKind;
  return (paid - f.losing) / TOTAL_SEVEN_CARD_HANDS;
}

function analyseTrips(paytable               )                {
  const f = SEVEN_CARD_FREQUENCIES;
  const winning = TOTAL_SEVEN_CARD_HANDS - f.losing;
  const ev = tripsEv(paytable);
  return {
    paytable,
    ev,
    houseEdgePercent: -ev * 100,
    winProbability: winning / TOTAL_SEVEN_CARD_HANDS,
  };
}

/**
 * Plain-language verdict for the feedback layer, phrased the way §16 requires:
 * honest about the number, and not dressed up as a live strategic choice when it
 * is not one.
 */
function describeTrips(paytable               )         {
  const { ev, houseEdgePercent } = analyseTrips(paytable);
  if (ev < 0) {
    return (
      `On ${paytable.name}, Trips costs ${houseEdgePercent.toFixed(2)}% of the bet. ` +
      'It pays often enough to feel live, but it loses money every time you make it.'
    );
  }
  return (
    `On ${paytable.name}, Trips returns ${(ev * 100).toFixed(2)}% of the bet. ` +
    'This paytable is unusually generous; check it against the table felt before trusting it.'
  );
}

function holeClassLabel(a      , b      )         {
  const high = Math.max(rankOf(a), rankOf(b));
  const low = Math.min(rankOf(a), rankOf(b));
  const label = `${RANK_CHARS[high]}${RANK_CHARS[low]}`;
  if (high === low) return label;
  return label + (suitOf(a) === suitOf(b) ? 's' : 'o');
}

/**
 * The solved row for a class label.
 *
 * Throws rather than returning null: every two-card hand belongs to one of the
 * 169 classes by construction, so a miss means the label was built wrongly, and
 * grading a decision against a silently absent row is the one outcome worse
 * than crashing.
 */
function preflopRow(label        )             {
  const row = PREFLOP_TABLE[label];
  if (!row) throw new Error(`No solved pre-flop row for ${label}`);
  return row;
}

/**
 * The Ultimate Texas Hold'em state machine (spec §5.2.1).
 *
 * The same shape as `BlackjackTable`, and here for the same reasons: the EV
 * engine is pure and cannot shuffle, legality is a property of where the hand
 * has got to rather than of the cards, and a decision should be graded beside
 * the state that produced it rather than beside the screen that drew it.
 *
 * What it does not do is decide anything. Every number it grades against comes
 * from the solvers — the 169-class table before the flop, `solveFlop` and
 * `solveRiver` after it — and every unit it pays out comes from `settle()`.
 * There is no EV arithmetic and no settlement rule in this file.
 *
 * The shape of the game
 * ---------------------
 * The Play bet is made exactly once, and the later it is made the smaller it is
 * allowed to be: 4x before the flop, 2x after it, 1x after the river. Checking
 * costs nothing in chips and everything in leverage, which is the whole
 * strategic shape of the game and the reason a trainer for it is worth having.
 *
 * The cards
 * ---------
 * All nine cards are dealt at the start and revealed street by street — the
 * same choice `BlackjackTable` makes with the hole card. An unknown card now
 * and an unknown card after the player acts are the same random card from the
 * same deck, so this keeps one dealing path and puts the whole hand in
 * `dealtCards` for replay.
 */

/**
 * Milliseconds, from whichever high-resolution clock the runtime has.
 *
 * Read off `globalThis` rather than named directly: this package compiles
 * against the bare ES library, with neither the DOM's types nor Node's, because
 * it must not come to depend on either.
 */
const clock = (globalThis                                       ).performance;
const now = ()         => (clock ? clock.now() : Date.now());
                                                   

/** Everything a player can do, across all three decision points. */
                                                                                         

                      
                             
          
                                                                           
             
                                                      
          
                                        
           
                         
              

                                                            

const UTH_SCENARIO_KEYS = {
  preflop: 'uth:preflop',
  flop: 'uth:flop',
  river: 'uth:river',
}         ;

/** How many community cards are face up in each phase. */
const REVEALED                           = {
  idle: 0,
  preflop: 0,
  flop: 3,
  river: 5,
  settled: 5,
};

const LEGAL                                         = {
  preflop: ['raise4x', 'raise3x', 'check'],
  flop: ['raise2x', 'check'],
  river: ['raise1x', 'fold'],
};

/** The Play bet each raise makes, in units of the ante. */
const RAISE_SIZE                                     = {
  raise4x: PREFLOP_RAISE,
  raise3x: PREFLOP_RAISE_SMALL,
  raise2x: FLOP_RAISE,
  raise1x: RIVER_RAISE,
};

/**
 * What each of the three bets did, kept apart rather than summed.
 *
 * The Ante, the Play and the Blind resolve by three different rules — the Ante
 * on whether the dealer qualified, the Play on who won, the Blind on the
 * player's own hand — and a single net figure hides all three. A player who
 * wins with a straight against a dealer who did not qualify sees `+2.0` and
 * learns nothing; three lines tell them why.
 */
                                
                           
                                                                               
               
                                                   
                  
               
                                                                                     
                
                                                                          
                       
                                                              
              
                  
 

                                  
                                                                                        
                           
                
 

                          
                  
               
                                         
                     
                          
                                                     
                
                                                                        
               
                
                  
                            
                                   
                          
 

/**
 * Everything the solvers said about one decision point.
 *
 * The EVs grade the decision; the rest is what the card's one sentence is made
 * of. Kept together so a sentence can never quote a figure from a different
 * solve than the grade it sits under.
 */
                                
                                      
                                                 
                           
                                                          
                     
                                                                          
                              
                                                                          
                              
                                                                     
                
                
                  
                                                                           
                  
 

                                
             
                          
                                                                         
                     
               
                     
                
                    
                            
                   
                                 
 

class UthTable {
           paytable               ;

                   rng;
          deck         = [];
          phase           = 'idle';
          handId = 0;

          hole         = [];
          dealerHole         = [];
          board         = [];
          dealtCards         = [];

          playBet = 0;
          folded = false;
  /**
   * How much of the board a folded hand shows.
   *
   * A fold ends the hand with the cards where they were. Turning the rest over
   * afterwards would show the player the hand they just gave up — exactly the
   * information §3.1 keeps away from a decision, arriving a second too late to
   * be anything but a reproach.
   */
          foldedAt                = null;
          settlement                       = null;
          decisions                      = [];
  /** Cards to deal first on the next hand, for tests and drills. */
          stacked                = null;
  /**
   * The current decision point's evaluation, once computed.
   *
   * The flop solve is ~80 ms in a browser tab. Computed at the moment of the
   * click, that is a freeze between the player's decision and the card that
   * grades it — the worst moment to have one. Cached, it can be computed while
   * the flop is still being turned over (see `evaluate()`), and the click then
   * costs nothing.
   */
          evaluation                       = null;

  constructor(options                  = {}) {
    this.paytable = options.paytable ?? DEFAULT_BLIND_PAYTABLE;
    this.rng = makeRng(options.seed ?? Date.now() % 2147483647);
  }

  // --- Reading the table ---------------------------------------------------

  get view()          {
    return {
      phase: this.phase,
      hole: [...this.hole],
      // The dealer's cards stay down until there is nothing left to decide.
      dealerHole: this.phase === 'settled' && !this.folded ? [...this.dealerHole] : [],
      dealerRevealed: this.phase === 'settled' && !this.folded,
      board: this.board.slice(0, this.foldedAt ?? REVEALED[this.phase]),
      ante: this.phase === 'idle' ? 0 : 1,
      blind: this.phase === 'idle' ? 0 : 1,
      playBet: this.playBet,
      legalActions: LEGAL[this.phase] ?? [],
      settlement: this.settlement,
      netUnits: this.settlement?.net ?? null,
    };
  }

  get handRecord()                {
    if (this.phase !== 'settled' || !this.settlement) {
      throw new Error('The hand is not finished');
    }
    return {
      id: this.handId,
      paytable: this.paytable,
      dealtCards: [...this.dealtCards],
      hole: [...this.hole],
      dealerHole: [...this.dealerHole],
      board: [...this.board],
      holeClass: holeClassLabel(this.hole[0] , this.hole[1] ),
      settlement: this.settlement,
      netUnits: this.settlement.net,
      decisions: [...this.decisions],
    };
  }

  /** The class the pre-flop decision is graded against. */
  get holeClass()         {
    if (this.hole.length !== 2) throw new Error('No hand in progress');
    return holeClassLabel(this.hole[0] , this.hole[1] );
  }

  // --- Playing a hand ------------------------------------------------------

  /**
   * Shuffle and deal. Ante and Blind are posted here: they are mandatory, so
   * there is no decision to make about them and no point pretending otherwise.
   */
  startHand()       {
    if (this.phase !== 'idle' && this.phase !== 'settled') {
      throw new Error('A hand is already in progress');
    }
    this.handId++;
    this.deck = fullDeck();
    shuffleInPlace(this.deck, this.rng);
    if (this.stacked) {
      // The named cards move to the front in the order given; everything else
      // keeps its shuffled order, so the rest of the deal stays honest.
      const wanted = this.stacked;
      this.deck = [...wanted, ...this.deck.filter((card) => !wanted.includes(card))];
      this.stacked = null;
    }

    this.hole = [this.deck[0] , this.deck[1] ];
    this.dealerHole = [this.deck[2] , this.deck[3] ];
    this.board = this.deck.slice(4, 9);
    this.dealtCards = this.deck.slice(0, 9);

    this.playBet = 0;
    this.folded = false;
    this.foldedAt = null;
    this.settlement = null;
    this.decisions = [];
    this.evaluation = null;
    this.phase = 'preflop';
  }

  /**
   * Force the next hand's cards, in dealing order: player, player, dealer,
   * dealer, then the five community cards. Fewer than nine is fine; the rest
   * come from the shuffle.
   *
   * The Blackjack shoe has the same facility for the same reason (spec §8):
   * waiting for a dealer who fails to qualify against a player straight to turn
   * up on its own is no way to test a settlement rule, and no way to drill one.
   */
  stackNextHand(cards                 )       {
    if (cards.length > 9) throw new Error('A hand uses nine cards');
    if (new Set(cards).size !== cards.length) throw new Error('A card cannot be dealt twice');
    this.stacked = [...cards];
  }

  legalActions()              {
    return LEGAL[this.phase] ?? [];
  }

  /** Play one action, graded. Spec §5.2.4. */
  act(action           , timeToDecideMs                = null)                    {
    const legal = this.legalActions();
    if (legal.length === 0) throw new Error(`Nothing to decide while ${this.phase}`);
    if (!legal.includes(action)) {
      throw new Error(`${action} is not legal here; legal actions are ${legal.join(', ')}`);
    }

    const record = this.grade(action, legal, timeToDecideMs);
    this.decisions.push(record);

    if (action === 'fold') {
      this.folded = true;
      this.foldedAt = REVEALED[this.phase];
      this.settleFold();
      return record;
    }

    const raise = RAISE_SIZE[action];
    if (raise !== undefined) {
      this.playBet = raise;
      this.showdown();
      return record;
    }

    // A check: the next street, and nothing staked.
    this.phase = this.phase === 'preflop' ? 'flop' : 'river';
    this.evaluation = null;
    return record;
  }

  // --- Grading -------------------------------------------------------------

  /**
   * The EV of every legal action at this decision point.
   *
   * Pre-flop is a lookup because solving it live is 2.1 billion outcomes per
   * class; the flop and the river are solved here and now, exactly, for the
   * actual cards on the table. There is no chart-versus-shoe question in this
   * game: every grade is exact for what the player can see.
   *
   * Memoised per decision point, so a caller can compute it early — while the
   * flop is being revealed — and the grading click that follows is free.
   */
  evaluate()                {
    const legal = this.legalActions();
    if (legal.length === 0) throw new Error(`Nothing to decide while ${this.phase}`);
    if (this.evaluation) return this.evaluation;

    const started = now();
    let evaluation                                                  ;
    if (this.phase === 'preflop') {
      const row = preflopRow(this.holeClass);
      evaluation = {
        phase: 'preflop',
        evByAction: { raise4x: row.ev4x, raise3x: row.ev3x, check: row.evCheck },
        holeClass: row.label,
        flopRaiseFrequency: row.flopRaiseFrequency,
        riverFoldFrequency: row.riverFoldFrequency,
      };
    } else if (this.phase === 'flop') {
      const solved = solveFlop(this.hole, this.board.slice(0, 3), this.paytable);
      evaluation = {
        phase: 'flop',
        evByAction: { raise2x: solved.evPlay, check: solved.evCheck },
        riverFoldFrequency: solved.riverFoldFrequency,
      };
    } else {
      const solved = solveRiver(this.hole, this.board, this.paytable);
      evaluation = {
        phase: 'river',
        evByAction: { raise1x: solved.evPlay, fold: solved.evFold },
        wins: solved.wins,
        ties: solved.ties,
        losses: solved.losses,
      };
    }
    const solveMs = this.phase === 'preflop' ? 0 : now() - started;

    let optimalAction = legal[0] ;
    let optimalEv = -Infinity;
    for (const candidate of legal) {
      const ev = evaluation.evByAction[candidate];
      if (ev === undefined) throw new Error(`${candidate} is legal but has no EV`);
      if (ev > optimalEv) {
        optimalEv = ev;
        optimalAction = candidate;
      }
    }
    this.evaluation = { ...evaluation, optimalAction, solveMs };
    return this.evaluation;
  }

          grade(
    action           ,
    legal             ,
    timeToDecideMs               ,
  )                    {
    const { evByAction, optimalAction } = this.evaluate();
    const best = evByAction[optimalAction] ;
    const chosen = evByAction[action] ;
    // Never negative: the best action is the best by construction, and floating
    // point is not entitled to say otherwise.
    const evCost = Math.max(0, best - chosen);

    return {
      sequenceIndex: this.decisions.length,
      handIndex: 0,
      scenarioKey: UTH_SCENARIO_KEYS[this.phase                                ],
      legalActions: [...legal],
      evByAction,
      optimalAction,
      chosenAction: action,
      evCost,
      severityTier: severityForCost(evCost),
      timeToDecideMs,
    };
  }

  // --- Resolving -----------------------------------------------------------

          settleFold()       {
    this.settlement = {
      dealerQualified: false,
      ante: -1,
      playBet: 0,
      play: 0,
      blind: -1,
      blindPushed: false,
      net: FOLD_RESULT,
      folded: true,
    };
    this.phase = 'settled';
  }

  /**
   * Pay the hand out, and check the three lines against `settle()`.
   *
   * The breakdown exists because one net figure teaches nothing: the Ante, the
   * Play and the Blind resolve by three unrelated rules and a player needs to
   * see which one did what. But re-deriving the three here is exactly how a
   * second, quietly different settlement rule gets written, so `settle()` stays
   * the authority and the parts are required to add up to it. A mismatch is a
   * bug in this file and throws rather than paying out.
   */
          showdown()       {
    const playerScore = evaluate7([...this.hole, ...this.board]);
    const dealerScore = evaluate7([...this.dealerHole, ...this.board]);
    const qualified = dealerQualifies(dealerScore);
    const tie = playerScore === dealerScore;
    const won = playerScore > dealerScore;

    const blindMultiple = blindPayout(playerScore, this.paytable);
    const settlement                = {
      dealerQualified: qualified,
      ante: tie ? 0 : !qualified ? 0 : won ? 1 : -1,
      playBet: this.playBet,
      play: tie ? 0 : won ? this.playBet : -this.playBet,
      blind: tie ? 0 : won ? blindMultiple : -1,
      blindPushed: !tie && won && blindMultiple === 0,
      net: 0,
      folded: false,
    };
    settlement.net = settlement.ante + settlement.play + settlement.blind;

    const authority = settle(playerScore, dealerScore, this.playBet, this.paytable);
    if (Math.abs(settlement.net - authority) > 1e-9) {
      throw new Error(
        `Settlement breakdown does not match settle(): ${settlement.net} vs ${authority}`,
      );
    }

    this.settlement = settlement;
    this.phase = 'settled';
  }
}

 *

 * enforces the rules, plays the dealer out and settles the money, handing every
 * decision to the EV engine to be graded.

 * nothing about screens, storage or drill selection. Its only impurity is the

/**
 * Languages.
 *
 * The hard part is not the chrome — it is that the dealer's reasoning is
 * *generated*, not written. `explain.ts` assembles each sentence from the
 * engine's numbers, so translating it means translating the templates, not a
 * list of finished strings.
 *
 * So messages are keys with parameters, and each locale owns its own phrasing.
 * A locale is free to put the numbers in a different order, or to need a word
 * the other does not, because it holds the whole sentence rather than a
 * fragment of one.
 *
 * Hebrew is right-to-left, which is a layout question as much as a language
 * one — see `dir` below and the logical properties in styles.css.
 */

                                 

                             
               
                                                                                
               
                     
 

const LOCALES                        = [
  { code: 'en', name: 'English', dir: 'ltr' },
  { code: 'he', name: 'עברית', dir: 'rtl' },
];

function localeInfo(code        )             {
  return LOCALES.find((l) => l.code === code) ?? LOCALES[0] ;
}

                                                     

/**
 * Render a message.
 *
 * `{name}` is substituted; `**word**` survives for the client to render as
 * emphasis. A missing key returns the key itself rather than throwing — a
 * half-translated screen is bad, a blank one is worse.
 */
function t(locale        , key        , params         = {})         {
  const table = MESSAGES[locale] ?? MESSAGES.en;
  const template = table[key] ?? MESSAGES.en[key] ?? key;
  return template.replace(/\{(\w+)\}/g, (_, name        ) =>
    params[name] === undefined ? `{${name}}` : String(params[name]),
  );
}
