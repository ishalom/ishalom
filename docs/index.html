/** Blackjack's `SessionStats`, field for field, so the strip and its tooltips read the same. */
                           
                
                    
                  
                   
                             
                                      
                 
                              
                       
                                           
                                                                                  
                                    
                   
 

const zeroSeverity = ()                               => ({
  optimal: 0,
  negligible: 0,
  minor: 0,
  significant: 0,
  blunder: 0,
});

/** The best play in a pre-flop row, and what it is worth. */
function bestOf(row            )                                    {
  if (row.optimalAction === 'raise4x') return { action: 'raise4x', ev: row.ev4x };
  if (row.optimalAction === 'raise3x') return { action: 'raise3x', ev: row.ev3x };
  return { action: 'check', ev: row.evCheck };
}

class UthSession {
  /** The stack a new player opens with, in units of the Ante. */
  static          STARTING_STACK = 200;

                   table          ;
          locale         = 'en';

          balance = UthSession.STARTING_STACK;
          hands = 0;
          decisions = 0;
          correct = 0;
          evLost = 0;
          netUnits = 0;
          closeCalls = 0;
          closeCallsCorrect = 0;
          bySeverity = zeroSeverity();
          lifetimeDecisions = 0;
          history                  = [];

  /** Decisions of the hand on the felt, saved when it settles. */
          pending                     = [];
          lastNet                = null;

  /** The last graded decision, kept so a language change can re-word the card. */
          last                                                                                 = null;

  constructor(seed         ) {
    this.table = new UthTable(seed === undefined ? {} : { seed });
  }

  setLocale(locale        )       {
    this.locale = locale;
  }

  /** Post Ante and Blind and deal. */
  deal()          {
    const phase = this.table.view.phase;
    if (phase !== 'idle' && phase !== 'settled') {
      throw new Error('Finish the hand before dealing another');
    }
    this.table.startHand();
    this.balance -= 2; // Ante 1 + Blind 1, onto the felt
    this.lastNet = null;
    this.last = null;
    this.pending = [];
    return this.view;
  }

  /**
   * Compute the current decision point's evaluation now, so the grading click
   * that follows is instant.
   *
   * The page calls this straight after the flop is drawn. The solve runs while
   * the cards are still animating in — CSS transforms run on the compositor, so
   * the turn-over does not stall — and by the time the player can press a
   * button the answer is already cached on the table.
   */
  prepare()                                     {
    const legal = this.table.legalActions();
    if (legal.length === 0) return { solveMs: 0, phase: this.table.view.phase };
    const evaluation = this.table.evaluate();
    return { solveMs: evaluation.solveMs, phase: evaluation.phase };
  }

  act(action           )          {
    const holeClass = this.table.holeClass;
    // Read before acting: `act()` moves the phase on and clears the cache.
    const evaluation            = { ...this.table.evaluate() };
    if (evaluation.phase === 'river') {
      /*
       * The same 990 holdings the river was graded on, asked which ones beat the
       * player most narrowly. Counted again rather than read off the grade, and
       * held to the solver's counts by a test in the engine.
       */
      const view = this.table.view;
      const odds = riverOdds(view.hole, view.board, 3);
      evaluation.threats = odds.closest.map((g) => ({ category: g.category, ranks: g.ranks, count: g.count }));
      evaluation.covered = odds.closest.reduce((sum, g) => sum + g.count, 0) === odds.losses;
      evaluation.playerValue = odds.playerValue;
    }
    const record = this.table.act(action);
    this.last = { record, evaluation, holeClass };
    this.count(record, evaluation);

    const raise = { raise4x: 4, raise3x: 3, raise2x: 2, raise1x: 1 }[action          ];
    if (raise !== undefined) this.balance -= raise;

    const view = this.table.view;
    if (view.phase === 'settled' && view.settlement) {
      const settlement = view.settlement;
      // Everything staked comes back, plus or minus what it won.
      this.balance += 2 + settlement.playBet + settlement.net;
      this.lastNet = settlement.net;
      this.netUnits += settlement.net;
      this.hands++;
      const hand = this.table.handRecord;
      this.history.unshift({
        id: hand.id,
        hole: [...hand.hole],
        dealerHole: [...hand.dealerHole],
        board: [...hand.board],
        holeClass: hand.holeClass,
        settlement: { ...settlement },
        decisions: this.pending,
      });
      this.history.length = Math.min(this.history.length, UTH_HISTORY_KEPT);
      this.pending = [];
    }
    return this.view;
  }

  /** The same counters, and the same close-call rule, as Blackjack's `absorb`. */
          count(record                   , evaluation           )       {
    const evs = record.legalActions
      .map((a) => record.evByAction[a] ?? 0)
      .sort((a, b) => b - a);
    const closeCall = evs.length > 1 && evs[0]  - evs[1]  < UTH_CLOSE_CALL;
    const correct = record.evCost === 0;

    this.decisions++;
    this.lifetimeDecisions++;
    if (correct) this.correct++;
    this.evLost += record.evCost;
    this.bySeverity[record.severityTier]++;
    if (closeCall) {
      this.closeCalls++;
      if (correct) this.closeCallsCorrect++;
    }

    this.pending.push({
      phase: evaluation.phase,
      legalActions: [...record.legalActions],
      evByAction: { ...record.evByAction },
      optimalAction: record.optimalAction,
      chosenAction: record.chosenAction,
      evCost: record.evCost,
      severityTier: record.severityTier,
      facts: {
        flopRaiseFrequency: evaluation.flopRaiseFrequency,
        riverFoldFrequency: evaluation.riverFoldFrequency,
        wins: evaluation.wins,
        ties: evaluation.ties,
        losses: evaluation.losses,
        threats: evaluation.threats,
        covered: evaluation.covered,
        playerValue: evaluation.playerValue,
      },
    });
  }

  // --- Saving and restoring ------------------------------------------------

  get stats()           {
    // Close calls leave the denominator with their outcomes, as in Blackjack.
    const graded = this.decisions - this.closeCalls;
    const gradedCorrect = this.correct - this.closeCallsCorrect;
    const evLostPer100 = this.hands === 0 ? 0 : (this.evLost / this.hands) * 100;
    return {
      hands: this.hands,
      decisions: this.decisions,
      correct: this.correct,
      accuracy: graded === 0 ? 1 : gradedCorrect / graded,
      closeCallsExcluded: this.closeCalls,
      accuracyIncludingCloseCalls: this.decisions === 0 ? 1 : this.correct / this.decisions,
      evLost: this.evLost,
      evLostPer100,
      bySeverity: { ...this.bySeverity },
      effectiveHouseEdgePercent: uthPerfectPlayEdgePercent() + evLostPer100,
      netUnits: this.netUnits,
    };
  }

  /**
   * The `uth` part of the saved record.
   *
   * Always between hands. A hand still on the felt has not happened yet as far
   * as the record is concerned — its Ante, Blind and any Play bet go back on the
   * balance, and its decisions are not counted — which is how Blackjack treats a
   * hand in progress too. Closing the tab mid-hand therefore costs nothing.
   */
  get progress()                {
    const view = this.table.view;
    const inHand = view.phase !== 'idle' && view.phase !== 'settled';
    const pendingCost = this.pending.reduce((sum, d) => sum + d.evCost, 0);
    const pendingCorrect = this.pending.filter((d) => d.evCost === 0).length;
    const pendingBy = zeroSeverity();
    for (const d of this.pending) pendingBy[d.severityTier]++;

    const unwound = (value        , pending        ) => (inHand ? value - pending : value);
    const bySeverity = zeroSeverity();
    for (const tier of TIERS) bySeverity[tier] = unwound(this.bySeverity[tier], pendingBy[tier]);

    // Close calls inside the unfinished hand come off as well.
    let pendingClose = 0;
    let pendingCloseCorrect = 0;
    if (inHand) {
      for (const d of this.pending) {
        const evs = d.legalActions.map((a) => d.evByAction[a] ?? 0).sort((a, b) => b - a);
        if (evs.length > 1 && evs[0]  - evs[1]  < UTH_CLOSE_CALL) {
          pendingClose++;
          if (d.evCost === 0) pendingCloseCorrect++;
        }
      }
    }

    return {
      version: 1,
      balance: inHand ? this.balance + view.ante + view.blind + view.playBet : this.balance,
      hands: this.hands,
      decisions: unwound(this.decisions, this.pending.length),
      correct: unwound(this.correct, pendingCorrect),
      evLost: unwound(this.evLost, pendingCost),
      netUnits: this.netUnits,
      closeCalls: this.closeCalls - pendingClose,
      closeCallsCorrect: this.closeCallsCorrect - pendingCloseCorrect,
      bySeverity,
      lifetimeDecisions: unwound(this.lifetimeDecisions, this.pending.length),
      history: this.history.map((hand) => ({
        ...hand,
        hole: [...hand.hole],
        dealerHole: [...hand.dealerHole],
        board: [...hand.board],
        settlement: { ...hand.settlement },
        decisions: hand.decisions.map((d) => ({ ...d, legalActions: [...d.legalActions] })),
      })),
    };
  }

  /**
   * Take a saved `uth` part back.
   *
   * Anything that is not a version 1 object — including the nothing a version 1
   * or 2 blob holds, from before Ultimate was saved — leaves the session at zero
   * with a full stack, which is where those players genuinely are. Every number
   * is checked on the way in: a record passed around a family can be half-written.
   */
  restore(saved         )       {
    const phase = this.table.view.phase;
    if (phase !== 'idle' && phase !== 'settled') {
      throw new Error('Restore between hands, not during one');
    }
    this.reset();
    const s = saved                                             ;
    if (!s || typeof s !== 'object' || s.version !== 1) return;

    const n = (value         , fallback = 0)         =>
      typeof value === 'number' && Number.isFinite(value) ? value : fallback;

    this.balance = n(s.balance, UthSession.STARTING_STACK);
    this.hands = n(s.hands);
    this.decisions = n(s.decisions);
    this.correct = n(s.correct);
    this.evLost = n(s.evLost);
    this.netUnits = n(s.netUnits);
    this.closeCalls = n(s.closeCalls);
    this.closeCallsCorrect = n(s.closeCallsCorrect);
    for (const tier of TIERS) this.bySeverity[tier] = n(s.bySeverity?.[tier]);
    this.lifetimeDecisions = n(s.lifetimeDecisions, this.decisions);
    this.history = (Array.isArray(s.history) ? s.history : [])
      .filter(
        (hand)                        =>
          !!hand &&
          Array.isArray(hand.hole) &&
          Array.isArray(hand.board) &&
          Array.isArray(hand.decisions) &&
          hand.decisions.every((d) => UTH_ACTIONS.includes(d.chosenAction) && TIERS.includes(d.severityTier)) &&
          !!hand.settlement,
      )
      .slice(0, UTH_HISTORY_KEPT);
  }

          reset()       {
    this.balance = UthSession.STARTING_STACK;
    this.hands = 0;
    this.decisions = 0;
    this.correct = 0;
    this.evLost = 0;
    this.netUnits = 0;
    this.closeCalls = 0;
    this.closeCallsCorrect = 0;
    this.bySeverity = zeroSeverity();
    this.lifetimeDecisions = 0;
    this.history = [];
    this.pending = [];
    this.last = null;
    this.lastNet = null;
  }

  // --- What the page draws -------------------------------------------------

  get view()          {
    const table = this.table.view;
    const settled = table.phase === 'settled';
    const inHand = table.phase !== 'idle';
    const iso = isolateFor(this.locale);
    return {
      game: 'uth',
      phase: table.phase,
      hole: table.hole.map(pokerCardView),
      dealerHole: table.dealerHole.map(pokerCardView),
      dealerRevealed: table.dealerRevealed,
      board: table.board.map(pokerCardView),
      boardHidden: inHand ? 5 - table.board.length : 0,
      // Notation for the tooltip; words for the player.
      holeClass: inHand ? this.table.holeClass : null,
      holeWords: inHand ? this.classWords(this.table.holeClass) : null,
      stake: {
        ante: table.ante,
        blind: table.blind,
        play: table.playBet,
        total: table.ante + table.blind + table.playBet,
      },
      stack: {
        start: UthSession.STARTING_STACK,
        balance: this.balance,
        lastNet: this.lastNet,
      },
      hands: this.hands,
      stats: this.stats,
      // The floor under the effective edge, as the tooltip quotes it.
      rulesEdge: iso(`${uthPerfectPlayEdgePercent().toFixed(2)}%`),
      legalActions: table.legalActions.map((action) => ({
        action,
        label: t(this.locale, ACTIONS[action].label),
        key: ACTIONS[action].key,
        code: ACTIONS[action].code,
      })),
      // The flop is the one decision point that costs a solve. The page asks for
      // it to be done early; this tells the page whether it still needs asking.
      needsPrepare: table.phase === 'flop' || table.phase === 'river',
      feedback: this.last ? this.compose(this.last) : null,
      settlement: settled && table.settlement ? this.lines(table.settlement) : null,
      showdown:
        settled && table.settlement && !table.settlement.folded
          ? this.showdown(table.hole, table.dealerHole, table.board)
          : null,
      history: this.history.map((hand) => this.logEntry(hand)),
      howTo: this.howTo(),
    };
  }

  /**
   * "How to play", including the one line about Trips.
   *
   * Trips is not offered as a bet. What it would cost is not left as a claim:
   * `analyseTrips` works it out exactly under the default paytable, 3.50%.

          howTo()           {
    const trips = analyseTrips(TRIPS_PAYTABLES[0] );

      t(this.locale, 'uth.howto.1'),
      t(this.locale, 'uth.howto.2'),
      t(this.locale, 'uth.keys'),
      t(this.locale, 'uth.howto.trips', {
        edge: isolateFor(this.locale)(`${trips.houseEdgePercent.toFixed(2)}%`),
      }),
    ];
  }

  // --- Plain words ---------------------------------------------------------

  /**
   * A starting hand in words: "A-K, different suits", "a pair of sevens".
   *
   * "62s" is poker notation, and most of the family does not read it. The
   * notation is kept in the view for a tooltip; everything a player reads first
   * uses this.
   */
          classWords(label        )         {
    const L = this.locale;
    const hi = POKER_RANKS.indexOf(label[0] );
    const lo = POKER_RANKS.indexOf(label[1] );
    if (hi === lo) return t(L, 'uth.class.pair', { p: t(L, `rankPlural.${hi}`) });
    const hilo = isolateFor(L)(`${rankSymbol(hi)}-${rankSymbol(lo)}`);
    return t(L, label.endsWith('s') ? 'uth.class.suited' : 'uth.class.offsuit', { hilo });
  }

  /** A hand described from its category and the ranks that decide it. */
          handPhrase(category              , ranks                   )         {
    const L = this.locale;
    if (category === 8 && ranks[0] === 12) return t(L, 'uthHand.royal');
    return t(L, `uthHand.${category}`, {
      r1: t(L, `rankName.${ranks[0] ?? 0}`),
      p1: t(L, `rankPlural.${ranks[0] ?? 0}`),
      p2: t(L, `rankPlural.${ranks[1] ?? 0}`),
    });
  }

  /**
   * Both final hands, named, with the five cards that make each.
   *
   * `bestFive` asks the same evaluator which five of the seven scored the hand,
   * so the cards ringed on the felt and the ranks in brackets can never disagree
   * with the hand the settlement was paid on.
   */
          showdown(hole        , dealerHole        , board        ) {
    const L = this.locale;
    const iso = isolateFor(L);
    const describe = (cards        , key        ) => {
      const best = bestFive(cards);
      const category = categoryOf(best.value);
      const counts = new Map                ();
      for (const card of best.cards) counts.set(rankOf(card), (counts.get(rankOf(card)) ?? 0) + 1);
      const ordered = [...best.cards].sort((a, b) => {
        const byCount = counts.get(rankOf(b))  - counts.get(rankOf(a)) ;
        return byCount !== 0 ? byCount : rankOf(b) - rankOf(a);
      });
      // A wheel reads 5-4-3-2-A, the way it is played.
      const ranks = ordered.map((card) => rankOf(card));
      const wheel = (category === 4 || category === 8) && ranks[0] === 12 && ranks[1] === 3;
      const shown = wheel ? [...ranks.slice(1), 12] : ranks;
      return {
        words: t(L, key, {
          hand: this.handPhrase(category, significantRanks(best.value)),
          five: iso(shown.map(rankSymbol).join('-')),
        }),
        cards: best.cards,
      };
    };
    return {
      player: describe([...hole, ...board], 'uth.show.you'),
      dealer: describe([...dealerHole, ...board], 'uth.show.dealer'),
      legend: t(L, 'uth.show.legend'),
    };
  }

  // --- The hand log ----------------------------------------------------------

  /**
   * One finished hand, worded now in the current language.
   *
   * The Blackjack log's structure from round 3: a summary that describes the
   * hand rather than one decision in it, then one block per decision under its
   * own header, then the result, quieter than any of it.
   */
          logEntry(hand               )          {
    const L = this.locale;
    // A run of cards is left-to-right notation; inside Hebrew text "7♠ 2♦"
    // otherwise draws as "♠7 ♦2", the suit being a neutral character.
    const cards = (list        ) =>
      isolateFor(L)(
        list
          .map((card) => {
            const v = pokerCardView(card);
            return `${v.rank}${v.suit}`;
          })
          .join(' '),
      );

    const decisions = hand.decisions.map((d, index) => {
      const record                    = {
        sequenceIndex: index,
        handIndex: 0,
        scenarioKey: `uth:${d.phase}`,
        legalActions: d.legalActions,
        evByAction: d.evByAction,
        optimalAction: d.optimalAction,
        chosenAction: d.chosenAction,
        evCost: d.evCost,
        severityTier: d.severityTier,
        timeToDecideMs: null,
      };
      const evaluation            = {
        phase: d.phase,
        evByAction: d.evByAction,
        optimalAction: d.optimalAction,
        ...d.facts,
        solveMs: 0,
      };
      const card = this.compose({ record, evaluation, holeClass: hand.holeClass });
      return {
        header: t(L, card.correct ? 'log.right' : 'log.played', {
          headline: `${card.headline} → ${this.label(d.optimalAction)}`,
          chosen: this.label(d.chosenAction).toLowerCase(),
        }),
        severity: d.severityTier,
        correct: card.correct,
        sentence: card.sentence,
        notes: card.notes,
      };
    });

    const off = decisions.filter((d) => !d.correct).length;
    const summary =
      decisions.length === 1
        ? decisions[0] .header
        : off === 0
          ? t(L, 'log.allRight', { n: decisions.length })
          : t(L, 'log.someOff', { n: decisions.length, bad: off });
    const worst = hand.decisions.reduce              (
      (acc, d) => (TIERS.indexOf(d.severityTier) > TIERS.indexOf(acc) ? d.severityTier : acc),
      'optimal',
    );
    const result = this.lines(hand.settlement);
    const shown = hand.settlement.folded ? null : this.showdown(hand.hole, hand.dealerHole, hand.board);

    return {
      id: hand.id,
      cards: {
        hole: cards(hand.hole),
        dealer: hand.settlement.folded ? null : cards(hand.dealerHole),
        board: cards(hand.board),
      },
      summary,
      severity: worst,
      net: hand.settlement.net,
      decisions,
      showdown: shown ? [shown.player.words, shown.dealer.words] : [],
      lines: result.lines,
      netLine: result.net,
    };
  }

  // --- The card ------------------------------------------------------------

          label(action           )         {
    return t(this.locale, ACTIONS[action].label);
  }

          compose(last   
                              
                          
                      
   )              {
    const { record, evaluation, holeClass } = last;
    const phase = evaluation.phase;
    const correct = record.evCost === 0;
    const ranked = record.legalActions
      .map((action) => ({ action, label: this.label(action), ev: record.evByAction[action] ?? 0 }))
      .sort((a, b) => b.ev - a.ev);

    return {
      phase,
      headline: t(this.locale, `uth.h.${phase}`, { class: this.classWords(holeClass) }),
      correct,
      severity: record.severityTier,
      verdict: correct
        ? t(this.locale, 'fb.correct', { action: this.label(record.optimalAction) })
        : t(this.locale, 'fb.wrong', {
            severity: t(this.locale, `fb.${record.severityTier}`),
            cost: isolateFor(this.locale)(record.evCost.toFixed(3)),
          }),
      youChose: correct
        ? null
        : t(this.locale, 'fb.youChose', {
            chosen: this.label(record.chosenAction).toLowerCase(),
            best: this.label(record.optimalAction).toLowerCase(),
          }),
      chosen: record.chosenAction,
      optimal: record.optimalAction,
      evCost: record.evCost,
      ranked,
      sentence: this.sentence(record, evaluation),
      notes: phase === 'preflop' ? this.preflopNotes(holeClass) : phase === 'river' ? this.riverNotes(evaluation) : [],
      solveMs: evaluation.solveMs,
    };
  }

  /**
   * The one sentence, and only facts the solve itself produced.
   *
   * Each describes the spot rather than the choice, so it reads true whether
   * the player got it right or not — with one exception. A 3× raise gets its
   * own sentence, because §5.2.3 is the lesson the button exists to teach and it
   * is a claim about the choice, not the spot: 3× is the best play on none of
   * the 169 starting hands.
   */
          sentence(record                   , evaluation           )         {
    const ev = record.evByAction;
    const L = this.locale;
    const iso = isolateFor(L);

    if (evaluation.phase === 'preflop') {
      if (record.chosenAction === 'raise3x') {
        return t(L, 'uth.s.threeX', {
          cost: iso(uthUnits(-record.evCost).replace('−', '')),
          best: this.label(record.optimalAction).toLowerCase(),
        });
      }
      if (record.optimalAction === 'raise4x') {
        return t(L, 'uth.s.preRaise', {
          gap: iso(uthUnits((ev.raise4x ?? 0) - (ev.check ?? 0)).replace('+', '')),
        });
      }
      return t(L, 'uth.s.preCheck', {
        flopRaise: uthPercent(evaluation.flopRaiseFrequency ?? 0),
        riverFold: uthPercent(evaluation.riverFoldFrequency ?? 0),
      });
    }

    if (evaluation.phase === 'flop') {
      const gap = Math.abs((ev.raise2x ?? 0) - (ev.check ?? 0));
      return t(L, record.optimalAction === 'raise2x' ? 'uth.s.flopRaise' : 'uth.s.flopCheck', {
        gap: iso(gap.toFixed(3)),
        riverFold: uthPercent(evaluation.riverFoldFrequency ?? 0),
      });
    }

    /*
     * The river, in percentages a player reads at a glance. The counts are the
     * solver's; the rounding keeps the three shares adding to exactly 100.
     */
    const [win, tie, lose] = wholePercents([evaluation.wins ?? 0, evaluation.ties ?? 0, evaluation.losses ?? 0]);
    return t(L, record.optimalAction === 'raise1x' ? 'uth.s.riverRaise' : 'uth.s.riverFold', {
      win: `${win}%`,
      tie: `${tie}%`,
      lose: `${lose}%`,
      fold: iso('−2'),
    });
  }

  /**
   * On the river: the dealer holdings that beat the player most narrowly.
   *
   * "Only with" is said only when those groups are every holding that beats the
   * player; otherwise the line says they are the closest, which is what they are.
   */
          riverNotes(evaluation           )           {
    const L = this.locale;
    const threats = evaluation.threats;
    if (!threats) return [];
    if (threats.length === 0) return [t(L, 'uth.note.nothingBeats')];
    const player = evaluation.playerValue ?? -1;
    const playerCategory = player >= 0 ? categoryOf(player) : -1;
    const playerNamed = player >= 0 ? significantRanks(player).slice(0, NAMED_RANKS[categoryOf(player)]) : [];
    const phrases = threats.map((threat) => {
      const phrase = this.handPhrase(threat.category, threat.ranks);
      const sameHand =
        threat.category === playerCategory &&
        threat.ranks.length === playerNamed.length &&
        threat.ranks.every((rank, i) => rank === playerNamed[i]);
      return sameHand ? t(L, 'uthHand.kicker', { hand: phrase }) : phrase;
    });
    // "a full house, three jacks and two fours" has a comma of its own, so a
    // list of such hands is separated with semicolons or it cannot be read.
    const sep = phrases.some((phrase) => phrase.includes(',')) ? ';' : ',';
    const list =
      phrases.length === 1
        ? phrases[0] 
        : `${phrases.slice(0, -1).join(`${sep} `)}${sep === ';' ? ';' : ''}${t(L, 'uth.list.or')}${phrases[phrases.length - 1]}`;
    return [t(L, evaluation.covered ? 'uth.note.onlyWith' : 'uth.note.closest', { list })];
  }

  /**
   * Before the flop: what the suit is worth, and the suited-connector surprise.
   *
   * Both come from the table and appear only when true. A suited hand is set
   * beside the same ranks in different suits — the suit flips the decision in 7
   * of the 78 suited classes and only adds value in the rest — and a suited
   * connector gets Idan's line only when the table says check (T9s yes, QJs no).
   * Pairs have no suited twin, and a hand in different suits is not told what a
   * suit would have added: that is the same fact from the other side, and on a
   * hand the player cannot change it is noise.
   */
          preflopNotes(holeClass        )           {
    const L = this.locale;
    const iso = isolateFor(L);
    if (holeClass.length === 2 || !holeClass.endsWith('s')) return [];
    const suitedRow = preflopRow(holeClass);
    const offRow = preflopRow(`${holeClass.slice(0, 2)}o`);
    const suited = bestOf(suitedRow);
    const off = bestOf(offRow);
    const notes           = [];
    if (suited.action !== off.action) {
      notes.push(
        t(L, 'uth.note.suitFlips', {
          best: this.label(suited.action).toLowerCase(),
          ev: iso(uthUnits(suited.ev)),
          offBest: this.label(off.action).toLowerCase(),
          offEv: iso(uthUnits(off.ev)),
        }),
      );
    } else {
      notes.push(
        t(L, 'uth.note.suitSame', {
          best: this.label(suited.action).toLowerCase(),
          ev: iso(uthUnits(suited.ev)),
          offEv: iso(uthUnits(off.ev)),
          gap: iso(uthUnits(suited.ev - off.ev)),
        }),
      );
    }
    const hi = POKER_RANKS.indexOf(holeClass[0] );
    const lo = POKER_RANKS.indexOf(holeClass[1] );
    if (hi - lo === 1 && suitedRow.optimalAction === 'check') notes.push(t(L, 'uth.note.connector'));
    return notes;
  }

  /**
   * Showdown, as three separate lines.
   *
   * The Ante, the Play and the Blind resolve by three unrelated rules, and one
   * net figure explains none of them. So the dealer's line carries the Ante
   * (which is the only bet qualification touches), then the Play, then the
   * Blind — and the total comes last and quietest.
   */
          lines(s               )                                                    {
    const L = this.locale;
    const iso = isolateFor(L);
    const cash = (value        ) => iso(money(value));
    const bet = iso(`${s.playBet}×`);
    if (s.folded) {
      return {
        lines: [t(L, 'uth.line.folded'), t(L, 'uth.line.foldPlay'), t(L, 'uth.line.forfeit')],
        net: t(L, 'uth.line.net', { net: cash(s.net) }),
        folded: true,
      };
    }
    const tie = s.ante === 0 && s.play === 0 && s.blind === 0 && s.dealerQualified;
    if (tie) {
      return {
        lines: [t(L, 'uth.line.tie'), t(L, 'uth.line.playPush', { bet }), t(L, 'uth.line.blindTie')],
        net: t(L, 'uth.line.net', { net: cash(s.net) }),
        folded: false,
      };
    }
    const dealer = s.dealerQualified
      ? t(L, 'uth.line.dealerQualified', { ante: cash(s.ante) })
      : t(L, 'uth.line.dealerNotQualified');
    const play =
      s.play > 0
        ? t(L, 'uth.line.playWin', { bet, play: cash(s.play) })
        : s.play < 0
          ? t(L, 'uth.line.playLose', { bet, play: cash(s.play) })
          : t(L, 'uth.line.playPush', { bet });
    const blind =
      s.blind > 0
        ? t(L, 'uth.line.blindPaid', { blind: cash(s.blind) })
        : s.blindPushed
          ? t(L, 'uth.line.blindPush')
          : s.blind < 0
            ? t(L, 'uth.line.blindLose')
            : t(L, 'uth.line.blindTie');
    return {
      lines: [dealer, play, blind],
      net: t(L, 'uth.line.net', { net: cash(s.net) }),
      folded: false,
    };
  }
}

</script>

<script>
/* Screen markup, lifted from the pages the local app serves. */
const HOME_HTML = "<div class=\"shell\">\n      <!--\n        The front of the app is a greeting and two doors. Everything measured\n        lives behind a tab, because a wall of figures is not a welcome — and\n        §3.1 would rather you came here to play than to check a scoreboard.\n      -->\n      <section class=\"hero\">\n        <div class=\"hero-top\">\n          <div class=\"initial\" id=\"initial\">P</div>\n          <input class=\"who-name\" id=\"name\" value=\"Player\" data-i18n-value=\"ui.defaultName\"\n                 data-i18n-attr=\"aria-label:ui.yourName\" spellcheck=\"false\" />\n        </div>\n        <p class=\"hero-line\" id=\"greeting\" data-i18n=\"ui.greeting\">Good to see you.</p>\n      </section>\n\n      <section class=\"doors\">\n        <a class=\"door\" href=\"#table\">\n          <span class=\"door-pip\">♠</span>\n          <span class=\"door-title\" data-i18n=\"ui.blackjack\">Blackjack</span>\n          <span class=\"door-sub\" id=\"bj-sub\" data-i18n=\"ui.playAHand\">Play a hand</span>\n        </a>\n        <a class=\"door secondary\" href=\"#ultimate\">\n          <span class=\"door-pip\">♦</span>\n          <span class=\"door-title\" data-i18n=\"ui.ultimate\">Ultimate</span>\n          <span class=\"door-sub\" data-i18n=\"ui.playAHand\">Play a hand</span>\n        </a>\n      </section>\n\n      <nav class=\"tabs\" role=\"tablist\" data-i18n-attr=\"aria-label:ui.yourPlay\">\n        <button class=\"tab\" role=\"tab\" data-tab=\"standing\" aria-selected=\"true\" data-i18n=\"ui.tab.standing\">Standing</button>\n        <button class=\"tab\" role=\"tab\" data-tab=\"hands\" aria-selected=\"false\" data-i18n=\"ui.tab.hands\">Hands</button>\n        <button class=\"tab\" role=\"tab\" data-tab=\"stats\" aria-selected=\"false\" data-i18n=\"ui.tab.stats\">Stats</button>\n      </nav>\n\n      <section class=\"tab-body\" id=\"panel-standing\" role=\"tabpanel\">\n        <div class=\"standing\">\n          <div class=\"standing-value\" id=\"rating\">—</div>\n          <div class=\"standing-label\" id=\"rating-label\" data-i18n=\"ui.rating\">rating</div>\n          <div class=\"rating-side\" id=\"rating-swing\" hidden></div>\n          <p class=\"standing-note\" id=\"rating-note\"></p>\n        </div>\n        <div class=\"modes\" role=\"group\" data-i18n-attr=\"aria-label:ui.drilledOn\">\n          <button class=\"mode\" type=\"button\" data-mode=\"basic\" aria-pressed=\"true\">\n            <span data-i18n=\"ui.mode.basic\">Basic</span><small data-i18n=\"ui.mode.basicNote\">the costly hands</small>\n          </button>\n          <button class=\"mode\" type=\"button\" data-mode=\"recall\" aria-pressed=\"false\">\n            <span data-i18n=\"ui.mode.recall\">Recall</span><small data-i18n=\"ui.mode.recallNote\">thin and rare</small>\n          </button>\n          <button class=\"mode\" type=\"button\" data-mode=\"value\" aria-pressed=\"false\">\n            <span data-i18n=\"ui.mode.value\">Value</span><small data-i18n=\"ui.mode.valueNote\">your own leaks</small>\n          </button>\n        </div>\n        <div id=\"ladder\" class=\"ladder\"></div>\n      </section>\n\n      <section class=\"tab-body\" id=\"panel-hands\" role=\"tabpanel\" hidden>\n        <div id=\"hands\"></div>\n      </section>\n\n      <section class=\"tab-body\" id=\"panel-stats\" role=\"tabpanel\" hidden>\n        <div id=\"stats\"></div>\n      </section>\n\n      <p class=\"footer\" id=\"footer\"></p>\n    </div>";
const TABLE_HTML = "<div class=\"shell\">\n    <!-- Spec §10.1: the rule-set badge is always visible and non-dismissible. -->\n    <header class=\"rules\" id=\"rules-bar\">\n      <a class=\"back\" href=\"#home\">‹ <span data-i18n=\"ui.home\">Home</span></a>\n      <div class=\"rules-main\">\n        <span class=\"rules-name\" id=\"rules-name\">—</span>\n        <!--\n          The badge states the rules; it is not a control (§10.1). The link\n          beside it is, so the surrender switch is one tap from the statement it\n          contradicts rather than behind a button labelled \"Rules\" that reads as\n          reference material.\n        -->\n        <div class=\"rules-sub\">\n          <span class=\"rules-badge\" id=\"rules-badge\"></span>\n          <button class=\"link rules-change\" id=\"change-rules\" type=\"button\"\n                  data-i18n=\"ui.change\">change</button>\n        </div>\n      </div>\n      <button class=\"link\" id=\"open-settings\" data-i18n-attr=\"aria-label:ui.changeRuleSet\" data-i18n=\"ui.rules\">Rules</button>\n    </header>\n\n    <!--\n      Spec §9.2 and §3.1: the session bar leads with decision accuracy and EV\n      lost. Units won is present but last, and deliberately quiet.\n    -->\n    <section class=\"stats\" id=\"stats\" data-i18n-attr=\"aria-label:ui.sessionStats\">\n      <button class=\"stat\" id=\"accuracy-stat\" type=\"button\" data-info=\"accuracy\"\n              aria-expanded=\"false\" aria-controls=\"stat-info\">\n        <span class=\"stat-value\" id=\"stat-accuracy\">—</span>\n        <span class=\"stat-label\" data-i18n=\"ui.decisionAccuracy\">decision accuracy</span>\n        <span class=\"stat-more\" aria-hidden=\"true\">?</span>\n      </button>\n      <button class=\"stat\" type=\"button\" data-info=\"evLost\"\n              aria-expanded=\"false\" aria-controls=\"stat-info\">\n        <span class=\"stat-value\" id=\"stat-evlost\">—</span>\n        <span class=\"stat-label\" data-i18n=\"ui.evLostPer1 /* The three screen scripts, unchanged but for their transport. */
function initHome() {
/*
 * Home (§10, screen 1).
 *
 * A greeting and two doors. Everything measured sits behind a tab, because a
 * front page of figures is an instrument panel rather than a welcome — and
 * §3.1 would rather you came here to play than to check a scoreboard.
 *
 * Nothing shown is invented. Where there is no history yet it says so, because
 * a home screen that fabricates your progress is worse than one admitting it
 * has none.
 */

const T = (key, params) => (window.EV ? window.EV.t(key, params) : key);

const el = (id) => document.getElementById(id);


const round10 = (n) => Math.round(n / 10) * 10;

function greet(stats) {
  const hands = stats.hands.toLocaleString();
  if (stats.hands === 0) return T('home.greet.none');
  if (stats.hands < 25) return T('home.greet.early', { hands });
  if (stats.accuracy >= 0.99) return T('home.greet.clean', { hands });
  if (stats.accuracy >= 0.95) return T('home.greet.close', { hands });
  return T('home.greet.work', { hands });
}

function renderStanding(profile) {
  const { rating, ladder } = profile;
  const rated = rating.ratedDecisions > 0;

  el('rating').textContent = rated ? round10(rating.rating) : '—';
  el('rating').className = 'standing-value' + (rating.provisional ? ' provisional' : '');
  el('rating-label').textContent = rated
    ? T('home.ratingOf', { mode: T('ui.mode.' + rating.mode) })
    : T('home.unrated');
  el('rating-note').textContent = !rated
    ? T('home.rating.none')
    : rating.provisional
      ? T('home.rating.settling', { left: Math.max(1, 30 - rating.ratedDecisions) })
      : T('home.rating.peak', { peak: round10(rating.peak) });

  // Which way it has gone this session. The rating falls as readily as it
  // rises, which is what makes it worth showing at all.
  const swing = el('rating-swing');
  if (swing) {
    const moved = rated && Math.round(rating.sessionDelta) !== 0;
    swing.hidden = !moved;
    if (moved) {
      const points = Math.round(rating.sessionDelta);
      swing.className = 'rating-side ' + (points > 0 ? 'up' : 'down');
      swing.textContent = T('home.sessionSwing', {
        delta: points > 0 ? `+${points}` : `−${Math.abs(points)}`,
      });
    }
  }

  for (const button of document.querySelectorAll('.mode')) {
    button.setAttribute('aria-pressed', String(button.dataset.mode === rating.mode));
  }

  const box = el('ladder');
  box.replaceChildren();
  if (ladder.length === 0) return;

  const head = document.createElement('div');
  head.className = 'ladder-head';
  head.textContent = 'what this mode counts as hard';
  box.appendChild(head);

  const lo = ladder[0].difficulty;
  const hi = ladder[ladder.length - 1].difficulty;
  for (const row of ladder) {
    const width = hi === lo ? 50 : ((row.difficulty - lo) / (hi - lo)) * 100;
    const div = document.createElement('div');
    div.className = 'ladder-row';
    div.innerHTML =
      `<div><div>${row.label} <span class="muted">· ${row.optimal}</span></div>` +
      `<div class="ladder-bar" style="width:${Math.max(6, width)}%"></div>` +
      `<div class="ladder-meta">one in ${row.oneIn.toLocaleString()} hands</div></div>` +
      `<div class="ladder-score">${row.difficulty}</div>`;
    box.appendChild(div);
  }
}

/**
 * Why a hand carried no decision at all.
 *
 * It used to say "a natural" for every one of them, which is wrong more often
 * than it is right: a *dealer* natural ends the hand on the deal too, and that
 * is the case a player is most likely to come back and check, because from the
 * seat it looked as though their turn had been skipped.
 */
function noDecisionReason(hand) {
  const value = (cards) => {
    let total = 0;
    let aces = 0;
    for (const card of cards) {
      if (card.rank === 'A') {
        aces++;
        total += 11;
      } else total += card.rank === '10' || 'JQK'.includes(card.rank) ? 10 : Number(card.rank);
    }
    while (total > 21 && aces > 0) {
      total -= 10;
      aces--;
    }
    return total;
  };
  const natural = (cards) => cards.length === 2 && value(cards) === 21;
  if (natural(hand.dealerCards)) {
    return natural(hand.playerHands[0] ?? []) ? 'log.bothNaturals' : 'log.dealerNatural';
  }
  if (natural(hand.playerHands[0] ?? [])) return 'log.playerNatural';
  return 'log.noDecisions';
}

/**
 * The one-line summary of a whole hand.
 *
 * It used to be the headline of the hand's *worst* decision — "5,5 vs 8 →
 * Double" — sitting above three decisions, belonging to one of them and
 * describing none of the others. Idan read it as the app changing its mind:
 * "how come one time one thing was right and then another?" A hand with one
 * decision can still be summarised by that decision; a hand with several has to
 * be summarised as a hand.
 */
function handSummary(hand) {
  const decisions = hand.decisions;
  if (decisions.length === 0) return T(noDecisionReason(hand));
  if (decisions.length === 1) {
    const only = decisions[0];
    return T(only.correct ? 'log.right' : 'log.played', {
      headline: only.headline,
      chosen: only.chosen.toLowerCase(),
    });
  }
  const off = decisions.filter((d) => !d.correct).length;
  return off === 0
    ? T('log.allRight', { n: decisions.length })
    : T('log.someOff', { n: decisions.length, bad: off });
}

const STEP_TITLES = () => [T('ui.readDealer'), T('ui.readHand'), T('ui.combine')];

/**
 * The expanded hand: one block per decision, each under its own header.
 *
 * Three decisions used to expand into nine unlabelled paragraphs, the first of
 * which — the dealer read — was identical three times over, because the dealer's
 * upcard does not change inside a hand. In the live reveal repeating it is
 * right: each decision is walked on its own. In the log it is noise, and it
 * pushed the part that differs off the bottom of the block.
 *
 * So the dealer read is lifted out and shown once, and repeated only if it
 * genuinely changes — which it does when an insurance decision and a hand
 * decision sit in the same hand, since those two do not read the same dealer.
 */
function decisionBlocks(hand) {
  const box = document.createElement('div');
  box.className = 'log-steps';
  box.hidden = true;

  const titles = STEP_TITLES();
  let dealerShown = null;

  for (const decision of hand.decisions) {
    const block = document.createElement('div');
    block.className = 'log-decision';

    const head = document.createElement('div');
    head.className = 'log-decision-head';
    const tier = document.createElement('span');
    tier.className = `log-dot ${decision.severity}`;
    const text = document.createElement('span');
    text.textContent = T(decision.correct ? 'log.right' : 'log.played', {
      headline: decision.headline,
      chosen: decision.chosen.toLowerCase(),
    });
    head.append(tier, text);
    block.appendChild(head);

    decision.steps.forEach((line, i) => {
      // Step one is the dealer read. Once per hand, unless it changed.
      if (i === 0) {
        if (line === dealerShown) return;
        dealerShown = line;
      }
      const step = document.createElement('p');
      const title = document.createElement('span');
      title.className = 'log-step-title';
      title.textContent = titles[i] ?? '';
      step.append(title, document.createTextNode(line));
      block.appendChild(step);
    });

    box.appendChild(block);
  }
  return box;
}

function renderHands(view) {
  const box = el('hands');
  box.replaceChildren();
  const hands = view.history ?? [];

  if (hands.length === 0) {
    const note = document.createElement('p');
    note.className = 'empty-note';
    note.textContent = T('home.noHands');
    box.appendChild(note);
    return;
  }

  for (const hand of hands) {
    const worst = hand.decisions.reduce(
      (acc, d) => (acc === null || d.evCost > acc.evCost ? d : acc),
      null,
    );
    const cards = hand.playerHands.map((h) => h.map((c) => c.rank + c.suit).join(' ')).join('  |  ');
    const dealer = hand.dealerCards.map((c) => c.rank + c.suit).join(' ');
    const detail = handSummary(hand);

    const row = document.createElement('div');
    row.className = 'log-row';
    row.innerHTML =
      `<div class="log-tier ${worst ? worst.severity : 'optimal'}"></div>` +
      // Each run of cards is its own left-to-right island. In Hebrew a suit is a
      // neutral character, and without this "7♠ 2♦" drew as "♠7 ♦2":
      // 26 of 27 cards measured suit-first on a 390px phone.
      `<div><div class="log-hand"><bdi dir="ltr">${cards}</bdi> <span class="muted">${T('log.vs')}</span> <bdi dir="ltr">${dealer}</bdi></div>` +
      `<div class="log-detail">${detail}</div></div>` +
      `<div class="log-net ${hand.netUnits > 0 ? 'win' : hand.netUnits < 0 ? 'loss' : ''}">${
        hand.netUnits > 0 ? '+' : ''
      }${hand.netUnits}</div>`;

    const steps = decisionBlocks(hand);
    row.addEventListener('click', () => {
      steps.hidden = !steps.hidden;
    });
    box.append(row, steps);
  }
}

/** A figure, written out rather than tabulated — one number, one sentence. */
function figure(value, label, note, quiet) {
  const div = document.createElement('div');
  div.className = 'figure';
  div.innerHTML =
    `<div class="figure-value${quiet ? ' quiet' : ''}">${value}</div>` +
    `<div class="figure-label">${label}</div>` +
    (note ? `<div class="figure-note">${note}</div>` : '');
  return div;
}

function renderStats(view, profile) {
  const s = view.stats;
  const box = el('stats');
  box.replaceChildren();

  if (s.decisions === 0) {
    const note = document.createElement('p');
    note.className = 'empty-note';
    note.textContent = T('home.noStats');
    box.appendChild(note);
    return;
  }

  const excluded =
    s.closeCallsExcluded > 0
      ? T(s.closeCallsExcluded === 1 ? 'home.excludedOne' : 'home.excluded', {
          n: s.closeCallsExcluded,
          pct: (s.accuracyIncludingCloseCalls * 100).toFixed(1),
        })
      : T('home.noExcluded');

  box.append(
    figure(`${(s.accuracy * 100).toFixed(1)}%`, T('home.fig.accuracy'), excluded),
    figure(s.evLostPer100.toFixed(2), T('home.fig.evLost'), T('home.fig.evLostNote')),
    figure(
      `${s.effectiveHouseEdgePercent.toFixed(2)}%`,
      T('home.fig.edge'),
      T('home.fig.edgeNote', { pct: profile.ruleSet.edgePercent.toFixed(2) }),
    ),
    figure(
      `${s.netUnits > 0 ? '+' : ''}${s.netUnits}`,
      T('home.fig.units'),
      T('home.fig.unitsNote'),
      true,
    ),
  );
}

function selectTab(name) {
  for (const tab of document.querySelectorAll('.tab')) {
    tab.setAttribute('aria-selected', String(tab.dataset.tab === name));
  }
  for (const panel of ['standing', 'hands', 'stats']) {
    el(`panel-${panel}`).hidden = panel !== name;
  }
  try {
    localStorage.setItem('ev:tab', name);
  } catch {
    // storage disabled; the tab simply does not persist
  }
}

async function refresh() {
  const [profile, view] = await Promise.all([api('/api/profile'), api('/api/state')]);
  // The placeholder is the client's business, because it has to be in the
  // language on screen; the server only knows a name once one is typed.
  const name = profile.player.name || T('ui.defaultName');
  el('name').value = name;
  el('initial').textContent = name.charAt(0).toUpperCase();
  el('greeting').textContent = greet(view.stats);
  el('bj-sub').textContent =
    view.stats.hands === 0
      ? T('ui.playAHand')
      : T('home.handsPlayed', { hands: view.stats.hands.toLocaleString() });
  el('footer').textContent = T('home.footer', {
    pct: profile.ruleSet.edgePercent.toFixed(2),
  });

  renderStanding(profile);
  renderHands(view);
  renderStats(view, profile);
}

for (const tab of document.querySelectorAll('.tab')) {
  tab.addEventListener('click', () => selectTab(tab.dataset.tab));
}
for (const button of document.querySelectorAll('.mode')) {
  button.addEventListener('click', async () => {
    await api('/api/player', { mode: button.dataset.mode });
    await refresh();
  });
}
el('name').addEventListener('change', async (event) => {
  await api('/api/player', { name: event.target.value });
  await refresh();
});

try {
  selectTab(localStorage.getItem('ev:tab') ?? 'standing');
} catch {
  selectTab('standing');
}
// After the locale handshake, so the first render is already in the right language.
Promise.resolve(window.EV && window.EV.ready).then(refresh);

}

function initTable() {
/*
 * Client for the EV Trainer.
 *
 * Plain JavaScript, no build step: the engines run on the server, where Node
 * strips their types, and this only draws what it is told.
 *
 * Two rules from the spec shape the whole flow:
 *
 *   §3.1  The grade is shown on the decision, before and independently of the
 *         result. So the feedback card appears the moment an action is taken,
 *         and the hand's outcome is drawn afterwards and kept visually quiet.
 *   §10.1 Actions live along the bottom edge, and Deal needs no confirmation.
 */

const T = (key, params) => (window.EV ? window.EV.t(key, params) : key);


const el = (id) => document.getElementById(id);

const state = {
  view: null,
  busy: false,
  reveal: null,
  /*
   * Which cards the felt is already showing.
   *
   * `render()` runs after every response *and* after every step of the reveal,
   * and the seats are rebuilt wholesale each time. Without a record of what was
   * already there, anything that animates a card would replay the entire deal
   * three times while the player reads the reasoning. So each pass works out
   * which cards are genuinely new, and only those are treated as newly dealt.
   */
  shown: { dealer: [], hands: [] },
  /** Guards the one-shot verdict effects; see `flashOnce`. */
  flashed: null,
};

/** Identity of a card in its seat: same rank, same suit, same position. */
const cardKey = (card, index) => `${index}:${card.rank}${card.suit}`;

/**
 * Which of these cards were not on the felt a moment ago.
 *
 * Positional, because that is what a seat is: the third card of a hand is a
 * different thing from the third card of another hand, even with the same face.
 * Returns a Set of keys, plus each new card's position among the new ones, so a
 * fresh deal staggers and a single hit does not wait behind it.
 */
function newCards(keys, previous) {
  const fresh = new Map();
  for (let i = 0; i < keys.length; i++) {
    if (previous[i] !== keys[i]) fresh.set(i, fresh.size);
  }
  return fresh;
}

/* --------------------------------------------------------------------------
 * Sound
 *
 * Off unless asked for, and synthesised rather than shipped: no files, no
 * fetch, nothing for a content policy to block, and a couple of kilobytes
 * instead of a couple of hundred.
 *
 * Two voices, and a hard rule about what has none. A card landing makes a
 * noise. A verdict makes a noise — the same length, the same loudness, right
 * or wrong, differing only in pitch. Winning money makes no noise at all. A
 * jingle on a won hand is the exact conditioning §3.1 and §16 exist to keep
 * out of this app, and a buzzer on a lost one is the same mistake inverted.
 * ----------------------------------------------------------------------- */

function soundEnabled() {
  try {
    return localStorage.getItem('ev:sound') === '1';
  } catch {
    return false;
  }
}
function setSoundEnabled(value) {
  try {
    localStorage.setItem('ev:sound', value ? '1' : '0');
  } catch {
    // Storage disabled; the preference simply lasts for this page.
  }
}

/**
 * The audio context, made only once and only on demand.
 *
 * Lazily, because a player who never turns sound on should never have one at
 * all. On `window`, because the artifact build wraps this file in a function
 * that runs again on every screen change — a module-level context would leak
 * one per navigation.
 */
function audio() {
  if (!soundEnabled()) return null;
  try {
    if (!window.__evAudio) {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return null;
      const ctx = new Ctx();
      const master = ctx.createGain();
      master.gain.value = 0.25; // Nothing here can ever be loud.
      master.connect(ctx.destination);
      window.__evAudio = { ctx, master };
    }
    const held = window.__evAudio;
    if (held.ctx.state === 'suspended') held.ctx.resume();
    return held;
  } catch {
    return null;
  }
}

/** A card landing on felt: a short filtered noise burst, nothing musical. */
function playCard(delayMs) {
  const held = audio();
  if (!held) return;
  const { ctx, master } = held;
  const length = Math.floor(ctx.sampleRate * 0.012);
  const buffer = ctx.createBuffer(1, length, ctx.sampleRate);
  const samples = buffer.getChannelData(0);
  for (let i = 0; i < length; i++) samples[i] = (Math.random() * 2 - 1) * (1 - i / length);

  const source = ctx.createBufferSource();
  source.buffer = buffer;
  const filter = ctx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.value = 2400;
  const gain = ctx.createGain();
  gain.gain.value = 0.5;
  source.connect(filter).connect(gain).connect(master);
  source.start(ctx.currentTime + delayMs / 1000);
}

/**
 * The verdict.
 *
 * Identical envelope, duration and gain either way — only the pitch moves.
 * Not a rising arpeggio, not a chime, not a coin.
 */
function playVerdict(correct) {
  const held = audio();
  if (!held) return;
  const { ctx, master } = held;
  const at = ctx.currentTime;
  const osc = ctx.createOscillator();
  osc.type = 'sine';
  osc.frequency.value = correct ? 660 : 220;
  const gain = ctx.createGain();
  gain.gain.setValueAtTime(0.0001, at);
  gain.gain.exponentialRampToValueAtTime(0.4, at + 0.005);
  gain.gain.exponentialRampToValueAtTime(0.0001, at + 0.09);
  osc.connect(gain).connect(master);
  osc.start(at);
  osc.stop(at + 0.1);
}

/**
 * Step through the reasoning, or show it all at once. Persisted, because being
 * asked to click three times on every hand of a drilling session is a tax.
 */
function showAllPreferred() {
  try {
    return localStorage.getItem('ev:showAll') === '1';
  } catch {
    return false;
  }
}
function setShowAllPreferred(value) {
  try {
    localStorage.setItem('ev:showAll', value ? '1' : '0');
  } catch {
    // A browser with storage disabled just loses the preference; not fatal.
  }
}


/** Every call that changes the table funnels through here. */
async function send(path, body) {
  if (state.busy) return;
  state.busy = true;
  try {
    // A new hand starts an empty felt, so its first cards are new even if they
    // happen to match the last hand's rank, suit and seat.
    if (path === '/api/deal') state.shown = { dealer: [], hands: [] };
    state.view = await api(path, body ?? {});
    const feedback = state.view.feedback;
    state.reveal = feedback
      ? { steps: feedback.steps, shown: showAllPreferred() ? 3 : 1 }
      : null;
    render();
  } catch (error) {
    console.error(error);
    alert(error.message);
  } finally {
    state.busy = false;
  }
}

// --- Rendering -------------------------------------------------------------

/**
 * One card, marked by where it came from.
 *
 * A hand of three cards tells you nothing about how it got there, and "16" that
 * arrived as 10+6 is a different lesson from one that arrived as 5+4 then 7. So
 * the opening two sit flush and plain, and every card taken since carries the
 * number of the draw that brought it. The distinction is in the shape and the
 * badge, not in colour alone (§13), and it reaches a screen reader too.
 */
function cardNode(card, index, dealtNow) {
  const drawn = index !== undefined && index >= 2;
  // In step with the visual stagger, so the sound is the card landing rather
  // than a separate event that happens to coincide.
  if (dealtNow !== undefined) playCard(dealtNow * 70);
  const node = document.createElement('div');
  node.className =
    'card' + (card.red ? ' red' : '') + (drawn ? ' drawn' : ' dealt') +
    (dealtNow === undefined ? '' : ' arriving');
  if (dealtNow !== undefined) node.style.setProperty('--deal-index', dealtNow);
  node.setAttribute('role', 'img');
  node.setAttribute(
    'aria-label',
    drawn
      ? T('ui.cardDrawn', { card: card.label, n: index - 1 })
      : T('ui.cardDealt', { card: card.label }),
  );
  if (drawn) node.dataset.draw = index - 1;
  const rank = document.createElement('span');
  rank.className = 'card-rank';
  rank.textContent = card.rank;
  const suit = document.createElement('span');
  suit.className = 'card-suit';
  suit.textContent = card.suit;
  node.append(rank, suit);
  return node;
}

function faceDownNode(dealtNow) {
  const node = document.createElement('div');
  node.className = 'card back dealt' + (dealtNow === undefined ? '' : ' arriving');
  if (dealtNow !== undefined) node.style.setProperty('--deal-index', dealtNow);
  node.setAttribute('role', 'img');
  node.setAttribute('aria-label', 'face-down card');
  return node;
}

function renderDealer(view) {
  const box = el('dealer-cards');
  // While the reveal is running the outcome stays under wraps: §3.1 wants the
  // grade independent of the result, and a result shown two clicks before the
  // grade would break that far more thoroughly than an early EV chip.
  const withhold = !revealComplete();
  const cards = withhold ? view.dealer.cards.slice(0, 1) : view.dealer.cards;

  const keys = cards.map(cardKey);
  // The hole card keys as itself, so turning it over counts as a card arriving
  // rather than as one silently changing its face.
  if (view.dealer.hidden || withhold) keys.push(`${keys.length}:back`);
  const fresh = newCards(keys, state.shown.dealer);
  state.shown.dealer = keys;

  box.replaceChildren(...cards.map((card, i) => cardNode(card, i, fresh.get(i))));
  if (view.dealer.hidden || withhold) box.appendChild(faceDownNode(fresh.get(cards.length)));
  el('dealer-total').textContent =
    view.dealer.total === null || withhold
      ? ''
      : `· ${view.dealer.total}${view.dealer.total > 21 ? ' bust' : ''}`;

  // §3.1 again: a bare total after the player busts reads as "you would have won
  // by standing", which is the opposite of true.
  let note = document.getElementById('dealer-note');
  if (view.dealer.didNotDraw && !withhold) {
    if (!note) {
      note = document.createElement('div');
      note.id = 'dealer-note';
      note.className = 'dealer-note';
      box.parentElement.appendChild(note);
    }
    note.textContent = T('fb.didNotDraw');
  } else if (note) {
    note.remove();
  }
}

/*
 * Chips.
 *
 * Real denominations, broken high to low, because a stack of two hundred ones
 * is a bar chart and a stack with a black chip in it is money. The colours are
 * the ones every table uses — white one, red five, green twenty-five, black
 * hundred — so the stack is readable before the number beside it is.
 */
const DENOMINATIONS = [
  { value: 500, name: 'purple' },
  { value: 100, name: 'black' },
  { value: 25, name: 'green' },
  { value: 5, name: 'red' },
  { value: 1, name: 'white' },
];

/*
 * The row has to add up.
 *
 * While the chips were blank the count was decoration and a cap that dropped
 * the last few cost nothing. Now that each one says what it is worth, a player
 * can add the row up — so it must equal the figure beside it, or the rail is
 * quietly lying. The cap is therefore generous enough that no reachable balance
 * is ever truncated, and the row wraps rather than losing a chip.
 */
function chipNodes(amount, cap) {
  const chips = [];
  let left = Math.max(0, Math.round(amount * 2) / 2);
  for (const { value, name } of DENOMINATIONS) {
    let count = Math.floor(left / value);
    left -= count * value;
    while (count-- > 0 && chips.length < cap) chips.push({ name, value });
  }
  // A half unit is what a surrender leaves behind; it is worth showing rather
  // than rounding away, since it is the whole point of the play.
  if (left >= 0.5 && chips.length < cap) chips.push({ name: 'half', value: '½' });

  return chips.map(({ name, value }) => {
    const chip = document.createElement('span');
    chip.className = `chip chip-${name}`;
    // Laid out in a row rather than stacked, so every denomination is legible;
    // a real stack shows only its top face, which is no use for reading a total.
    chip.textContent = value;
    return chip;
  });
}

/** The player's rail: what is in play, and what is behind it. */
function renderRail(view) {
  const box = el('rail');
  if (!box) return;
  const stack = view.stack;
  box.replaceChildren();

  const wager = document.createElement('div');
  wager.className = 'rail-spot rail-bet';
  const wagerChips = document.createElement('span');
  wagerChips.className = 'chips';
  wagerChips.setAttribute('aria-hidden', 'true');
  wagerChips.replaceChildren(...chipNodes(stack.wager, 12));
  const wagerFigure = document.createElement('span');
  wagerFigure.className = 'rail-value';
  wagerFigure.textContent = stack.wager > 0 ? stack.wager : '—';
  const wagerLabel = document.createElement('span');
  wagerLabel.className = 'rail-label';
  wagerLabel.textContent = T('ui.wager');
  wager.append(wagerChips, wagerFigure, wagerLabel);

  const bank = document.createElement('div');
  bank.className = 'rail-spot rail-bank';
  const bankChips = document.createElement('span');
  bankChips.className = 'chips';
  bankChips.setAttribute('aria-hidden', 'true');
  bankChips.replaceChildren(...chipNodes(stack.balance, 24));
  const bankFigure = document.createElement('span');
  bankFigure.className = 'rail-value';
  bankFigure.textContent = stack.balance.toFixed(stack.balance % 1 === 0 ? 0 : 1);
  const bankLabel = document.createElement('span');
  bankLabel.className = 'rail-label';
  bankLabel.textContent = T('ui.stack');
  bank.append(bankChips, bankFigure, bankLabel);

  // The swing from the last hand, and only once the grade is out — §3.1 keeps
  // the result behind the decision, and money is the most distracting result
  // there is.
  if (stack.lastNet !== null && stack.lastNet !== undefined && revealComplete()) {
    const delta = document.createElement('span');
    delta.className =
      'rail-delta ' + (stack.lastNet > 0 ? 'win' : stack.lastNet < 0 ? 'loss' : '');
    delta.textContent = `${stack.lastNet > 0 ? '+' : ''}${stack.lastNet}`;
    bank.appendChild(delta);
  }

  box.append(wager, bank);
}

function renderHands(view) {
  const box = el('player-hands');
  box.replaceChildren();

  // Each seat keeps its own record, so splitting into a second hand does not
  // make the first one look newly dealt.
  const previous = state.shown.hands;
  state.shown.hands = view.hands.map((hand) => hand.cards.map(cardKey));

  view.hands.forEach((hand, handIndex) => {
    const wrap = document.createElement('div');
    wrap.className = 'hand' + (hand.active ? ' active' : '');

    const fresh = newCards(state.shown.hands[handIndex], previous[handIndex] ?? []);
    const cards = document.createElement('div');
    cards.className = 'cards';
    cards.replaceChildren(...hand.cards.map((card, i) => cardNode(card, i, fresh.get(i))));
    wrap.appendChild(cards);

    // Only once there is more than one hand. With a single hand the betting
    // circle below already shows the wager, and saying it twice on the same
    // felt reads as two different bets.
    if (view.hands.length > 1) {
      const wager = document.createElement('div');
      wager.className = 'hand-wager';
      wager.setAttribute('aria-hidden', 'true');
      wager.replaceChildren(...chipNodes(hand.bet, 8));
      wrap.appendChild(wager);
    }

    // The total is the thing the player is actually reading, so it is its own
    // element and sized like it — the notes beside it stay small and quiet.
    const total = document.createElement('div');
    total.className = 'hand-total' + (hand.total > 21 ? ' bust' : '');
    total.textContent = hand.total;
    wrap.appendChild(total);

    const meta = document.createElement('div');
    meta.className = 'hand-meta';
    const bits = [];
    if (hand.total > 21) bits.push(T('ui.bust'));
    if (hand.doubled) bits.push(T('hand.doubled'));
    if (hand.surrendered) bits.push(T('hand.surrendered'));
    if (hand.bet !== 1) bits.push(T('hand.units', { n: hand.bet }));
    meta.textContent = bits.join(' · ');

    // §3.1: the result is shown, but afterwards and de-emphasised — and never
    // before the grade it might otherwise colour.
    if (hand.net !== null && hand.net !== undefined && revealComplete()) {
      const net = document.createElement('span');
      net.className = 'hand-net ' + (hand.net > 0 ? 'win' : hand.net < 0 ? 'loss' : '');
      net.textContent = `  ${hand.net > 0 ? '+' : ''}${hand.net}`;
      meta.appendChild(net);
    }
    wrap.appendChild(meta);
    box.appendChild(wrap);
  });

  el('empty-state').hidden = view.hands.length > 0;
}

/**
 * Render a step's text: emphasis where the copy asks for it, and figures set in
 * the display face so they read as numbers rather than as more prose.
 *
 * The copy is authored in explain.ts with ** around the words that carry the
 * point; numbers are picked out here so nobody has to mark up every one. All of
 * it is engine-generated — no user text reaches this — but it is escaped first
 * regardless, because "the input is trusted" is how that stops being true.
 */
function renderRich(target, text) {
  const escaped = text
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
  target.innerHTML = escaped
    .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
    // Percentages, signed EVs and bare figures, including 17+ and A,A.
    .replace(/(?<![\w>])([+−-]?\d+(?:[.,]\d+)?%?\+?)(?![\w<])/g, '<span class="num">$1</span>');
}

const severityWord = (severity) => T('fb.' + severity);

/**
 * The guided reveal (§3.4, §7.1).
 *
 * Steps one and two show only the readings; the verdict, its cost and the EV
 * chips all arrive together at step three. Hiding the chips alone would have
 * been theatre — the verdict names the best action, so the answer was already
 * out. Hiding both means the player genuinely reasons before seeing the answer.
 *
 * The hand's *outcome* is gated on the same switch. §3.1 requires the grade to
 * be independent of the result, and a result visible two clicks before the grade
 * would break that far more thoroughly than showing the chips early.
 */
function revealComplete() {
  return !state.reveal || state.reveal.shown >= 3;
}

const stepTitles = () => [T('ui.readDealer'), T('ui.readHand'), T('ui.combine')];

/**
 * True once per token — the guard for anything that should happen exactly once
 * when a verdict appears, rather than on every re-render of the same verdict.
 */
function flashOnce(token) {
  if (state.flashed === token) return false;
  state.flashed = token;
  return true;
}

/**
 * The rating points the decision was worth.
 *
 * Shown whether the hand went on to win or lose, and that is the point: a
 * correct play that loses puts a green gain here directly above a red loss on
 * the rail, in one frame. That picture argues §3.1 better than any sentence.
 */
function ratingSide(feedback) {
  const side = document.createElement('span');
  side.className = 'rating-side';
  const delta = feedback.ratingDelta;

  // Off the 311-cell grid there is no cell and nothing to rate. Say so rather
  // than showing nothing, which reads as a bug.
  if (delta === null || delta === undefined) {
    const none = document.createElement('span');
    none.className = 'unrated';
    none.textContent = '—';
    none.title = T('fb.unratedWhy');
    side.appendChild(none);
    return side;
  }

  const points = Math.round(delta);
  const moved = document.createElement('span');
  moved.className = points >= 0 ? 'up' : 'down';
  // U+2212 for the minus, matching the typography everywhere else.
  moved.textContent = T('ui.ratingPoints', {
    delta: points >= 0 ? `+${points}` : `−${Math.abs(points)}`,
  });
  moved.title = T('fb.ratingWhy');
  side.appendChild(moved);
  return side;
}

/**
 * How hard the spot was — but only when that is worth saying.
 *
 * Silence on the routine ones is what makes the tag mean anything. It comes
 * free at the top of the board too: hard 20 has no chart cell at all, so the
 * engine already reports nothing for it.
 */
function describeSpotLine(feedback) {
  const spot = feedback.spot;
  if (!spot) return null;
  if (!spot.hard && !spot.aboveYou) return null;

  const line = document.createElement('p');
  line.className = 'spot';

  const tag = document.createElement('span');
  tag.className = 'tag';
  tag.textContent = T('fb.spotBand', { band: T(`spot.${spot.band}`) });
  line.appendChild(tag);

  const rarity = document.createElement('span');
  rarity.className = 'spot-note';
  rarity.textContent =
    (feedback.correct ? T('fb.spotHeld', { oneIn: spot.oneIn }) : T('fb.spotRarity', { oneIn: spot.oneIn })) +
    (spot.aboveYou ? ` ${T('fb.spotAboveYou')}` : '');
  line.appendChild(rarity);
  return line;
}

/**
 * The answer, pinned above the cards.
 *
 * The three-step reveal is the teaching, but it is long, and a player drilling
 * quickly was having to scroll past the felt to find out what a hand cost. So
 * the parts that are a verdict rather than an argument — the spot, the grade,
 * what was played, and the EV of every legal action — sit between the dealer
 * and the cards, where the eye already is.
 *
 * It obeys the same gate as the rest: nothing here appears until the reveal is
 * complete, so stepping through the reasoning still means reasoning before
 * seeing the answer (§3.4). A player who has chosen to skip the walkthrough
 * gets it immediately, which is the point of that setting.
 */
/**
 * How many decimals each EV chip shows: three, unless two different values
 * would print the same, when both get a fourth. Chips that look equal but are
 * ranked differently read as a bug. The same rule as the UTH card.
 */
function chipDigits(evs) {
  const three = evs.map((ev) => ev.toFixed(3));
  return evs.map((ev, i) => (evs.some((other, j) => j !== i && other !== ev && three[j] === three[i]) ? 4 : 3));
}

function renderQuickCard(view) {
  const box = el('quickcard');
  if (!box) return;
  const feedback = view.feedback;
  const done = revealComplete();

  if (!feedback || !state.reveal) {
    box.hidden = true;
    return;
  }
  box.hidden = false;
  // The affirmation is added at build time on a freshly made node, so the
  // animation starts once and only when the token says this is a new verdict.
  const fresh = done && flashOnce(`${view.stats.decisions}`);
  // Both the sweep and the tone hang off the same gate as everything else on
  // this card. Firing either at click time would tell a player stepping through
  // the reveal whether they were right, two clicks before the card says so.
  if (fresh) playVerdict(feedback.correct);
  const affirm = fresh && feedback.correct;
  box.className =
    (done ? `quickcard ${feedback.severity}` : 'quickcard thinking') + (affirm ? ' affirm' : '');
  box.replaceChildren();

  // After a split the board no longer shows what was actually decided, so the
  // spot is named here whether or not the rest is revealed yet.
  const anchor = document.createElement('p');
  anchor.className = 'anchor';
  if (done) {
    anchor.innerHTML = `<b>${feedback.headline}</b>`;
  } else {
    anchor.innerHTML =
      `<b>${feedback.headline.split(' \u2192 ')[0]}</b> \u2014 ${T('fb.thinking')}`;
    return void box.appendChild(anchor);
  }
  anchor.appendChild(ratingSide(feedback));
  box.appendChild(anchor);

  const verdict = document.createElement('p');
  verdict.className = 'verdict';
  verdict.textContent = feedback.correct
    ? T('fb.correct', { action: feedback.optimalLabel })
    : T('fb.wrong', {
        severity: severityWord(feedback.severity),
        cost: feedback.evCost.toFixed(3),
      });
  // A run is an observation, not a score, so it stays quiet and only appears
  // once there is actually something to observe.
  const streak = feedback.streak;
  if (streak && streak.current >= 3) {
    const pill = document.createElement('span');
    pill.className = 'streak';
    pill.textContent = T('fb.streak', { n: streak.current });
    pill.title = T('fb.streakCounts');
    verdict.appendChild(pill);
  }
  box.appendChild(verdict);

  // How hard the spot was \u2014 the same line whether it was played right or wrong.
  // Only the last clause differs, which is what stops the tag being a prize.
  const spotLine = describeSpotLine(feedback);
  if (spotLine) box.appendChild(spotLine);

  if (feedback.milestone) {
    const hard = feedback.streak.hard;
    const note = document.createElement('p');
    note.className = 'milestone';
    renderRich(
      note,
      T(
        hard === 0 ? 'fb.milestoneNone' : hard === 1 ? 'fb.milestoneOne' : 'fb.milestone',
        { n: feedback.milestone, hard },
      ),
    );
    box.appendChild(note);
  }

  if (!feedback.correct) {
    const did = document.createElement('p');
    did.className = 'did';
    did.textContent =
      T('fb.youChose', {
        chosen: feedback.chosenLabel.toLowerCase(),
        best: feedback.optimalLabel.toLowerCase(),
      }) + (feedback.closeCall ? ' ' + T('fb.closeCall') : '');
    box.appendChild(did);
  }

  // §7.1 item 3: the EV of every legal action, sorted, in units.
  const evs = document.createElement('div');
  evs.className = 'evs';
  feedback.ranked.forEach((entry, index) => {
    const chip = document.createElement('span');
    chip.className =
      'ev' + (index === 0 ? ' best' : '') + (entry.action === feedback.chosen ? ' chosen' : '');
    const sign = entry.ev >= 0 ? '+' : '';
    chip.textContent = `${entry.label}: ${sign}${entry.ev.toFixed(chipDigits(feedback.ranked.map((e) => e.ev))[index])}`;
    evs.appendChild(chip);
  });
  box.appendChild(evs);
}

function renderFeedback(view) {
  const box = el('feedback');
  const feedback = view.feedback;
  if (!feedback || !state.reveal) {
    box.hidden = true;
    return;
  }
  box.hidden = false;
  const done = revealComplete();
  box.className = done ? `feedback ${feedback.severity}` : 'feedback';
  box.replaceChildren();

  // All three slots are always laid out. Only their text arrives a step at a
  // time, so the card keeps its size and nothing under the cursor moves.
  const reveal = document.createElement('div');
  reveal.className = 'reveal';
  for (let i = 0; i < 3; i++) {
    const revealed = i < state.reveal.shown;
    const step = document.createElement('div');
    step.className =
      'step' + (revealed ? '' : ' pending') + (i === state.reveal.shown - 1 ? ' latest' : '');
    const n = document.createElement('div');
    n.className = 'step-n';
    n.textContent = String(i + 1);
    const body = document.createElement('div');
    const head = document.createElement('div');
    head.className = 'step-head';
    head.textContent = stepTitles()[i];
    const text = document.createElement('p');
    if (revealed) renderRich(text, state.reveal.steps[i]);
    body.append(head, text);
    step.append(n, body);
    reveal.appendChild(step);
  }
  box.appendChild(reveal);

  if (!done) {
    const controls = document.createElement('div');
    controls.className = 'reveal-controls';
    const next = document.createElement('button');
    next.className = 'reveal-next';
    next.innerHTML = `${T('ui.next')}<span class="key">SPACE</span>`;
    next.addEventListener('click', advanceReveal);
    const skip = document.createElement('button');
    skip.className = 'reveal-skip';
    skip.textContent = T('fb.skipAlways');
    skip.title = T('fb.skipAlwaysHint');
    skip.addEventListener('click', () => {
      setShowAllPreferred(true);
      state.reveal.shown = 3;
      render();
    });
    controls.append(next, skip);
    box.appendChild(controls);
    return;
  }

  // The preference is reversible from where it took effect, rather than buried
  // in a settings screen the player has no reason to open.
  const pref = document.createElement('button');
  pref.className = 'reveal-skip pref';
  pref.textContent = T(showAllPreferred() ? 'fb.walkMe' : 'fb.skipNext');
  pref.addEventListener('click', () => {
    setShowAllPreferred(!showAllPreferred());
    render();
  });
  box.appendChild(pref);

  // The count said otherwise, and saying so costs the player nothing.
  if (feedback.counterNote) {
    const note = document.createElement('p');
    note.className = 'sensitivity';
    note.textContent = feedback.counterNote;
    box.appendChild(note);
  }

  // §7.1 item 6: flag answers that flip under another common rule set.
  if (feedback.sensitivity.length > 0) {
    const note = document.createElement('p');
    note.className = 'sensitivity';
    note.textContent = T('fb.ruleSensitive', {
      list: feedback.sensitivity.map((s) => `${s.action} ${s.label}`).join('; '),
    });
    box.appendChild(note);
  }
}

function advanceReveal() {
  if (!state.reveal || revealComplete()) return false;
  state.reveal.shown++;
  if (state.reveal.shown >= 3) setShowAllPreferred(false);
  render();
  return true;
}

const LABELS = {
  hit: 'action.hit',
  stand: 'action.stand',
  double: 'action.double',
  split: 'action.split',
  surrender: 'action.surrender',
};

/**
 * Where each decision button sits, as rows of action names.
 *
 * Idan's rule, for both games and both languages: the "yes" action on the
 * physical left, the "no" action on the physical right. Opening a hand, Hit and
 * Stand share the top row and Double and Surrender the row below, and either of
 * those alone takes the whole row. A pair adds Split as a row of its own. Later
 * in the hand only Hit and Stand are left, so that is one row.
 *
 * Layout only: the rows are built from the legal actions the engine sends and
 * never add, drop or change what is legal.
 */
function blackjackRows(legal) {
  const has = (action) => legal.includes(action);
  const rows = [
    ['hit', 'stand'].filter(has),
    ['double', 'surrender'].filter(has),
    ['split'].filter(has),
  ];
  return rows.filter((row) => row.length > 0);
}

function renderActions(view) {
  const box = el('actions');
  box.replaceChildren();
  box.classList.add('rows');

  /*
   * One row, laid out left to right whatever the page direction. The row has
   * `direction: ltr` in the stylesheet, so a Hebrew page does not mirror it; the
   * text inside each button still reads right to left.
   */
  const row = (buttons) => {
    const line = document.createElement('div');
    line.className = 'action-row';
    line.style.setProperty('--cols', String(buttons.length));
    line.append(...buttons);
    box.appendChild(line);
  };
  const button = (label, handler, primary, action) => {
    const node = document.createElement('button');
    node.className = 'action' + (primary ? ' primary' : '');
    node.type = 'button';
    node.textContent = label;
    if (action) node.dataset.action = action;
    node.addEventListener('click', handler);
    return node;
  };

  if (view.phase === 'insurance') {
    // No decision button is primary: colouring one suggests the answer to a
    // decision the page is about to grade.
    row([
      button(T('action.takeInsurance'), () => send('/api/insurance', { take: true }), false, 'takeInsurance'),
      button(T('ui.declineInsurance'), () => send('/api/insurance', { take: false }), false, 'declineInsurance'),
    ]);
    return;
  }
  if (view.phase === 'player') {
    for (const actions of blackjackRows(view.legalActions)) {
      row(
        actions.map((action) =>
          button(LABELS[action] ? T(LABELS[action]) : action, () => send('/api/act', { action }), false, action),
        ),
      );
    }
    return;
  }
  row([button(T('ui.deal'), () => send('/api/deal'), true, 'deal')]);
}

function renderStats(view) {
  const stats = view.stats;
  el('stat-accuracy').textContent =
    stats.decisions === 0 ? '—' : `${(stats.accuracy * 100).toFixed(1)}%`;
  el('stat-evlost').textContent = stats.hands === 0 ? '—' : stats.evLostPer100.toFixed(2);
  el('stat-edge').textContent =
    stats.hands === 0
      ? `${view.ruleSet.edgePercent.toFixed(2)}%`
      : `${stats.effectiveHouseEdgePercent.toFixed(2)}%`;
  el('stat-units').textContent = `${stats.netUnits > 0 ? '+' : ''}${stats.netUnits}`;
  if (openInfo) showInfo(openInfo);
}

/*
 * What each figure means (§9.2).
 *
 * A metric nobody can explain is a metric nobody should trust, and three of
 * these four are easy to misread in the direction that flatters the player.
 * The definition opens where the number is rather than in a glossary, and the
 * accuracy panel also shows its own working — how many decisions, how many
 * close calls set aside — because that is the one people query.
 */
let openInfo = null;

function accuracyDetail(stats) {
  if (stats.decisions === 0) return '';
  const excluded = stats.closeCallsExcluded;
  const parts = [T('fb.accuracyCount', { right: stats.correct, total: stats.decisions })];
  if (excluded > 0) {
