const MESSAGES                            = { en: EN, he: HE };

/**
 * The catalogue as data, for the browser.
 *
 * The pages are classic scripts (no build step, so no bundler to pull a module
 * through), and the server hands them this table as `/i18n.js`. One catalogue,
 * two consumers — the alternative was a second copy in `public/` that would
 * drift the first time a string changed.
 */
function catalogue(locale        )            {
  return { ...EN, ...(MESSAGES[locale] ?? {}) };
}

/** Keys present in English but missing from another locale — used by a test. */
function missingKeys(locale        )           {
  const table = MESSAGES[locale] ?? {};
  return Object.keys(EN).filter((key) => table[key] === undefined);
}

/* ===== packages/trainer-web/src/explain.ts ===== */
/**
 * Plain-language explanations for the feedback card (spec §7.1 item 5, §3.4).
 *
 * "Wrong, you should have hit" teaches nothing, so §3.4 makes the reasoning the
 * requirement. This builds it as three steps, in the order a competent player
 * actually thinks:
 *
 *   1. Read the dealer — the upcard alone.
 *   2. Read your hand — the cards alone, with no dealer in the picture.
 *   3. Combine them — the verdict, and how big the edge really is.
 *
 * Two rules keep it honest, and both were learned from getting it wrong:
 *
 * **The supporting statistic must speak to the contest actually being graded.**
 * The old version picked its stat from the winning action's archetype, so
 * 15 against a ten was explained with "the dealer makes 17 or better 77% of the
 * time" — the argument against *standing*, which was never in contention at
 * −0.540. The real contest was hit (−0.504) against surrender (−0.500), and 77%
 * says nothing about that margin. So the stat is now chosen from the top two
 * actions by EV, never from the archetype.
 *
 * **The hand is read on its own terms, not by its total.** The old version
 * explained every split with one sentence, so A,A against a six came out as
 * "played as one hand this is a poor total" — which is false. Soft 12 hits for
 * +0.188, a winning hand. Aces split because the second ace is dead weight in one
 * hand, not because twelve is bad. Eights split to escape a sixteen. Deuces split
 * only when doubling after is allowed. Those are three different arguments and
 * they need three different sentences.
 */


const GERUND                                            = {
  hit: 'action.hitting',
  stand: 'action.standing',
  double: 'action.doubling',
  split: 'action.splitting',
  surrender: 'action.surrendering',
};

/** The verb as it appears mid-sentence: "hitting", "לקיחת קלף". */
function gerund(action                 , locale        )         {
  return t(locale, GERUND[action]);
}

/**
 * The form that follows "to" — English wants an infinitive, Hebrew a gerund.
 *
 * Insurance is in this family too. It is a `GradedAction` and not a
 * `BlackjackAction`, and when the type here was the narrower one the Hebrew
 * template `ל{runnerUpVerb}` rendered the literal `לverbTo.declineInsurance` on
 * screen: `t()` falls back to the key, so a missing member of a composed key
 * family is invisible to the compiler and glaring to the player.
 */
function verbAfterTo(action              , locale        )         {
  return t(locale, `verbTo.${action}`);
}

/** The imperative, for headlines and for opening a verdict. */
function verb(action              , locale        )         {
  return t(locale, `action.${action}`);
}

function actionName(action                 , locale         = 'en')         {
  return gerund(action, locale);
}

                             
                                                        
               
                                                           
                   
 

const dealerCache = new Map                    ();

/**
 * How the dealer's upcard actually behaves.
 *
 * Conditioned on the dealer not holding a natural, which is the number the
 * player is actually facing: in a peek game the dealer has already looked when
 * the decision is made. It matters for exactly two upcards — a ten busts 23% of
 * the time rather than 21%, and an ace 17% rather than 11.5%. Quoting the
 * unconditioned figure for an ace would be telling the player the dealer might
 * still have a blackjack that has already been ruled out.
 */
function dealerOdds(upcard        , rules                )             {
  const key = `${upcard}|${rules.decks}|${rules.soft17}|${rules.peek}`;
  const cached = dealerCache.get(key);
  if (cached) return cached;

  const shoe = Shoe.fresh(rules.decks);
  shoe.remove(upcard);
  const raw = new DealerSolver(rules).distribution(upcard, shoe);
  const natural = rules.peek ? raw[DEALER_BLACKJACK]  : 0;
  const scale = natural < 1 ? 1 / (1 - natural) : 1;
  const bust = raw[DEALER_BUST]  * scale;

  const odds             = { bust, madeHand: 1 - bust };
  dealerCache.set(key, odds);
  return odds;
}

const percent = (value        )         => `${Math.round(value * 100)}%`;

/**
 * A signed EV, with a real minus sign rather than a hyphen.
 *
 * The client renders numeric runs in the display face, so these read as figures
 * rather than as more prose.
 */
const units = (value        )         => `${value < 0 ? '−' : '+'}${Math.abs(value).toFixed(3)}`;

                               
              
               
               
 

const standCache = new Map                      ();

/**
 * What standing on a given total actually does against a given upcard.
 *
 * Needed because "standing only wins when the dealer breaks" is true of a stiff
 * and false of a pat hand — standing on twenty also beats every 17, 18 and 19 the
 * dealer makes, which is most of them. Quoting the bust rate for a twenty would
 * be quoting the wrong number entirely.
 */
function standOutcome(
  total        ,
  upcard        ,
  rules                ,
)               {
  const key = `${total}|${upcard}|${rules.decks}|${rules.soft17}|${rules.peek}`;
  const cached = standCache.get(key);
  if (cached) return cached;

  const shoe = Shoe.fresh(rules.decks);
  shoe.remove(upcard);
  const raw = new DealerSolver(rules).distribution(upcard, shoe);
  const natural = rules.peek ? raw[DEALER_BLACKJACK]  : 0;
  const scale = natural < 1 ? 1 / (1 - natural) : 1;

  let win = raw[DEALER_BUST]  * scale;
  let push = 0;
  let lose = rules.peek ? 0 : raw[DEALER_BLACKJACK] ;
  for (let dealerTotal = 17; dealerTotal <= 21; dealerTotal++) {
    const p = raw[dealerTotal - 16]  * scale;
    if (dealerTotal < total) win += p;
    else if (dealerTotal === total) push += p;
    else lose += p;
  }

  const outcome               = { win, push, lose };
  standCache.set(key, outcome);
  return outcome;
}

/** The upcard as it reads mid-sentence: "an ace", "a ten", "a 6". */
function upcardPhrase(upcard        , locale        )         {
  if (upcard === 0) return t(locale, 'upcard.ace');
  if (upcard === 9) return t(locale, 'upcard.ten');
  const rank = upcardLabel(upcard);
  // "An 8", not "A 8". English has exactly one of these among 2 through 9, and
  // the article belongs to the language rather than to this function, so it
  // stays in the catalogue.
  return t(locale, rank === '8' ? 'upcard.numberAn' : 'upcard.number', { rank });
}

function sentenceCase(text        )         {
  return text.charAt(0).toUpperCase() + text.slice(1);
}

/** Chance the next card busts a hard total. A soft hand cannot bust at all. */
function bustOnNextCard(scenario          , rules                )         {
  if (scenario.kind === 'soft' || scenario.total === undefined) return 0;
  const room = 21 - scenario.total;
  const shoe = Shoe.fresh(rules.decks);
  let busting = 0;
  for (let rank = 0; rank < 10; rank++) {
    const low = rank === 0 ? 1 : RANK_VALUE[rank] ; // an ace plays low when it must
    if (low > room) busting += shoe.count(rank);
  }
  return busting / shoe.total;
}

/**
 * How often one more card leaves this hand still wanting another.
 *
 * The whole question behind a double is whether one card finishes the hand.
 * From hard 8 it usually does not: seven of the thirteen ranks leave a total
 * under seventeen, a hand you would carry on drawing to and a hand doubling
 * forbids you to touch. From hard 11 almost every card finishes it, which is
 * why 11 doubles and 8 does not.
 *
 * A card that busts the hand is not counted here: a bust wants nothing, it is
 * simply over, and `bustOnNextCard` is the figure for that.
 */
function stillStiffAfterOneCard(scenario          , rules                )         {
  if (scenario.total === undefined) return 0;
  const soft = scenario.kind === 'soft';
  const shoe = Shoe.fresh(rules.decks);
  let stiff = 0;
  for (let rank = 0; rank < 10; rank++) {
    const value = RANK_VALUE[rank] ;
    let total = scenario.total + value;
    let usable = soft || rank === 0; // an ace we could still drop to one
    if (total > 21 && usable) {
      total -= 10;
      usable = false;
    }
    if (total <= 21 && total < 17) stiff += shoe.count(rank);
  }
  return stiff / shoe.total;
}

// --- Hand archetypes --------------------------------------------------------

/**
 * What the hand *wants*, independent of the dealer.
 *
 * Split pairs divide into three genuinely different arguments, which is the
 * distinction the previous single template destroyed.
 */
                       
                                                                 
                  
                                                               
                     
                                                                      
                     
                                                                         
               
                                       
                
                                                           
           
                                                                 
              
                                                            
               
                                                                     
               
                                                  
         
                                                      
           
                

function archetype(scenario          , evaluation                    )            {
  if (scenario.kind === 'insurance') return 'insurance';

  if (scenario.kind === 'pair') {
    const rank = scenario.pairRank ;
    if (evaluation.optimalAction !== 'split') return 'pair-never';
    if (rank === 0 || rank === 7) return 'split-always'; // aces and eights
    // A split that needs doubling afterwards to be worth it: the tell is that the
    // resulting hands want to double, which is what DAS pays for.
    if (rank === 1 || rank === 2 || rank === 5) return 'split-das'; // 2,2 3,3 6,6
    if (rank === 3 || rank === 4) return 'split-offensive'; // 4,4 5,5 — attacking
    return 'split-defensive'; // 7,7 9,9 — escaping a poor total
  }

  const total = scenario.total ?? 0;
  if (scenario.kind === 'soft') return total >= 18 ? 'soft-made' : 'soft-draw';
  if (total >= 17) return 'pat';
  if (total >= 12) return 'stiff';
  if (total >= 9) return 'doubling';
  return 'small';
}

// --- Step 1: read the dealer ------------------------------------------------

/** The upcard alone. No mention of the player's cards. */
function readDealer(upcard        , rules                , locale         = 'en')         {
  const odds = dealerOdds(upcard, rules);
  const up = upcardPhrase(upcard, locale);
  const bust = percent(odds.bust);

  if (upcard >= 1 && upcard <= 5) {
    const worst = upcard === 4 || upcard === 5 ? t(locale, 'dealer.worst') : '';
    return t(locale, 'dealer.bust', { up: sentenceCase(up), worst, bust });
  }
  if (upcard === 0) return t(locale, 'dealer.ace', { bust });
  return t(locale, 'dealer.strong', {
    up: sentenceCase(up),
    bust,
    made: percent(odds.madeHand),
  });
}

// --- Step 2: read your hand -------------------------------------------------

function pairName(rank        )         {
  const label = rank === 0 ? 'A' : rank === 9 ? '10' : rankLabel(rank);
  return `${label},${label}`;
}

/**
 * How often the hole card is a ten, and how often it would have to be.
 *
 * Both figures come from the shoe the chart is derived from — a fresh one with
 * the dealer's ace gone — rather than from the "barely three cards in thirteen"
 * that used to sit in the copy. That was simply wrong: four of the thirteen
 * ranks are worth ten, not three. Insurance is still a losing bet, and it is a
 * better lesson when the number stating so is right, because a player who checks
 * it and finds it false has been handed a reason to distrust everything else on
 * the card.
 *
 * The break-even point is a property of the 2:1 payout, not of the shoe: the bet
 * returns `2p - (1 - p)`, which is zero at exactly one in three.
 */
/** Insurance stakes half the original wager, which is where its EV is quoted from. */
const INSURANCE_STAKE = 0.5;

function insuranceOdds(rules                )                                      {
  const shoe = Shoe.fresh(rules.decks);
  shoe.remove(ACE); // the ace the player can see
  return { tens: shoe.probability(TEN), breakEven: 1 / 3 };
}

/**
 * The player's cards alone, with the dealer out of the picture.
 *
 * Every line says what the hand wants, and none of them names the verdict —
 * that is step 3's job.
 */
function readHand(
  scenario          ,
  evaluation                    ,
  rules                ,
  locale         = 'en',
)         {
  const kind = archetype(scenario, evaluation);
  const total = scenario.total ?? 0;

  switch (kind) {
    case 'insurance': {
      const odds = insuranceOdds(rules);
      return t(locale, 'hand.insurance', {
        tens: percent(odds.tens),
        breakEven: percent(odds.breakEven),
      });
    }

    case 'split-always': {
      const rank = scenario.pairRank ;
      return t(locale, rank === 0 ? 'hand.aces' : 'hand.eights');
    }

    case 'split-das':
      return t(locale, 'hand.splitDas', { pair: pairName(scenario.pairRank ) });

    case 'split-offensive':
      return t(locale, 'hand.splitOffensive', { pair: pairName(scenario.pairRank ) });

    case 'split-defensive':
      return t(locale, 'hand.splitDefensive', { pair: pairName(scenario.pairRank ) });

    case 'pair-never':
      return t(locale, 'hand.pairNever', { pair: pairName(scenario.pairRank ) });

    case 'stiff': {
      return t(locale, 'hand.stiff', {
        total,
        bust: percent(bustOnNextCard(scenario, rules)),
      });
    }

    case 'doubling':
      return t(locale, 'hand.doubling', { total });

    case 'soft-draw':
      return t(locale, 'hand.softDraw', { total });

    case 'soft-made':
      return t(locale, 'hand.softMade', { total });

    case 'pat':
      return t(locale, 'hand.pat', { total });

    default:
      return t(locale, 'hand.small', { total });
  }
}

// --- Step 3: combine them ---------------------------------------------------

                          
                                                
                                                           
              
 

/** The two actions actually in contention — which is what any stat must speak to. */
function contest(evaluation                    )          {
  const ranked = evaluation.legalActions
    .map((action) => ({ action, ev: evaluation.evByAction[action]  }))
    .sort((a, b) => b.ev - a.ev);
  const best = ranked[0] ;
  const runnerUp = ranked[1] ?? null;
  return { best, runnerUp, gap: runnerUp ? best.ev - runnerUp.ev : Infinity };
}

/** How decisive the call is, said honestly rather than by vibes. */
function describeGap(gap        , locale         = 'en')         {
  if (gap === Infinity) return t(locale, 'gap.only');
  if (gap > 0.2) return t(locale, 'gap.notClose');
  if (gap >= 0.05) return t(locale, 'gap.right');
  if (gap >= 0.01) return t(locale, 'gap.narrow');
  return t(locale, 'gap.coinflip');
}

/**
 * The statistic that speaks to why the best action beats the runner-up.
 *
 * Chosen from the contest, never from the archetype. A dealer-outcome figure is
 * only quoted when standing is one of the two actions in contention, because
 * that is the only time it is the argument.
 */
function supportingStat(
  scenario          ,
  { best, runnerUp }         ,
  rules                ,
  locale        ,
)         {
  if (!runnerUp) return '';

  /*
   * Insurance, stated on the money that is actually at risk.
   *
   * The gap above is in units of the main wager, and insurance stakes only half
   * of one — so a bet that loses about seven cents in every chip put on it comes
   * out as 0.037 and is described as "narrow". That word is true of the number
   * and wrong about the bet: this is a rule with no exceptions, not a close
   * call. Rather than carve a special case into the gap logic, which would then
   * describe one cell differently from the other 310, the sentence underneath
   * says what the same figure is as a share of the insurance stake.
   */
  if (scenario.kind === 'insurance') {
    const take = Math.min(best.ev, runnerUp.ev);
    return t(locale, 'stat.insurance', { pct: percent(Math.abs(take) / INSURANCE_STAKE) });
  }

  if (scenario.upcard === undefined) return '';
  const pair = new Set([best.action, runnerUp.action]);
  const odds = dealerOdds(scenario.upcard, rules);
  const up = upcardPhrase(scenario.upcard, locale);

  // Drawing a soft hand is free, which is the whole argument and one no
  // dealer-outcome figure expresses.
  if (pair.has('hit') && scenario.kind === 'soft') {
    return t(locale, 'stat.softDraw', { up });
  }

  // Standing is in contention: the dealer's own outcomes are the argument, but
  // which outcome depends entirely on whether the hand is a stiff or a pat one.
  if (pair.has('stand') && scenario.total !== undefined) {
    const outcome = standOutcome(scenario.total, scenario.upcard, rules);
    // Phrase this from the numbers, not the total: seventeen is pat and still
    // loses two hands in three against a ten, so "very little beats it" would be
    // nonsense for exactly the hand players most need talking out of.
    if (outcome.win > outcome.lose) {
      return t(locale, 'stat.standWins', {
        win: percent(outcome.win),
        lose: percent(outcome.lose),
      });
    }
    if (scenario.total >= 17) {
      return t(locale, 'stat.standBadPat', { lose: percent(outcome.lose) });
    }
    return t(locale, 'stat.standBreaks', { bust: percent(odds.bust) });
  }

  // Hitting against surrender: what the draw actually does to you.
  if (pair.has('hit') && pair.has('surrender')) {
    // The two EVs are already in the sentence above; repeating them here just
    // makes the line longer without adding anything.
    return t(locale, 'stat.hitVsSurrender', {
      bust: percent(bustOnNextCard(scenario, rules)),
    });
  }

  /*
   * Doubling against hitting. Which way round matters, and it used not to.
   *
   * One sentence served both sides: "one card is usually enough here". On 6♠ 2♣
   * against a 7 — where hitting is worth +0.084 and doubling −0.181 — the card
   * therefore argued for the very play it had just called a blunder. The two
   * cases are opposite arguments and need opposite sentences.
   */
  if (pair.has('double') && pair.has('hit')) {
    if (best.action === 'double') return t(locale, 'stat.double');
    return t(locale, 'stat.doubleTooThin', {
      stiff: percent(stillStiffAfterOneCard(scenario, rules)),
    });
  }

  // Splitting against playing it as one hand. Which way round matters: the same
  // sentence cannot serve both "split gains" and "split gives away".
  if (pair.has('split')) {
    const gap = Math.abs(best.ev - runnerUp.ev).toFixed(3);
    return t(locale, best.action === 'split' ? 'stat.splitGains' : 'stat.splitCosts', { gap });
  }

  if (pair.has('surrender')) {
    return t(locale, 'stat.surrender', { half: units(-0.5) });
  }
  return '';
}

/** Step 3: the verdict, why the two readings point to it, and the size of the edge. */
function readCombined(
  scenario          ,
  evaluation                    ,
  rules                ,
  locale         = 'en',
  chosen               ,
)         {
  const c = contest(evaluation);
  const numbers =
    c.runnerUp === null
      ? t(locale, 'combined.numbersOnly', { best: units(c.best.ev) })
      : t(locale, 'combined.numbers', {
          best: units(c.best.ev),
          runnerUp: units(c.runnerUp.ev),
          runnerUpVerb: verbAfterTo(c.runnerUp.action, locale),
        });

  /*
   * A missed double is not a missed hand, and saying so is the point.
   *
   * Both lines draw the same next card, so the hand the player ends up holding
   * is very often identical either way — what separates them is the size of the
   * bet on it. A player who hits a correct double has not misread the spot; he
   * has declined a raise the numbers told him to make, and the cost sits
   * entirely in the stake. That is a different lesson from "you played the wrong
   * card", and it only lands when he actually declined, so it is appended only
   * then rather than being folded into the standing double sentence.
   */
  let stat = supportingStat(scenario, c, rules, locale);
  if (c.best.action === 'double' && chosen !== undefined && chosen !== 'double') {
    const missed = t(locale, 'stat.doubleMissed');
    // Against hitting, the standing double sentence makes the same point in the
    // abstract, so it gives way rather than saying it twice. Against any other
    // runner-up it is a separate argument and both are worth having.
    const sameGround = c.runnerUp !== null && c.runnerUp.action === 'hit';
    stat = sameGround ? missed : `${stat} ${missed}`.trim();
  }

  return t(locale, 'combined', {
    verdict: verb(c.best.action, locale),
    shape: describeGap(c.gap, locale),
    numbers,
    stat,
  }).trim();
}

// --- The whole reveal -------------------------------------------------------

                              
                                                                            
                   
                                  
                                                                             
              
 

function handLabel(scenario          )         {
  if (scenario.kind === 'insurance') return 'Insurance';
  if (scenario.kind === 'pair') return pairName(scenario.pairRank );
  if (scenario.kind === 'soft') return `A,${(scenario.total ?? 0) - 11}`;
  return String(scenario.total);
}

function explain(
  scenario          ,
  evaluation                    ,
  rules                ,
  locale         = 'en',
  /** What the player actually did, when the explanation follows a decision. */
  chosen               ,
)              {
  const c = contest(evaluation);
  const verdict = verb(c.best.action, locale);

  if (scenario.kind === 'insurance' || scenario.upcard === undefined) {
    return {
      headline: t(locale, 'headline.insurance', { verdict }),
      steps: [
        t(locale, 'insurance.step1'),
        readHand(scenario, evaluation, rules, locale),
        readCombined(scenario, evaluation, rules, locale, chosen),
      ],
      gap: c.gap,
    };
  }

  return {
    headline: t(locale, 'headline', {
      hand: handLabel(scenario),
      up: upcardLabel(scenario.upcard),
      verdict,
    }),
    steps: [
      readDealer(scenario.upcard, rules, locale),
      readHand(scenario, evaluation, rules, locale),
      readCombined(scenario, evaluation, rules, locale, chosen),
    ],
    gap: c.gap,
  };
}

/* ===== packages/trainer-web/src/difficulty.ts ===== */
/**
 * Scenario difficulty and the player's rating (docs/elo-difficulty.md).
 *
 * The first working slice of the design: the difficulty functions and the Elo
 * update. The adaptive *selector* is deliberately absent — that needs the
 * shipped frequency asset and a drill dealer, and it must live somewhere the
 * §14.3 simulation cannot reach.
 *
 * Two rules from the design are load-bearing and implemented here:
 *
 *   - **Off-grid decisions never score.** Hard 18 through 21 have no chart cell
 *     (`HARD_TOTALS` stops at 17) yet `scenarioKeyForHand` produces those keys
 *     constantly — around 15% of real decisions. Standing on 19 is trivially
 *     correct, so rating them would hand every player a stream of free points.
 *   - **Partial credit scales S, never K.** Putting severity in the K-factor
 *     would make the equilibrium rating depend on the K schedule, so the number
 *     would change meaning whenever K was retuned.
 */

/** Player noise temperature for the expected-leak model. */
const TAU = 0.05;

/** Fitted on three rule sets; they varied under 5%, so they are constants. */
const MODES                                                                      = {
  basic: { slope: 700, centre: -2.2 },
  recall: { slope: 660, centre: 0.64 },
  value: { slope: 450, centre: -2.05 },
};

/** Natural frequency of each opening scenario, per 1000 hands. */
function naturalFrequency(rules                )                      {
  const counts = Array.from({ length: 10 }, (_, r) =>
    r === 9 ? rules.decks * 16 : rules.decks * 4,
  );
  const n = rules.decks * 52;
  const out = new Map                ();
  for (let a = 0; a < 10; a++) {
    for (let b = a; b < 10; b++) {
      for (let u = 0; u < 10; u++) {
        const na = counts[a] ;
        const nb = a === b ? counts[b]  - 1 : counts[b] ;
        const nu = counts[u]  - (u === a ? 1 : 0) - (u === b ? 1 : 0);
        if (nb <= 0 || nu <= 0) continue;
        const ways = (a === b ? na * nb : 2 * na * nb) * nu;
        const key = scenarioKey(scenarioForHand([a, b], u, a === b));
        const per1000 = (ways / (n * (n - 1) * (n - 2))) * 1000;
        out.set(key, (out.get(key) ?? 0) + per1000);
      }
    }
  }
  // Insurance is not an opening two-card scenario, so the loop above never
  // produces its key. It is offered whenever the dealer shows an ace, which is
  // one hand in thirteen.
  out.set('bj:insurance', (counts[0]  / n) * 1000);
  return out;
}

/**
 * Expected units given up by a noisy player, per encounter.
 *
 * Neither margin nor evCost answers "what does not knowing this cell cost":
 * margin is the cost of the least-bad error, which rates hard 17 against a six
 * as catastrophic when nobody hits a 17 against a six. This weights each action
 * by how plausibly it gets chosen.
 *
 * It is humped in margin, peaking near 0.06 — razor-thin cells cost nothing to
 * miss, obvious ones are never missed, and the money is in the middle.
 */
function expectedLeak(evByAction                                 )         {
  const evs = Object.values(evByAction).filter((v)              => v !== undefined);
  if (evs.length === 0) return 0;
  const best = Math.max(...evs);
  const weights = evs.map((ev) => Math.exp((ev - best) / TAU));
  const total = weights.reduce((a, b) => a + b, 0);
  return evs.reduce((acc, ev, i) => acc + (weights[i]  / total) * (best - ev), 0);
}

                                     
                      
                 
               
                      
                
                 
                
 

const cache = new Map                                         ();

const clamp = (x        ) => Math.max(800, Math.min(2200, Math.round(x / 5) * 5));

/** Difficulty for every chart cell, in all three modes. Memoised per rule set. */
function difficultyTable(
  rules                ,
  chart               ,
)                                  {
  const cached = cache.get(chart.rulesKey);
  if (cached) return cached;

  const frequency = naturalFrequency(rules);
  const table = new Map                            ();

  for (const [key, cell] of chart.cells) {
    const leak = expectedLeak(cell.evByAction);
    const perThousand = frequency.get(key) ?? 0.15;
    const m = cell.margin;

    const basicX = Math.log10(leak + 3e-4);
    const recallX = -Math.log10(m + 0.004) - 0.5 * Math.log10(perThousand + 0.15);
    const valueX = Math.log10((leak + 3e-4) * (perThousand + 0.15));

    table.set(key, {
      scenarioKey: key,
      margin: m,
      leak,
      perThousand,
      basic: clamp(1500 + MODES.basic.slope * (basicX - MODES.basic.centre)),
      recall: clamp(1500 + MODES.recall.slope * (recallX - MODES.recall.centre)),
      value: clamp(1500 + MODES.value.slope * (valueX - MODES.value.centre)),
    });
  }

  cache.set(chart.rulesKey, table);
  return table;
}

/** Partial credit by severity. Errors are graded by cost, never binary (§3.2). */
function scoreFor(severity              )         {
  switch (severity) {
    case 'optimal':
      return 1;
    case 'negligible':
      return 0.5;
    case 'minor':
      return 0.25;
    default:
      return 0;
  }
}

function kFactor(ratedDecisions        )         {
  if (ratedDecisions < 30) return 40;
  if (ratedDecisions < 150) return 24;
  if (ratedDecisions < 600) return 16;
  return 10; // never lower: a rating that only climbs is the ratchet §16 forbids
}

function expectedScore(playerRating        , handRating        )         {
  return 1 / (1 + 10 ** ((handRating - playerRating) / 400));
}

                         
                       
                 
               
                         
                       
                       
 

function newRating(mode                 = 'basic')         {
  return { mode, rating: 1200, peak: 1200, ratedDecisions: 0, provisional: true, sessionDelta: 0 };
}

/** One decision's worth of movement. Returns the change, for display. */
function updateRating(
  rating        ,
  handRating        ,
  severity              ,
)         {
  const expected = expectedScore(rating.rating, handRating);
  const k = kFactor(rating.ratedDecisions);
  const delta = k * (scoreFor(severity) - expected);

  rating.rating = Math.max(800, Math.min(2200, rating.rating + delta));
  rating.ratedDecisions++;
  rating.provisional = rating.ratedDecisions < 30;
  rating.peak = Math.max(rating.peak, rating.rating);
  rating.sessionDelta += delta;
  return delta;
}

/**
 * Rule-sensitivity flags for the feedback card (spec §7.1 item 6, §3.3).
 *
 * "The right play changes with the rule set. Doubling 11 against a dealer Ace is
 * correct when the dealer hits soft 17 and wrong when the dealer stands. A
 * trainer that teaches one chart as universal truth teaches a bug."
 *
 * So whenever the answer in front of the player would flip under a rule set they
 * are likely to sit down at, the card says so. The comparison is done by
 * deriving the other chart and reading the cell, not by keeping a list of famous
 * exceptions — the same reason the engine derives charts at all.
 */

const charts = new Map                       ();

function chartFor(rules                )                {
  const key = rulesKey(rules);
  let chart = charts.get(key);
  if (!chart) {
    chart = deriveChart(rules, { cardRemoval: 'static-dealer' });
    charts.set(key, chart);
  }
  return chart;
}

/** The rule changes worth checking against: the ones players actually meet. */
const VARIANTS                                                                                     = [
  {
    label: 'if the dealer stood on soft 17',
    apply: (rules) => makeRules({ ...rules, soft17: 'S17' }),
  },
  {
    label: 'if the dealer hit soft 17',
    apply: (rules) => makeRules({ ...rules, soft17: 'H17' }),
  },
  {
    label: 'without late surrender',
    apply: (rules) => makeRules({ ...rules, surrender: 'none' }),
  },
  {
    label: 'with late surrender available',
    apply: (rules) => makeRules({ ...rules, surrender: 'late' }),
  },
  {
    label: 'without double after split',
    apply: (rules) => makeRules({ ...rules, das: false }),
  },
  {
    label: 'in a no-hole-card game',
    apply: (rules) => makeRules({ ...rules, peek: false }),
  },
];

                                  
                
                          
                 
 

/**
 * Rule sets under which this same spot has a different answer.
 *
 * Only genuinely different rule sets are compared — asking what H17 says when
 * H17 is already in play would flag every cell in the chart.
 */
function ruleSensitivity(
  scenarioKey        ,
  rules                ,
  optimal              ,
)                    {
  // Insurance is the same side bet under every rule set in the list below, so
  // there is nothing to compare. The caller already skips it; this makes the
  // answer true rather than merely unreached.
  if (!isHandAction(optimal)) return [];
  const activeKey = rulesKey(rules);
  const notes                    = [];
  const seen = new Set        ();

  for (const variant of VARIANTS) {
    const other = variant.apply(rules);
    const key = rulesKey(other);
    if (key === activeKey || seen.has(key)) continue;
    seen.add(key);

    const cell = chartFor(other).cells.get(scenarioKey);
    if (!cell || cell.optimalAction === optimal) continue;
    if (!isHandAction(cell.optimalAction)) continue;
    notes.push({
      label: variant.label,
      action: cell.optimalAction,
      letter: ACTION_LETTERS[cell.optimalAction],
    });
  }
  return notes;
}

function bandFor(rating        )           {
  if (rating >= 1700) return 'brutal';

 * without dealing a card.

function advanceStreak(
  current        ,
  outcome                                          ,
)         {
  if (outcome.closeCall) return current;
  return outcome.correct ? current + 1 : 0;
}

/** Two significant figures, so a rounded number reads as one. */
function roundish(value        )         {
  if (value < 10) return Math.max(1, Math.round(value));
  const scale = 10 ** (Math.floor(Math.log10(value)) - 1);
  return Math.round(value / scale) * scale;
}

function describeSpot(cell                    , rating        )                  {
  const difficulty = cell[rating.mode];
  const band = bandFor(difficulty);
  return {
    mode: rating.mode,
    rating: Math.round(difficulty),
    band,
    // Rounded to two figures, because the sentence says "about". "One hand in
    // 1,135" claims a precision the word in front of it disclaims.
    oneIn: roundish(1000 / Math.max(cell.perThousand, 0.01)),
    aboveYou: !rating.provisional && difficulty >= rating.rating + 100,
    hard: band === 'tricky' || band === 'brutal',
  };
}

   * Two house restrictions the player can switch on over any preset.
   *
   * They are rules, not display filters: they go into the rule set the solver
   * memoises on, so the chart is re-derived, the house edge is recomputed, and
   * every recursive sub-decision inside a split or a double is answered under
   * the same restriction. Hiding a button would have graded the player against
   * a game nobody was playing.
   */
          restrictions               = { noSurrender: false, likeRanksOnly: false };

  constructor(
    presetId = 'vegas-strip-6d-s17',
    seed = Date.now() % 2147483647,
    restrictions               = { noSurrender: false, likeRanksOnly: false },
  ) {
    this.presetId = presetId;
    this.restrictions = restrictions;
    this.rules = applyRestrictions(getPreset(presetId).rules, restrictions);
    this.baseEdgePercent = houseEdge(this.rules).percent;
    chartFor(this.rules); // derive once, up front, so the first decision is not slow
    this.table = new BlackjackTable({ rules: this.rules, seed, grading: 'chart' });
  }

  get ruleSet()   
               
                 
                  
                        
                        
                                     
                               
    {
    const preset = RULE_PRESETS.find((p) => p.id === this.presetId) ;
    const rules = this.rules;
    const badge = [
      `${rules.decks}D`,
      rules.soft17,
      rules.das ? 'DAS' : 'no DAS',
      rules.surrender === 'none' ? 'no surrender' : `${rules.surrender} surrender`,
      rules.splitUnlikeTens ? '' : 'like ranks only',
      rules.blackjackPayout,
      rules.peek ? '' : 'no hole card',
    ]
      .filter(Boolean)
      .join(' · ');
    return {
      id: preset.id,
      name: preset.name,
      badge,
      note: preset.note ?? null,
      edgePercent: this.baseEdgePercent,
      // What a natural actually pays, for the one line on screen that quotes it.
      blackjackPayout: rules.blackjackPayout,
      restrictions: this.restrictions,
    };
  }

  deal()       {
    this.table.startHand(1);
    this.lastFeedback = null;
    this.lastRatingDelta = null;
    // A milestone belongs to the decision that reached it, not to the run.
    this.streakMilestone = null;
    this.pending = [];
    this.settleIfDone();
  }

  act(action                 )          {
    this.counterFavoured = false;
    const record = this.table.act(action);
    this.absorb(record);
    this.settleIfDone();
    return this.lastFeedback;
  }

  insurance(take         )          {
    /*
     * What the shoe actually held, read before the decision closes the phase.
     *
     * It never touches the grade, the cost or the rating — those come from the
     * chart, because the chart is what the app teaches. It exists so that the
     * one hand in a few hundred where the count really did call for insurance
     * is not silently contradicted: a player who has read anything about
     * counting deserves to be told that this was that hand, rather than left to
     * conclude the app does not know.
     */
    this.counterFavoured = this.table.insuranceLiveEv() > 0;
    const record = this.table.takeInsurance(take);
    this.absorb(record);
    this.settleIfDone();
    return this.lastFeedback;
  }

  /**
   * The gap below which a decision is treated as a coin-flip.
   *
   * Two actions this close are within the noise of what basic strategy even
   * claims, and counting a miss on one as a full error makes a player who nails
   * every expensive decision look worse than one who gets the trivia right —
   * backwards for a trainer. They are excluded from the accuracy denominator
   * only: they still count toward mastery, the drill queue and the rating, since
   * those are exactly the cells a serious player most wants to own.
   */
          static          CLOSE_CALL = 0.01;

  /**
   * What the player sits down with, in units of the base bet.
   *
   * The engine reasons in units of the wager and always will — that is what
   * makes an EV comparable between a one-chip hand and a doubled one. The stack
   * is the same number given a rail to sit on, so a hand feels like a hand
   * rather than an exercise. Two hundred is chosen so an ordinary bad run moves
   * it visibly without emptying it, which is the only thing the figure has to do.
   */
          static          STARTING_STACK = 200;

  /**
   * Whether the live shoe favoured insurance on the decision just taken. Text
   * only — see `insurance()`.
   */
          counterFavoured = false;

  /** Turn one graded decision into the feedback card §7.1 describes. */
          absorb(record                )       {
    this.lastRecord = record;
    const scenario =
      record.scenarioKey === 'bj:insurance'
        ? ({ kind: 'insurance' }         )
        : parseScenarioKey(record.scenarioKey);

    // The explanation layer needs the whole EV vector, not just the winner: the
    // statistic it quotes has to speak to the contest between the top two
    // actions, and it cannot find the runner-up without them.
    const evaluation = {
      legalActions: record.legalActions                     ,
      evByAction: record.evByAction                                            ,
      optimalAction: record.optimalAction                   ,
      optimalEv: record.evByAction[record.optimalAction] ?? 0,
    };

    const explanation = explain(
      scenario,
      evaluation,
      this.rules,
      this.locale,
      record.chosenAction                   ,
    );
    const closeCall = explanation.gap < TrainerSession.CLOSE_CALL;
    const correct = record.evCost === 0;

    /*
     * How hard this spot is, looked up once and used three times.
     *
     * It has to come before the counters because the streak wants to know
     * whether the run included any hard hands, and before `updateRating`
     * because that mutates the rating this comparison reads. Off the 311-cell
     * grid — hard 18 through 21, which turn up constantly and are trivially
     * correct — there is no cell and nothing to rate.
     */
    const chart = chartFor(this.rules);
    const cell = difficultyTable(this.rules, chart).get(record.scenarioKey);
    const spot = cell === undefined ? null : describeSpot(cell, this.rating);

    this.decisions++;
    if (correct) this.correct++;
    this.evLost += record.evCost;
    this.bySeverity[record.severityTier]++;
    if (closeCall) {
      this.closeCalls++;
      if (correct) this.closeCallsCorrect++;
    }

    /*
     * The run of correct decisions.
     *
     * A close call neither extends it nor breaks it — the same exclusion the
     * accuracy denominator makes (§9.2), which lets the whole rule be stated in
     * one verifiable sentence: the accuracy numerator, run consecutively.
     * Breaking a thirty-run on a hand the accuracy panel says does not count
     * would be indefensible; letting one extend the run would grow it on
     * coin-flips, which is the free-points ratchet §16 forbids.
     */
    const before = this.streak;
    this.streak = advanceStreak(this.streak, { correct, closeCall });
    if (this.streak === 0) this.streakHard = 0;
    else if (this.streak > before && spot?.hard) this.streakHard++;
    this.streakBest = Math.max(this.streakBest, this.streak);
    this.streakMilestone =
      this.streak > before && STREAK_MILESTONES.includes(this.streak) ? this.streak : null;

    const ranked = record.legalActions
      .map((action) => ({
        action,
        label: prettyAction(action, this.locale),
        ev: record.evByAction[action] ?? 0,
      }))
      .sort((a, b) => b.ev - a.ev);

    const sensitivity                    =
      scenario.kind === 'insurance'
        ? []
        : ruleSensitivity(record.scenarioKey, this.rules, evaluation.optimalAction);

    // Last, because it moves the rating every comparison above had to read.
    this.lifetimeDecisions++;
    this.lastRatingDelta = cell
      ? updateRating(this.ratings[this.mode], cell[this.mode], record.severityTier)
      : null;

    this.pending.push({
      scenarioKey: record.scenarioKey,
      headline: explanation.headline,
      chosen: prettyAction(record.chosenAction, this.locale),
      optimal: prettyAction(record.optimalAction, this.locale),
      correct,
      evCost: record.evCost,
      severity: record.severityTier,
      closeCall,
      spot,
      steps: [...explanation.steps],
      ranked: ranked.map((r) => ({ action: r.action, ev: r.ev })),
    });

    const stat = this.scenarioStats.get(record.scenarioKey) ?? {
      scenarioKey: record.scenarioKey,
      attempts: 0,
      correct: 0,
      consecutiveCorrect: 0,
      evCostTotal: 0,
      confusion: {},
      lastAttemptAt: 0,
    };
    stat.attempts++;
    stat.evCostTotal += record.evCost;
    stat.lastAttemptAt = this.clock++;
    if (record.evCost === 0) {
      stat.correct++;
      stat.consecutiveCorrect++;
    } else {
      stat.consecutiveCorrect = 0;
      stat.confusion[record.chosenAction] = (stat.confusion[record.chosenAction] ?? 0) + 1;
    }
    this.scenarioStats.set(record.scenarioKey, stat);

    this.lastFeedback = {
      scenarioKey: record.scenarioKey,
      // Anchors every step of the reveal to what was actually decided, which
      // matters once a split has replaced the hand on the board with two others.
      headline: explanation.headline,
      steps: explanation.steps,
      gap: explanation.gap,
      closeCall,
      correct,
      severity: record.severityTier,
      // How hard the spot was, and the run it belongs to — both about the
      // decision, both known before a single card of the outcome is turned.
      spot,
      ratingDelta: this.lastRatingDelta,
      streak: { current: this.streak, best: this.streakBest, hard: this.streakHard },
      milestone: this.streakMilestone,
      chosen: record.chosenAction,
      chosenLabel: prettyAction(record.chosenAction, this.locale),
      optimal: record.optimalAction,
      optimalLabel: prettyAction(record.optimalAction, this.locale),
      optimalVerb:
        record.scenarioKey === 'bj:insurance'
          ? prettyAction(record.optimalAction, this.locale)
          : actionName(record.optimalAction                   , this.locale),
      evCost: record.evCost,
      counterNote: this.counterNote(record),
      ranked,
      sensitivity,
    };
  }

  /** The card-counter remark, or nothing at all. Costs and rating never see it. */
          counterNote(record                )                {
    if (record.scenarioKey !== 'bj:insurance' || !this.counterFavoured) return null;
    return t(this.locale, 'insurance.counterNote');
  }

  /**
   * Fold a finished hand into the session totals exactly once — and keep it.
   *
   * This used to read `id` and `netUnits` off the record and throw the rest
   * away on the next deal, which is why there was no hand log, no mastery grid
   * and no way to build a rating. The record is complete and replayable; the
   * only thing that was missing was somewhere to put it.
   */
          settleIfDone()       {
    if (this.table.view.phase !== 'settled') return;
    const record = this.table.handRecord;
    if (record.id === this.countedHand) return;
    this.countedHand = record.id;
    this.hands++;
    this.netUnits += record.netUnits;

    this.history.unshift({
      id: record.id,
      dealtCards: [...record.dealtCards],
      playerHands: record.playerCards.map((hand) => hand.map(cardView)),
      dealerCards: record.dealerCards.map(cardView),
      netUnits: record.netUnits,
      insuranceTaken: record.insuranceTaken,
      decisions: this.pending,
    });
    this.pending = [];
  }

  get stats()               {
    // Close calls leave the denominator with their outcomes, so a player is
    // neither rewarded nor punished for guessing them.
    const graded = this.decisions - this.closeCalls;
    const gradedCorrect = this.correct - this.closeCallsCorrect;
    const accuracy = graded === 0 ? 1 : gradedCorrect / graded;
    const evLostPer100 = this.hands === 0 ? 0 : (this.evLost / this.hands) * 100;
    return {
      hands: this.hands,
      decisions: this.decisions,
      correct: this.correct,
      accuracy,
      closeCallsExcluded: this.closeCalls,
      accuracyIncludingCloseCalls: this.decisions === 0 ? 1 : this.correct / this.decisions,
      evLost: this.evLost,
      evLostPer100,
      bySeverity: { ...this.bySeverity },
      // Spec §9.2: what the game costs plus what the player costs themselves,
      // expressed as the single number that actually applies to them.
      effectiveHouseEdgePercent:
        this.baseEdgePercent + (this.hands === 0 ? 0 : (this.evLost / this.hands) * 100),
      netUnits: this.netUnits,
    };
  }

  /** Everything the client needs to draw the table. */
  get view()          {
    const view = this.table.view;
    const settled = view.phase === 'settled';
    return {
      phase: view.phase,
      hands: view.hands.map((hand, index) => ({
        cards: hand.cards.map(cardView),
        total: totalOf(hand.cards),
        bet: hand.bet,
        doubled: hand.doubled,
        surrendered: hand.surrendered,
        finished: hand.finished,
        net: hand.net,
        active: !settled && index === view.activeHandIndex,
      })),
      dealer: {
        cards: view.dealerVisible.map(cardView),
        hidden: !view.dealerRevealed,
        total: view.dealerRevealed ? totalOf(view.dealerVisible) : null,
        // The dealer only plays out when a hand is still live. Showing a bare
        // "DEALER · 12" after the player busts reads as "I would have won by
        // standing", when in fact a twelve is forced to draw and reaches 17 or
        // better most of the time. Say so rather than letting the total imply it.
        didNotDraw:
          settled &&
          view.hands.every(
            (hand) => hand.surrendered || totalOf(hand.cards) > 21,
          ),
      },
      legalActions: view.legalActions,
      insuranceOffered: view.phase === 'insurance',
      netUnits: view.netUnits,
      stack: {
        start: TrainerSession.STARTING_STACK,
        // Settled hands only. A wager still on the felt has not been lost yet,
        // and showing it as though it had would misreport the one figure on
        // screen that is supposed to be simple arithmetic.
        balance: TrainerSession.STARTING_STACK + this.netUnits,
        // Swept the moment the hand settles, because by then it has already
        // moved into the balance — leaving it on the felt would show the same
        // chips in two places and make the arithmetic look wrong.
        wager: settled
          ? 0
          : view.hands.reduce((total, hand) => total + hand.bet, 0) +
            (view.insuranceTaken ? 0.5 : 0),
        lastNet: view.netUnits,
      },
      feedback: this.lastFeedback,
      rating: { ...this.rating, lastDelta: this.lastRatingDelta },
      history: this.history.slice(0, 40),
      stats: this.stats,
      ruleSet: this.ruleSet,
    };
  }

  /** Finished hands, newest first — the reviewable record of the session. */
  get hands_()               {
    return this.history;
  }

  /**
   * Scenarios ranked by §9.3's weighting: error rate × how often the spot comes
   * up × what the average error costs. A rare cheap mistake matters less than a
   * common expensive one.
   */
  get weakSpots()          {
    const chart = chartFor(this.rules);
    return [...this.scenarioStats.values()]
      .filter((stat) => stat.attempts > stat.correct)
      .map((stat) => {
        const errors = stat.attempts - stat.correct;
        const errorRate = errors / stat.attempts;
        const averageCost = stat.evCostTotal / stat.attempts;
        const cell = chart.cells.get(stat.scenarioKey);
        return {
          scenarioKey: stat.scenarioKey,
          attempts: stat.attempts,
          errors,
          errorRate,
          averageCost,
          optimal: cell?.optimalAction ?? null,
          confusion: stat.confusion,
          // §9.3's product. Frequency is not shipped yet, so this is the two
          // terms that exist; the third lands with the frequency asset.
          weight: errorRate * averageCost,
        };
      })
      .sort((a, b) => b.weight - a.weight)
      .slice(0, 10);
  }

  /**
   * What the dealer can be asked, and what she answers.
   *
   * §3.1 constrains this: before the decision she may state facts — how often
   * she breaks, how often you break, what the two candidate plays are worth —
   * but not name the best one. "Why?" and the rule-sensitivity flag give the
   * answer away, so they are held back until the decision is made. Guided mode
   * (§8) is where the answer comes early, and this is not it.
   */
  get coach()          {
    const view = this.table.view;
    const asks                                                          = [];

    if (view.phase === 'player') {
      const upcard = bjRankOfCard(view.dealerVisible[0] );
      const hand = view.hands[view.activeHandIndex] ;
      const scenario = parseScenarioKey(
        scenarioKeyForHand(
          hand.cards.map(bjRankOfCard),
          upcard,
          view.legalActions.includes('split'),
        ),
      );
      const odds = dealerOdds(upcard, this.rules);
      const bust = bustOnNextCard(scenario, this.rules);
      const evaluation = this.table.currentEvaluation();
      const ranked = view.legalActions
        .map((action) => ({ action, ev: evaluation.evByAction[action] ?? 0 }))
        .sort((a, b) => b.ev - a.ev);

      asks.push({
        id: 'odds',
        question: t(this.locale, 'coach.q.odds'),
        answer:
          t(this.locale, 'coach.a.odds', {
            bust: Math.round(odds.bust * 100),
            made: Math.round(odds.madeHand * 100),
          }) +
          ' ' +
          (bust > 0
            ? t(this.locale, 'coach.a.oddsYouBreak', { bust: Math.round(bust * 100) })
            : t(this.locale, 'coach.a.oddsNoBreak')),
      });

      // The spread between the two candidates, without naming which is which:
      // a fact about the hand, not the answer to it.
      if (ranked.length >= 2) {
        const spread = Math.abs(ranked[0] .ev - ranked[1] .ev);
        asks.push({
          id: 'close',
          question: t(this.locale, 'coach.q.close'),
          answer:
            spread < 0.01
              ? t(this.locale, 'coach.a.closeVery')
              : t(this.locale, spread < 0.05 ? 'coach.a.closeSome' : 'coach.a.closeNot', {
                  spread: spread.toFixed(3),
                }),
        });
      }
      return { phase: 'player', asks, prompt: this.prompt(scenario, view.legalActions.length) };
    }

    if (view.phase === 'insurance') {
      // The same two figures the feedback card quotes, from the same place, so
      // the coach and the verdict cannot disagree about the odds.
      const odds = insuranceOdds(this.rules);
      const pct = (value        ) => `${Math.round(value * 100)}%`;
      return {
        phase: 'insurance',
        prompt: t(this.locale, 'coach.insurance.prompt'),
        asks: [
          {
            id: 'odds',
            question: t(this.locale, 'coach.q.odds'),
            answer: t(this.locale, 'coach.insurance.odds', {
              tens: pct(odds.tens),
              breakEven: pct(odds.breakEven),
            }),
          },
        ],
      };
    }

    return { phase: view.phase, prompt: null, asks: [] };
  }

  /** A line naming the spot, without hinting at the answer. */
          prompt(scenario                                     , choices        )         {
    const label =
      scenario.kind === 'pair'
        ? t(this.locale, 'label.pair')
        : scenario.kind === 'soft'
          ? t(this.locale, 'label.soft', { total: scenario.total ?? 0 })
          : t(this.locale, 'label.hard', { total: scenario.total ?? 0 });
    if (scenario.kind === 'pair') return t(this.locale, 'coach.prompt.pair');
    return t(this.locale, choices <= 2 ? 'coach.prompt.few' : 'coach.prompt.open', { label });
  }

  /** Everything the home screen needs. */
  get profile()          {
    const chart = chartFor(this.rules);
    const table = difficultyTable(this.rules, chart);
    const ladderKeys = [
      'bj:pairT:vs9',
      'bj:hard12:vs10',
      'bj:pair8:vs6',
      'bj:hard16:vs10',
      'bj:soft18:vs9',
      'bj:hard15:vs10',
      'bj:soft13:vs5',
    ];
    const ladder = ladderKeys
      .map((key) => {
        const d = table.get(key);
        const cell = chart.cells.get(key);
        if (!d || !cell) return null;
        return {
          scenarioKey: key,
          label: describeScenarioKey(key, this.locale),
          difficulty: d[this.mode],
          margin: d.margin,
          optimal: cell.optimalAction,
          oneIn: Math.round(1000 / Math.max(d.perThousand, 0.01)),
        };
      })
      .filter((row)                                 => row !== null)
      .sort((a, b) => a.difficulty - b.difficulty);

    return {
      player: { name: this.playerName },
      locale: this.locale,
      rating: { ...this.rating, lastDelta: this.lastRatingDelta },
      stats: this.stats,
      ruleSet: this.ruleSet,
      ladder,
    };
  }

  setPlayerName(name        )       {
    const trimmed = name.trim();
    if (trimmed.length > 0) this.playerName = trimmed.slice(0, 24);
  }


  /**
   * Everything a player has earned, in a form that survives the tab closing.
   *
   * The rating is the point. It is built one decision at a time over hundreds of
   * hands, and until now it started again from 1200 every time the page was
   * opened — which made it a score for the last twenty minutes rather than a
   * measure of anyone's play, and put a number on the shared table that meant
   * nothing.
   *
   * Deliberately excluded: the hand in progress, the card currently on screen,
   * and the shoe. A restored session begins between hands, which is the only
   * boundary where resuming is unambiguous — half a split restored into a
   * freshly shuffled shoe would be a different hand wearing the same cards.
   */
  get progress()                    {
    return {
      version: 3,
      name: this.playerName,
      hands: this.hands,
      decisions: this.decisions,
      correct: this.correct,
      evLost: this.evLost,
      netUnits: this.netUnits,
      closeCalls: this.closeCalls,
      closeCallsCorrect: this.closeCallsCorrect,
      lifetimeDecisions: this.lifetimeDecisions,
      bySeverity: { ...this.bySeverity },
      mode: this.mode,
      ratings: {
        basic: { ...this.ratings.basic },
        recall: { ...this.ratings.recall },
        value: { ...this.ratings.value },
      },
      scenarioStats: [...this.scenarioStats.values()],
      history: this.history.slice(0, 40),
    };
  }

  /**
   * Put a saved session back.
   *
   * Ignores anything it does not recognise rather than throwing: a player whose
   * stored progress predates a change to this shape should lose the fields that
   * moved, not the ability to open the app.
   */
  restore(saved                                    )       {
    // Versions 2 and 3 hold the same Blackjack fields; version 3 only adds
    // `uth`, which is `UthSession`'s to read.
    if (!saved || (saved.version !== 1 && saved.version !== 2 && saved.version !== 3)) return;
    const n = (value         , fallback = 0)         =>
      typeof value === 'number' && Number.isFinite(value) ? value : fallback;

    if (typeof saved.name === 'string' && saved.name.trim().length > 0) {
      this.playerName = saved.name.trim().slice(0, 24);
    }
    this.hands = n(saved.hands);
    this.decisions = n(saved.decisions);
    this.correct = n(saved.correct);
    this.evLost = n(saved.evLost);
    this.netUnits = n(saved.netUnits);
    this.closeCalls = n(saved.closeCalls);
    this.closeCallsCorrect = n(saved.closeCallsCorrect);
    for (const tier of Object.keys(this.bySeverity)                  ) {
      this.bySeverity[tier] = n(saved.bySeverity?.[tier]);
    }
    /*
     * A version 1 blob holds one rating and the mode it was earned in. It goes
     * into that mode's slot, and the other two start fresh — which is the only
     * reading that loses nothing: the old shape never held the others, so there
     * is nothing to lose there, and putting the number anywhere else would
     * credit it to a ladder it was not climbed on.
     */
    if (saved.version === 1) {
      const rating = saved.rating;
      if (rating && typeof rating.rating === 'number') {
        const mode = RATING_MODES.includes(rating.mode) ? rating.mode : 'basic';
        this.ratings[mode] = { ...newRating(mode), ...rating, mode };
        this.mode = mode;
      }
      // v1 had no lifetime counter. The decisions it did record are the best
      // lower bound available, and a lower bound is safe here: the comparison
      // it feeds only ever needs to not go backwards.
      this.lifetimeDecisions = n(saved.decisions);
    } else {
      this.lifetimeDecisions = n(saved.lifetimeDecisions, n(saved.decisions));
      if (RATING_MODES.includes(saved.mode)) this.mode = saved.mode;
      for (const mode of RATING_MODES) {
        const rating = saved.ratings?.[mode];
        this.ratings[mode] =
          rating && typeof rating.rating === 'number'
            ? { ...newRating(mode), ...rating, mode }
            : newRating(mode);
      }
    }
    this.scenarioStats = new Map(
      (saved.scenarioStats ?? []).map((stat) => [stat.scenarioKey, { ...stat }]),
    );
    this.history = [...(saved.history ?? [])];
    // A restored session is between hands by construction, so nothing from the
    // previous one is left pointing at a table that no longer exists.
    this.pending = [];
    this.lastFeedback = null;
    this.lastRecord = null;
    this.countedHand = -1;
  }

  /** The ladder currently being climbed. */
          get rating()         {
    return this.ratings[this.mode];
  }

  /** The language in force, so a new session can carry it over. */
  get localeCode()         {
    return this.locale;
  }

  setLocale(locale        )       {
    if (locale !== 'en' && locale !== 'he') return;
    if (locale === this.locale) return;
    this.locale = locale;
    // The card on screen was composed in the old language. Compose it again
    // rather than leaving a Hebrew explanation under an English verdict — the
    // numbers are unchanged, so this is a re-render, not a re-grade.
    if (this.lastRecord) this.recompose(this.lastRecord);
  }

  /**
   * Rebuild the visible feedback card in the current language.
   *
   * Only the prose is rebuilt. Nothing here touches the running totals, the
   * rating or the history — a language change is not a decision, and grading it
   * twice would be a quiet way to corrupt a session.
   */
          recompose(record                )       {
    const scenario =
      record.scenarioKey === 'bj:insurance'
        ? ({ kind: 'insurance' }         )
        : parseScenarioKey(record.scenarioKey);
    const evaluation = {
      legalActions: record.legalActions                     ,
      evByAction: record.evByAction                                            ,
      optimalAction: record.optimalAction                   ,
      optimalEv: record.evByAction[record.optimalAction] ?? 0,
    };
    const explanation = explain(
      scenario,
      evaluation,
      this.rules,
      this.locale,
      record.chosenAction                   ,
    );
    const previous = this.lastFeedback                                  ;
    if (!previous) return;
    this.lastFeedback = {
      ...previous,
      headline: explanation.headline,
      steps: [...explanation.steps],
      counterNote: this.counterNote(record),
      chosenLabel: prettyAction(record.chosenAction, this.locale),
      optimalLabel: prettyAction(record.optimalAction, this.locale),
      optimalVerb:
        record.scenarioKey === 'bj:insurance'
          ? prettyAction(record.optimalAction, this.locale)
          : actionName(record.optimalAction                   , this.locale),
      ranked: (previous.ranked                                  ).map((entry) => ({
        ...entry,
        label: prettyAction(entry.action          , this.locale),
      })),
    };
  }

  setMode(mode                )       {
    // Nothing is created or destroyed here: all three ladders exist for the
    // life of the session, and this only says which one is being climbed.
    // Replacing the rating on the way past is how the Basic rating used to be
    // lost by visiting Recall and coming back.
    if (this.ratings[mode]) this.mode = mode;
  }

  /** The derived chart for the Reference screen (spec §10, screen 7). */
  get chart()          {
    const chart = chartFor(this.rules);
    const cells                         = {};
    for (const [key, cell] of chart.cells) cells[key] = cell.optimalAction;
    return { rulesKey: chart.rulesKey, cells };
  }
}

function prettyAction(action        , locale         = 'en')         {
  return t(locale, `action.${action}`);
}

/** Best total of a hand, for display. */
function totalOf(cards                   )         {
  let total = 0;
  let aces = 0;
  for (const card of cards) {
    const rank = rankOf(card);
    const value = rank === 12 ? 11 : rank >= 8 ? 10 : rank + 2;
    total += value;
    if (rank === 12) aces++;
  }
  while (total > 21 && aces > 0) {
    total -= 10;
    aces--;
  }
  return total;
}

/** A scenario key as it reads on the difficulty ladder: "8,8 vs 6". */
function describeScenarioKey(key        , locale         = 'en')         {
  if (key === 'bj:insurance') return t(locale, 'label.insurance');
  const scenario = parseScenarioKey(key);
  const up = key.slice(key.indexOf(':vs') + 3);
  if (scenario.kind === 'pair') {
    const rank = scenario.pairRank ;
    const label = rank === 0 ? 'A' : rank === 9 ? '10' : String(rank + 1);
    return t(locale, 'label.vs', { hand: `${label},${label}`, up });
  }
  if (scenario.kind === 'soft') {
    return t(locale, 'label.vs', { hand: `A,${(scenario.total ?? 0) - 11}`, up });
  }
  return t(locale, 'label.vs', { hand: String(scenario.total), up });
}

/**
 * An Ultimate Texas Hold'em session: the table, the stack, the stats, the hand
 * log, and the card that grades each decision (spec §5.2, §7.1, §9.2).
 *
 * A sibling of `TrainerSession` rather than a mode inside it. The two games
 * share the grading vocabulary — severity tiers, EV chips, a cost in units — and
 * the arithmetic of the stat strip, and nothing else: not a board, not a rating,
 * not a history. Folding them into one class would put two games' worth of
 * branches in the object that has to stay readable, and would make it possible
 * for a UTH hand to touch the Blackjack rating by accident. Kept apart, it is
 * not possible at all.
 *
 * Since round 4b this session is saved. It reads and writes the `uth` part of a
 * version 3 progress blob; the shell composes that with the Blackjack part into
 * the one record a browser and a player's row hold.
 *
 * Since round 5 it also explains in plain words: percentages on the river and
 * the hands that beat you, both final hands named at showdown with their five
 * cards, the starting hand described rather than written as "62s", and what the
 * suit is worth before the flop. Every figure still comes from the engine.
 */


/*
 * Named for the game rather than generically. The shared build folds every
 * module into one scope, and `session.ts` and `explain.ts` already declare
 * `RANKS`, `cardView`, `units` and `percent` — the bundler refuses the page
 * rather than let one silently shadow the other, which is what it did here.
 */
const POKER_RANKS = '23456789TJQKA';
const POKER_SUITS = ['♣', '♦', '♥', '♠'];

                                
               
               
               
                
                                                                                  
               
 

function pokerCardView(card      )                {
  const suit = suitOf(card);
  const rank = POKER_RANKS[rankOf(card)] ;
  return {
    rank: rank === 'T' ? '10' : rank,
    suit: POKER_SUITS[suit] ,
    red: suit === 1 || suit === 2,
    label: formatCard(card),
    code: card,
  };
}

/** A rank as it is printed on a card: 2–10, J, Q, K, A. */
const rankSymbol = (rank        )         => (rank === 8 ? '10' : POKER_RANKS[rank] );

/** The label key for each action, and the physical key that plays it. */
const ACTIONS                                                                  = {
  raise4x: { label: 'uth.raise4', key: '4', code: 'Digit4' },
  raise3x: { label: 'uth.raise3', key: '3', code: 'Digit3' },
  check: { label: 'uth.check', key: 'C', code: 'KeyC' },
  raise2x: { label: 'uth.raise2', key: '2', code: 'Digit2' },
  raise1x: { label: 'uth.raise1', key: '1', code: 'Digit1' },
  fold: { label: 'uth.fold', key: 'F', code: 'KeyF' },
};

const UTH_ACTIONS = Object.keys(ACTIONS)               ;
const TIERS                 = ['optimal', 'negligible', 'minor', 'significant', 'blunder'];

/**
 * Keep a figure in one piece inside right-to-left text.
 *
 * In a Hebrew sentence a signed number or a raise size is a left-to-right run
 * beside right-to-left words, and the bidirectional algorithm treats the sign
 * and the × as neutral characters that belong to whichever side they touch. On
 * the live page that turned "אנטה −1" into "אנטה 1−" and "העלאה 1×" into
 * "העלאה ×1" — a player reading the settlement saw the minus on the wrong side
 * of every loss. A left-to-right isolate (U+2066 … U+2069) makes each figure an
 * island the algorithm cannot split. English needs none, and gets none.
 */
const LRI = '⁦';
const PDI = '⁩';
const isolateFor = (locale        ) => (text        )         =>
  locale === 'he' ? `${LRI}${text}${PDI}` : text;

const uthUnits = (value        )         =>
  `${value < 0 ? '−' : '+'}${Math.abs(value).toFixed(3)}`;
const uthPercent = (value        )         => `${Math.round(value * 100)}%`;
/** A settlement figure: whole units where it is whole, otherwise one place. */
const money = (value        )         => {
  const text = Math.abs(value) % 1 === 0 ? Math.abs(value).toFixed(0) : Math.abs(value).toFixed(1);
  return `${value < 0 ? '−' : value > 0 ? '+' : ''}${text}`;
};

/**
 * Whole-number percentages that add to exactly 100.
 *
 * Rounding each share separately can show 83% + 11% + 5% = 99%, and a player who
 * adds them up — some will — has caught the page in a small lie. Largest
 * remainder: round everything down, then hand the missing points to the shares
 * that lost the most in rounding.
 */
function wholePercents(counts                   )           {
  const total = counts.reduce((sum, count) => sum + count, 0);
  if (total === 0) return counts.map(() => 0);
  const exact = counts.map((count) => (count * 100) / total);
  const floors = exact.map((value) => Math.floor(value));
  const missing = 100 - floors.reduce((sum, value) => sum + value, 0);
  const order = exact
    .map((value, index) => ({ remainder: value - floors[index] , index }))
    .sort((a, b) => b.remainder - a.remainder || a.index - b.index);
  for (let k = 0; k < missing; k++) floors[order[k] .index] ++;
  return floors;
}

/** Below this gap between the top two actions a decision is a coin-flip — Blackjack's figure. */
const UTH_CLOSE_CALL = 0.01;

/** How many finished hands the log and the saved record keep — Blackjack's figure. */
const UTH_HISTORY_KEPT = 40;

let perfectPlayEdge                = null;

/**
 * What the game takes from a player who never makes a mistake, as a percentage
 * of the Ante.
 *
 * Read off the solved pre-flop table: each class's best EV, weighted by how many
 * of the 1,326 starting hands fall in it — a pair 6, suited 4, offsuit 12. The
 * pre-flop EVs already assume the flop and river are then played perfectly, so
 * this is the whole game's edge, not the first decision's. It comes to 2.185%,
 * which is also the published figure; the stat strip's floor is this number.
 */
function uthPerfectPlayEdgePercent()         {
  if (perfectPlayEdge !== null) return perfectPlayEdge;
  let weight = 0;
  let ev = 0;
  for (const row of Object.values(PREFLOP_TABLE)) {
    const combinations = row.label.length === 2 ? 6 : row.label.endsWith('s') ? 4 : 12;
    weight += combinations;
    ev += combinations * Math.max(row.ev4x, row.ev3x, row.evCheck);
  }
  perfectPlayEdge = (-100 * ev) / weight;
  return perfectPlayEdge;
}
