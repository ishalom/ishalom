<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>EV Trainer</title>
    <link rel="stylesheet" href="/styles.css" />
    <script src="/fontswitch.js"></script>
  </head>
  <body>
    <div class="shell">
      <!--
        The front of the app is a greeting and two doors. Everything measured
        lives behind a tab, because a wall of figures is not a welcome — and
        §3.1 would rather you came here to play than to check a scoreboard.
      -->
      <section class="hero">
        <div class="hero-top">
          <div class="initial" id="initial">P</div>
          <input class="who-name" id="name" value="Player" aria-label="Your name" spellcheck="false" />
        </div>
        <p class="hero-line" id="greeting">Good to see you.</p>
      </section>

      <section class="doors">
        <a class="door" href="/table.html">
          <span class="door-pip">♠</span>
          <span class="door-title">Blackjack</span>
          <span class="door-sub" id="bj-sub">Play a hand</span>
        </a>
        <a class="door secondary" href="/ultimate.html">
          <span class="door-pip">♦</span>
          <span class="door-title">Ultimate</span>
          <span class="door-sub">Look around <span class="tag">preview</span></span>
        </a>
      </section>

      <nav class="tabs" role="tablist" aria-label="Your play">
        <button class="tab" role="tab" data-tab="standing" aria-selected="true">Standing</button>
        <button class="tab" role="tab" data-tab="hands" aria-selected="false">Hands</button>
        <button class="tab" role="tab" data-tab="stats" aria-selected="false">Stats</button>
      </nav>

      <section class="tab-body" id="panel-standing" role="tabpanel">
        <div class="standing">
          <div class="standing-value" id="rating">—</div>
          <div class="standing-label" id="rating-label">rating</div>
          <p class="standing-note" id="rating-note"></p>
        </div>
        <div class="modes" role="group" aria-label="What you are drilled on">
          <button class="mode" type="button" data-mode="basic" aria-pressed="true">
            Basic<small>the costly hands</small>
          </button>
          <button class="mode" type="button" data-mode="recall" aria-pressed="false">
            Recall<small>thin and rare</small>
          </button>
          <button class="mode" type="button" data-mode="value" aria-pressed="false">
            Value<small>your own leaks</small>
          </button>
        </div>
        <div id="ladder" class="ladder"></div>
      </section>

      <section class="tab-body" id="panel-hands" role="tabpanel" hidden>
        <div id="hands"></div>
      </section>

      <section class="tab-body" id="panel-stats" role="tabpanel" hidden>
        <div id="stats"></div>
      </section>

      <p class="footer" id="footer"></p>
    </div>

    <script src="/home.js"></script>
  </body>
</html>
