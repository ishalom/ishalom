<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="i18n-title" content="ui.ultimateTitle" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>EV Trainer — Ultimate Texas Hold'em</title>
    <link rel="stylesheet" href="/styles.css" />
    <script src="/i18n.js"></script>
    <script src="/i18n-client.js"></script>
    <script src="/fontswitch.js"></script>
  </head>
  <body>
    <div class="shell uth">
      <!-- The rules are a statement, as on the Blackjack table. There is one
           paytable and it is the one the pre-flop table was solved against, so
           nothing here offers to change it. -->
      <header class="rules" id="rules-bar">
        <a class="back" href="/home.html">‹ <span data-i18n="ui.home">Home</span></a>
        <div class="rules-main">
          <span class="rules-name" data-i18n="ui.ultimateTitle">Ultimate Texas Hold’em</span>
          <span class="rules-badge" data-i18n="uth.rulesLine">Blind pays a straight or better · dealer qualifies with a pair</span>
        </div>
      </header>

      <main class="table felt uth-felt" id="uth-table">
        <section class="seat" data-i18n-attr="aria-label:ui.dealer">
          <h2 class="seat-title"><span data-i18n="ui.dealer">Dealer</span></h2>
          <div class="cards" id="uth-dealer"></div>
        </section>

        <section class="seat uth-board" data-i18n-attr="aria-label:uth.board">
          <h2 class="seat-title"><span data-i18n="uth.board">Board</span></h2>
          <div class="cards" id="uth-board"></div>
        </section>

        <section class="seat" data-i18n-attr="aria-label:ui.yourHand">
          <h2 class="seat-title">
            <span data-i18n="ui.you">You</span>
            <span class="seat-total" id="uth-class"></span>
          </h2>
          <div class="cards" id="uth-hole"></div>
          <!-- Ante, Blind and Play, and the stack behind them. -->
          <div class="uth-rail" id="uth-rail"></div>
          <p class="uth-memory" data-i18n="uth.memoryOnly">Practice stack — it resets when you close the tab.</p>
        </section>

        <p class="empty" id="uth-empty" data-i18n="uth.pressDeal">Deal to post Ante 1 and Blind 1.</p>
      </main>

      <div class="dock">
        <!-- The grade first; the result under it, later and quieter (§3.1). -->
        <section class="quickcard" id="uth-card" hidden aria-live="polite"></section>
        <nav class="actions" id="uth-actions" data-i18n-attr="aria-label:ui.actions"></nav>
      </div>

      <p class="uth-keys" data-i18n="uth.keys">Keys: 4 · 3 · C before the flop, 2 · C on the flop, 1 · F on the river, N for the next hand.</p>
    </div>

    <script src="/ultimate.js"></script>
  </body>
</html>
